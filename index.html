    '4-3': { numbers: null,       make: 'makeF3', title: '第 3 关', tutorial: true },
    '4-4': { numbers: null,       make: 'makeF4', title: '第 4 关', tutorial: true },
    '4-5': { numbers: null,       make: 'makeF5', title: '第 5 关', tutorial: true }
  };

  function levelDef(island, level) {
    return LEVEL_DEFS[island + '-' + level] || null;
  }

  function playableContent(island, level) {
    return !!levelDef(island, level);
  }

  /** 岛屿图标：第 1 岛用 3D 苹果，第 2 岛用三色形状，第 3 岛用 3D 大象，第 4 岛用 3D 狮子，其余暂用 emoji */
  function islandIconNode(index, island) {
    if (index === 1) return fruitImg(FRUITS[0]);
    if (index === 3) {
      var el = animalImg('elephant', 'fruit-img');
      if (el) return el;
    }
    // 第 4 岛是「动物与动作」，岛上已经有 14 张 3D 动物图，地图图标也用 3D 狮子（RULES §二.5 禁止 emoji 充当配图）
    if (index === 4) {
      var lion = animalImg('lion', 'fruit-img');
      if (lion) return lion;

      var box = document.createElementNS(SVG_NS, 'svg');
      box.setAttribute('viewBox', '0 0 100 60');
      box.setAttribute('class', 'mini-shapes');
      box.innerHTML =
        '<circle cx="20" cy="30" r="15" fill="#EA5A4F"/>' +
        '<rect x="41" y="15" width="30" height="30" rx="8" fill="#F3B93E"/>' +
        '<path d="M80 12c2 0 3 1 4 2l11 20c1 3-1 5-4 5H69c-3 0-5-2-4-5l11-20c1-1 2-2 4-2z" fill="#4C8FE8"/>';
      return box;
    }
    var span = document.createElement('span');
    span.textContent = island.icon;
    return span;
  }

  function renderIsland() {
    var island = ISLANDS[currentIsland - 1];

    islandHead.innerHTML = '';
    var icon = document.createElement('div');
    icon.className = 'big-icon';
    icon.appendChild(islandIconNode(currentIsland, island));
    var titles = document.createElement('div');
    titles.className = 'titles';
    var t1 = document.createElement('div');
    t1.className = 't1';
    t1.textContent = '第 ' + currentIsland + ' 岛 · ' + island.name;
    var t2 = document.createElement('div');
    t2.className = 't2';
    t2.textContent = '共 ' + LEVELS_PER_ISLAND + ' 关';
    titles.appendChild(t1);
    titles.appendChild(t2);
    islandHead.appendChild(icon);
    islandHead.appendChild(titles);

    nodeList.innerHTML = '';
    for (var level = 1; level <= LEVELS_PER_ISLAND; level++) {
      (function (level) {
        var row = document.createElement('div');
        row.className = 'node-row';

        var label = document.createElement('span');
        label.className = 'node-label ' + (level % 2 ? 'right' : 'left');
        label.textContent = '第 ' + level + ' 关';

        var node = document.createElement('button');
        node.type = 'button';
        node.dataset.level = String(level);

        var unlocked = isLevelUnlocked(currentIsland, level);
        var cleared = !!progress.cleared[currentIsland + '-' + level];
        var playable = playableContent(currentIsland, level);

        node.className = 'node' + (cleared ? ' done' : '') +
          (unlocked ? '' : ' locked') + (unlocked && playable && !cleared ? ' playable' : '');
        node.textContent = cleared ? '⭐' : (unlocked ? String(level) : '🔒');
        node.setAttribute('aria-label', '第' + level + '关');

        node.addEventListener('click', function () {
          if (!unlocked) { playComingSoon(); return; }
          if (!playable) { playComingSoon(); toast('这一关还在准备中'); return; }
          enterLevel(level);
        });

        if (level % 2) { row.appendChild(label); row.appendChild(node); }
        else { row.appendChild(node); row.appendChild(label); }
        nodeList.appendChild(row);

        if (level < LEVELS_PER_ISLAND) {
          var line = document.createElement('div');
          line.className = 'path-line';
          nodeList.appendChild(line);
        }
      })(level);
    }

    btnBack.hidden = false;
  }

  /* ---------------- 关卡引擎 ---------------- */

  var state = {
    phase: 'idle',
    plan: [],
    roundIndex: 0,
    stars: 0,
    question: null,
    busy: false,
    level: 1,           // 当前关卡（岛内关号），决定题库与出题函数
    drag: null,         // 第 5 关：正在拖拽的上下文
    pickedFruit: null   // 第 5 关题型 B：已点选的水果下标
  };

  /** 按当前关卡生成一道题 */
  function newQuestion(typeIdx, prev) {
    var def = levelDef(currentIsland, state.level);
    if (def && def.make === 'makeW2') return makeQuestionW2(typeIdx, prev);
    if (def && def.make === 'makeW3') return makeQuestionW3(typeIdx, prev);
    if (def && def.make === 'makeW4') return makeQuestionW4(typeIdx, prev);
    if (def && def.make === 'makeW5') return makeQuestionW5(typeIdx, prev);
    if (def && def.make === 'makeS1') return makeQuestionS1(typeIdx, prev);
    if (def && def.make === 'makeP2') return makeQuestionP2(typeIdx, prev);
    if (def && def.make === 'makeP3') return makeQuestionP3(typeIdx, prev);
    if (def && def.make === 'makeP4') return makeQuestionP4(typeIdx, prev);
    if (def && def.make === 'makeP5') return makeQuestionP5(typeIdx, prev);
    if (def && def.make === 'makeB1') return makeQuestionB1(typeIdx, prev);
    if (def && def.make === 'makeB2') return makeQuestionB2(typeIdx, prev);
    if (def && def.make === 'makeB3') return makeQuestionB3(typeIdx, prev);
    if (def && def.make === 'makeB4') return makeQuestionB4(typeIdx, prev);
    if (def && def.make === 'makeB5') return makeQuestionB5(typeIdx, prev);
    if (def && def.make === 'makeF1') return makeQuestionF1(typeIdx, prev);
    if (def && def.make === 'makeF2') return makeQuestionF2(typeIdx, prev);
    if (def && def.make === 'makeF3') return makeQuestionF3(typeIdx, prev);
    if (def && def.make === 'makeF4') return makeQuestionF4(typeIdx, prev);
    if (def && def.make === 'makeF5') return makeQuestionF5(typeIdx, prev);
    return makeQuestion(typeIdx, prev);
  }

  /** 是否为本项目自定义题型的关卡（第 2/3 关），第 1 关保留新手小手提示 */
  function isCustomLevel() {
    var def = levelDef(currentIsland, state.level);
    return !!(def && def.make);
  }

  var starEls = [];

  function buildStars() {
    starsBox.innerHTML = '';
    starEls = [];
    for (var i = 0; i < TOTAL_ROUNDS; i++) {
      var s = starSvg('star');
      starsBox.appendChild(s);
      starEls.push(s);
    }
  }

  function lightStar(index) {
    var s = starEls[index];
    if (s) s.classList.add('on');
  }

  function clearStars() {
    starEls.forEach(function (s) { s.classList.remove('on'); });
  }

  function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function pick(list, exclude) {
    var pool = list.filter(function (v) { return v !== exclude; });
    if (!pool.length) pool = list.slice();
    return pool[randInt(0, pool.length - 1)];
  }

  function withDistractors(pool, answer) {
    var others = shuffle(pool.filter(function (v) { return v !== answer; })).slice(0, 2);
    return shuffle([answer].concat(others));
  }

  function makePlan() {
    var plan = [];
    for (var i = 0; i < TOTAL_ROUNDS; i++) plan.push(i % 3);
    shuffle(plan);
    for (var k = 1; k < plan.length; k++) {
      if (plan[k] === plan[k - 1]) {
        for (var m = k + 1; m < plan.length; m++) {
          if (plan[m] !== plan[k - 1]) { var t = plan[k]; plan[k] = plan[m]; plan[m] = t; break; }
        }
      }
    }
    return plan;
  }

  var usedPairs = {};   // 本局已用过的「数字-水果」组合，避免重复出题

  /** 第 2 关题库：数字 16–20 × 四种水果，题型 A/B/C 轮转 */
  function makeQuestionW2(type, prev) {
    var num, fruit, pairKey, guard = 0;
    do {
      num = pick(NUMBERS_W2, prev ? prev.num : null);
      fruit = pick(FRUITS, prev ? prev.fruit : null);
      pairKey = num + '-' + fruit.id;
      guard += 1;
    } while (usedPairs[pairKey] && guard < 60);
    usedPairs[pairKey] = true;

    if (type === 0) {
      // 题型 A：屏幕三堆不同数量的十格阵果堆，听数字选对应堆
      var counts = withDistractors(NUMBERS_W2, num);
      return {
        type: 'W2A', num: num, fruit: fruit,
        options: counts.map(function (v) { return { kind: 'tf', count: v, fruit: fruit }; }),
        correct: counts.indexOf(num),
        audio: ['n' + num]
      };
    }

    if (type === 1) {
      // 题型 B：三张数字标牌（带小水果图标），听 "Find seventeen bananas." 选标牌
      var nums = withDistractors(NUMBERS_W2, num);
      return {
        type: 'W2B', num: num, fruit: fruit,
        options: nums.map(function (v) { return { kind: 'sign2', value: v, fruit: fruit }; }),
        correct: nums.indexOf(num),
        audio: ['q_' + num + '_' + fruit.id]
      };
    }

    // 题型 C：喂食机。三堆松散水果（约 5 / 约 num / 约 35），凭估数选对的喂怪兽
    var small = 5;
    var big = 35;
    var spread = shuffle([small, num, big]);
    return {
      type: 'W2C', num: num, fruit: fruit,
      options: spread.map(function (v) { return { kind: 'loose', count: v, fruit: fruit }; }),
      correct: spread.indexOf(num),
      audio: ['c_' + num + '_' + fruit.id]
    };
  }

  /** 第 3 关题库：数字 21–29 与短句组合，题型 A/B/C 轮转 */
  function makeQuestionW3(type, prev) {
    var pairKey, guard = 0;

    if (type === 1) {
      // 题型 B：听短句找组合图。答案 = (小数量 2–5, 水果)。
      // 三个选项的「数量 + 水果」各不相同（如 2 苹果 / 3 香蕉 / 4 草莓），
      // 必须整句都听懂才能选对，不能靠"数一数"或"只看水果"蒙。
      var count, fruitB;
      do {
        count = pick(SMALL_COUNTS, prev && prev.type === 'W3B' ? prev.num : null);
        fruitB = pick(FRUITS, prev && prev.type === 'W3B' ? prev.fruit : null);
        pairKey = count + '-' + fruitB.id;
        guard += 1;
      } while (usedPairs[pairKey] && guard < 60);
      usedPairs[pairKey] = true;

      var others = shuffle(FRUITS.filter(function (f) { return f.id !== fruitB.id; })).slice(0, 2);
      var otherCounts = shuffle(SMALL_COUNTS.filter(function (c) { return c !== count; }));
      var list = shuffle([fruitB].concat(others));
      var order = list.map(function (f) { return f.id; });
      return {
        type: 'W3B', num: count, fruit: fruitB,
        options: list.map(function (f) {
          return { kind: 'combo', count: f.id === fruitB.id ? count : otherCounts.pop(), fruit: f };
        }),
        correct: order.indexOf(fruitB.id),
        audio: ['q_' + count + '_' + fruitB.id]
      };
    }

    var num, fruit;
    do {
      num = pick(NUMBERS_W3, prev ? prev.num : null);
      fruit = pick(FRUITS, prev ? prev.fruit : null);
      pairKey = num + '-' + fruit.id;
      guard += 1;
    } while (usedPairs[pairKey] && guard < 60);
    usedPairs[pairKey] = true;

    if (type === 0) {
      // 题型 A：只听 "Twenty-four"，在三个巨大 3D 数字底板里点对的那个
      var nums = withDistractors(NUMBERS_W3, num);
      return {
        type: 'W3A', num: num, fruit: fruit,
        options: nums.map(function (v) { return { kind: 'slab', value: v }; }),
        correct: nums.indexOf(num),
        audio: ['n' + num]
      };
    }

    // 题型 C：数数大挑战。中央十格阵果堆（如 10+10+5=25），
    // 语音 "How many strawberries?" → "Twenty-five."，选三个数字之一
    var counts = withDistractors(NUMBERS_W3, num);
    return {
      type: 'W3C', num: num, fruit: fruit,
      options: counts.map(function (v) { return { kind: 'slab', value: v }; }),
      correct: counts.indexOf(num),
      audio: ['howmany_' + fruit.id, 'n' + num]
    };
  }

  /** 第 4 关题库：颜色初体验（红/蓝/黄/绿），题型 A/B/C 轮转 */
  /**
   * 从「本局还没用过的组合」里直接挑一个（用尽则重置池子）。
   * 不用 while 重试：那种写法在池子快耗尽时会走满 guard 次数仍接受重复，
   * 实测出现过同一局两道「蓝色汽车」。这里从剩余集合挑，天然不重复。
   */
  function takeFresh(combos, used, prevKey) {
    var pool = combos.filter(function (c) { return !used[c.key]; });
    if (!pool.length) {
      combos.forEach(function (c) { delete used[c.key]; });
      pool = combos.slice();
    }
    var fresh = pool.filter(function (c) { return c.key !== prevKey; });
    if (fresh.length) pool = fresh;
    var chosen = pool[randInt(0, pool.length - 1)];
    used[chosen.key] = true;
    return chosen;
  }

  function makeQuestionW4(type, prev) {
    var prevKey = prev ? (prev.type + '|' + (prev.color ? prev.color.id : '') + '|' + (prev.item ? prev.item.id : '')) : null;

    if (type === 2) {
      // 题型 C：灰色物品 + 三个颜色按钮，"Make the car red."
      var combosC = [];
      PAINT_ITEMS.forEach(function (it) {
        COLORS.forEach(function (c) {
          combosC.push({ key: 'C|' + it.id + '|' + c.id, item: it, color: c });
        });
      });
      var pickC = takeFresh(combosC, usedPairs, prevKey);
      var paint = withColorDistractors(pickC.color);
      return {
        type: 'W4C', item: pickC.item, color: pickC.color,
        options: paint.map(function (c) { return { kind: 'colorBtn', color: c }; }),
        correct: paint.indexOf(pickC.color),
        audio: ['mk_' + pickC.item.id + '_' + pickC.color.id]
      };
    }

    var combos = COLORS.map(function (c) {
      return { key: (type === 0 ? 'A|' : 'B|') + c.id, color: c };
    });
    var pk = takeFresh(combos, usedPairs, prevKey);
    var color = pk.color;
    var opts = withColorDistractors(color);

    if (type === 0) {
      // 题型 A：三个不同颜色的 3D 气球，只听颜色名
      return {
        type: 'W4A', color: color,
        options: opts.map(function (c) { return { kind: 'colorBalloon', color: c }; }),
        correct: opts.indexOf(color),
        audio: ['col_' + color.id]
      };
    }

    // 题型 B：三个不同颜色的苹果，"Find the red apple."
    return {
      type: 'W4B', color: color,
      options: opts.map(function (c) { return { kind: 'colorFruit', color: c, fruit: 'apple' }; }),
      correct: opts.indexOf(color),
      audio: ['fb_' + color.id]
    };
  }

  /** 把中央的灰色物品刷成目标颜色（题型 C 答对反馈） */
  function paintItem(asset, color) {
    var wrap = askDisplay.querySelector('.paint-wrap');
    if (!wrap) return;
    var old = wrap.querySelector('img');
    var img = assetImg(asset + '_' + color.id, 'paint-item painted');
    if (!img) return;
    if (old) wrap.replaceChild(img, old);
    else wrap.appendChild(img);
  }

  /** 第 5 关题库：游乐场终极考验（拖拽 + 综合运用） */
  function makeQuestionW5(type, prev) {
    var prevKey = prev ? (prev.type + '|' + (prev.color ? prev.color.id : '') + '|' +
      (prev.item ? prev.item.id : '') + '|' + (prev.num || '')) : null;

    if (type === 0) {
      // 题型 A：把小怪兽要的果篮拖给它。三个篮子＝十格阵果堆，只有一篮数量正确
      var combosA = [];
      W5_NUMBERS.forEach(function (n) {
        FRUITS.forEach(function (f) {
          combosA.push({ key: 'A|' + n + '|' + f.id, num: n, fruit: f });
        });
      });
      var pickA = takeFresh(combosA, usedPairs, prevKey);

      // 干扰果堆：数量与正确值不同，且彼此不同
      var others = shuffle(W5_PILE_POOL.filter(function (n) { return n !== pickA.num; })).slice(0, 2);
      var counts = shuffle([pickA.num].concat(others));

      return {
        type: 'W5A', num: pickA.num, fruit: pickA.fruit,
        options: counts.map(function (c) { return { kind: 'basketPile', count: c, fruit: pickA.fruit }; }),
        correct: counts.indexOf(pickA.num),
        audio: ['c_' + pickA.num + '_' + pickA.fruit.id]
      };
    }

    if (type === 1) {
      // 题型 B：把指定颜色的水果拖进同色篮子
      var combosB = [];
      W5_COLORS.forEach(function (c) {
        W5_CFRUITS.forEach(function (f) {
          combosB.push({ key: 'B|' + c.id + '|' + f.id, color: c, fruit: f });
        });
      });
      var pickB = takeFresh(combosB, usedPairs, prevKey);

      // 托盘里 3 个水果：正确那一个 + 2 个干扰（颜色或水果不同）
      var tray = [pickB];
      var pool = [];
      W5_COLORS.forEach(function (c) {
        W5_CFRUITS.forEach(function (f) {
          if (!(c.id === pickB.color.id && f.id === pickB.fruit.id)) {
            pool.push({ color: c, fruit: f });
          }
        });
      });
      pool = shuffle(pool);
      // 优先放一个「同色异果」，逼孩子两条线索都听懂
      var sameColor = pool.filter(function (p) {
        return p.color.id === pickB.color.id;
      });
      if (sameColor.length) {
        tray.push(sameColor[0]);
        pool = pool.filter(function (p) { return p !== sameColor[0]; });
      }
      while (tray.length < 3 && pool.length) tray.push(pool.pop());
      shuffle(tray);

      var correctFruit = tray.findIndex(function (t) {
        return t.color.id === pickB.color.id && t.fruit.id === pickB.fruit.id;
      });

      var baskets = shuffle(W5_COLORS.map(function (c) { return { kind: 'basketColor', color: c }; }));

      return {
        type: 'W5B', color: pickB.color, fruit: pickB.fruit, item: pickB.fruit,
        tray: tray, correctFruit: correctFruit,
        options: baskets,
        correct: baskets.map(function (b) { return b.color.id; }).indexOf(pickB.color.id),
        audio: ['pb_' + pickB.color.id + '_' + pickB.fruit.id]
      };
    }

    // 题型 C：三张大卡片 = (数量 + 颜色) 组合，直接点选
    var combosC = [];
    SMALL_COUNTS.forEach(function (n) {
      W5_COLORS.forEach(function (c) {
        combosC.push({ key: 'C|' + n + '|' + c.id, num: n, color: c });
      });
    });
    var pickC = takeFresh(combosC, usedPairs, prevKey);

    var cards = [pickC];
    var otherPool = shuffle(combosC.filter(function (x) {

  /* ---- 题库 ---- */

  function makeQuestionP2(type, prev) {
    if (type === 0) {
      // 题型 A：三个盒子场景（里面 / 上面 / 旁边），听整句找位置
      var aCombos = P2_POS.map(function (p) { return { key: 'A-' + p, pos: p }; });
      var aPrev = (prev && prev.type === 'P2A') ? 'A-' + prev.pos : null;
      var pos = takeFresh(aCombos, usedPairs, aPrev).pos;
      var list = shuffle(P2_POS.slice());
      return {
        type: 'P2A', pos: pos,
        options: list.map(function (p) { return { kind: 'posScene', pos: p }; }),
        correct: list.indexOf(pos),
        audio: ['p_where', P2_SENTENCE[pos]]
      };
    }

    if (type === 1) {
      // 题型 B：听 "Put the apple on the table."，把对应物品拖到桌上
      var bCombos = P2_ITEMS.map(function (it) { return { key: 'B-' + it.id, item: it }; });
      var bPrev = (prev && prev.type === 'P2B') ? 'B-' + prev.item.id : null;
      var item = takeFresh(bCombos, usedPairs, bPrev).item;
      var itemOpts = shuffle(P2_ITEMS.slice());
      return {
        type: 'P2B', item: item,
        options: itemOpts.map(function (it) { return { kind: 'p2item', item: it }; }),
        correct: itemOpts.indexOf(item),
        audio: [item.audio]
      };
    }

    // 题型 C：看图判断句子对错（✅ / ❌）
    var cCombos = P2_VERDICTS.map(function (v) { return { key: 'C-' + v.key, v: v }; });
    var cPrev = (prev && prev.type === 'P2C') ? 'C-' + prev.verdict.key : null;
    var verdict = takeFresh(cCombos, usedPairs, cPrev).v;

    // 对错交替出现，保证一局里 ✅ 与 ❌ 都有，不靠运气
    state.vFlip = !state.vFlip;
    var truth = state.vFlip;
    var sentence = truth ? verdict.match : verdict.mismatch;

    var opts = shuffle([{ kind: 'yesNo', val: true }, { kind: 'yesNo', val: false }]);
    return {
      type: 'P2C', verdict: verdict, kind: verdict.kind, truth: truth, sentence: sentence,
      options: opts,
      correct: opts[0].val === truth ? 0 : 1,
      audio: [sentence, 'yesno']
    };
  }

  /** 3D 金星（五角星，尖端用同色粗描边磨圆） */
  function p4StarStr(cx, cy, r) {
    var gid = p4G('p4star');
    var pts = [];
    for (var i = 0; i < 10; i++) {
      var ang = -Math.PI / 2 + i * Math.PI / 5;
      var rad = (i % 2 === 0) ? r : r * 0.46;
      pts.push((cx + rad * Math.cos(ang)).toFixed(2) + ',' + (cy + rad * Math.sin(ang)).toFixed(2));
    }
    return '<defs><radialGradient id="' + gid + '" cx="36%" cy="26%" r="80%">' +
        '<stop offset="0%" stop-color="#fff3b8"/><stop offset="52%" stop-color="#ffd12a"/>' +
        '<stop offset="100%" stop-color="#eda206"/></radialGradient></defs>' +
      '<polygon points="' + pts.join(' ') + '" fill="url(#' + gid + ')" stroke="url(#' + gid + ')" ' +
        'stroke-width="' + (r * 0.26).toFixed(2) + '" stroke-linejoin="round"/>' +
      '<circle cx="' + (cx - r * 0.14).toFixed(2) + '" cy="' + (cy - r * 0.12).toFixed(2) + '" r="' +
        (r * 0.13).toFixed(2) + '" fill="#fffdf2" opacity=".85"/>';
  }

  /** 立体圆环（evenodd 挖洞），用来表示"圆圈"，星星才能"在圈里" */
  function p4RingStr(cx, cy, R, r, c1, c2) {
    var gid = p4G('p4ring');
    return '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0.2" y2="1">' +
        '<stop offset="0%" stop-color="' + c1 + '"/><stop offset="100%" stop-color="' + c2 + '"/></linearGradient></defs>' +
      '<path fill-rule="evenodd" fill="url(#' + gid + ')" d="' +
        'M' + (cx - R) + ' ' + cy + 'a' + R + ' ' + R + ' 0 1 0 ' + (R * 2) + ' 0a' + R + ' ' + R + ' 0 1 0 ' + (-R * 2) + ' 0z ' +
        'M' + (cx - r) + ' ' + cy + 'a' + r + ' ' + r + ' 0 1 0 ' + (r * 2) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + (-r * 2) + ' 0z' +
        '"/>' +
      '<path d="M' + (cx - R * 0.68).toFixed(1) + ' ' + (cy - R * 0.68).toFixed(1) +
        'a' + R + ' ' + R + ' 0 0 1 ' + (R * 0.46).toFixed(1) + ' ' + (-R * 0.2).toFixed(1) +
        '" fill="none" stroke="#ffffff" stroke-width="' + (R * 0.14).toFixed(1) +
        '" stroke-linecap="round" opacity=".55"/>';

    svg.setAttribute('class', 'p2-scene-svg');
    // 长方形先画、正方形压上去：长方形只露出右边一截，读起来就是"在正方形后面"
    svg.innerHTML = p4RoundRect(48, 20, 38, 52, '#8ecf9a', 0.96) +
      '<ellipse cx="50" cy="90" rx="30" ry="4" fill="#8a6a48" opacity=".12"/>' +
      p4RoundRect(16, 28, 52, 52, '#f3b93e', 0.97);
    wrap.appendChild(svg);
    return wrap;
  }

  /** 题型 B：中央透明正方形 + 放宽一圈的投放区（三岁孩子拖不稳，RULES §二.10） */
  function p5SquareStage() {
    var d = document.createElement('div');
    d.className = 'p4-square-stage p5-square-stage';
    d.dataset.drop = 'target';

    // 宽出 10% 的透明判定垫：落在框边上也算放进去
    var pad = document.createElement('div');
    pad.className = 'p5-drop-pad';
    pad.dataset.drop = 'target';
    d.appendChild(pad);

    var svg = svgEl('svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('class', 'p4-frame-svg');
    svg.innerHTML = p4SquareFrameStr();
    d.appendChild(svg);

    var slot = document.createElement('div');
    slot.className = 'p4-square-slot';
    d.appendChild(slot);

    d.addEventListener('click', function () {
      if (state.phase !== 'asking' || state.busy) return;
      if (state.pickedFruit === null) return;
      resolveP5B(state.pickedFruit, d);
    });
    return d;
  }

  function makeQuestionP5(type, prev) {
    if (type === 0) {
      // 题型 A：三个场景（星星在圈上 / 圈里 / 圈后），听 "Where is the star?" + 整句
      var aCombos = P5_POS.map(function (p) { return { key: 'A-' + p, pos: p }; });
      var aPrev = (prev && prev.type === 'P5A') ? 'A-' + prev.pos : null;
      var pos = takeFresh(aCombos, usedPairs, aPrev).pos;
      var list = shuffle(P5_POS.slice());
      return {
        type: 'P5A', pos: pos,
        options: list.map(function (p) { return { kind: 'p5star', pos: p }; }),
        correct: list.indexOf(pos),
        audio: ['p5_where_star', P5_POS_SENT[pos]]
      };
    }

    if (type === 1) {
      // 题型 B：把"圆苹果 / 三角披萨 / 长方书"拖进中央的透明正方形
      var bCombos = P5_ITEMS.map(function (it) { return { key: 'B-' + it.key, item: it }; });
      var bPrev = (prev && prev.type === 'P5B') ? 'B-' + prev.item.key : null;
      var item = takeFresh(bCombos, usedPairs, bPrev).item;
      var itemOpts = shuffle(P5_ITEMS.slice());
      return {
        type: 'P5B', item: item,
        options: itemOpts.map(function (it) { return { kind: 'p5item', item: it }; }),
        correct: itemOpts.indexOf(item),
        audio: [item.audio]
      };
    }

    // 题型 C：夸张场景对错（三角形坐在正方形上 / 圆形在正方形里 / 长方形在正方形后）
    var cCombos = P5_VERDICTS.map(function (v) { return { key: 'C-' + v.key, v: v }; });
    var cPrev = (prev && prev.type === 'P5C') ? 'C-' + prev.verdict.key : null;
    var verdict = takeFresh(cCombos, usedPairs, cPrev).v;

    state.vFlip = !state.vFlip;
    var truth = state.vFlip;
    var sentence = truth ? verdict.match : verdict.mismatch;

    var opts = shuffle([{ kind: 'yesNo', val: true }, { kind: 'yesNo', val: false }]);
    return {
      type: 'P5C', verdict: verdict, kind: verdict.kind, truth: truth, sentence: sentence,
      options: opts,
      correct: opts[0].val === truth ? 0 : 1,
      audio: [sentence, 'yesno']
    };
  }

  /* ---------------- 第 3 岛第 1 关：大与小（Big / Small） ---------------- */

  /** 题型 A/C 的对比物品：同一件东西分大号与小号（用同一张 3D 素材，只改显示尺寸） */
  var B1_ITEMS = [
    { id: 'apple',   asset: 'apple',
      big: 'l3_find_big_apple',   small: 'l3_find_small_apple',
      putBig: 'l3_put_big_apple', putSmall: 'l3_put_small_apple' },
    { id: 'balloon', asset: 'balloon_red',
      big: 'l3_find_big_balloon', small: 'l3_find_small_balloon',
      putBig: 'l3_put_big_balloon', putSmall: 'l3_put_small_balloon' },
    { id: 'car',     asset: 'car_red',
      big: 'l3_find_big_car',     small: 'l3_find_small_car' }
  ];

  /** 题型 B 的动物：每只动物都有「大 / 小」两条陈述句 */
  var B1_ANIMALS = [
    { id: 'elephant', big: 'l3_el_big',    small: 'l3_el_small' },
    { id: 'dog',      big: 'l3_dog_big',   small: 'l3_dog_small' },
    { id: 'cat',      big: 'l3_cat_big',   small: 'l3_cat_small' },
    { id: 'mouse',    big: 'l3_mouse_big', small: 'l3_mouse_small' }
  ];

  function b1Sentence(animal, size) { return size === 'big' ? animal.big : animal.small; }
  /** 选项洗过牌，正确下标必须按「尺寸」重新找，不能写死 0/1 */
  function b1IndexOfSize(opts, size) {
    for (var i = 0; i < opts.length; i++) if (opts[i].size === size) return i;
    return 0;
  }

  function makeQuestionB1(type, prev) {
    if (type === 0) {
      // 题型 A：一大一小两个相同物品，听 "Find the big car." 点大的那个
      var aCombos = [];
      B1_ITEMS.forEach(function (it) {
        aCombos.push({ key: 'A-' + it.id + '-big', item: it, size: 'big' });
        aCombos.push({ key: 'A-' + it.id + '-small', item: it, size: 'small' });
      });
      var aPrev = (prev && prev.type === 'B1A') ? 'A-' + prev.item.id + '-' + prev.size : null;
      var pickA = takeFresh(aCombos, usedPairs, aPrev);
      var aOpts = shuffle([
        { kind: 'bsItem', asset: pickA.item.asset, size: 'big' },
        { kind: 'bsItem', asset: pickA.item.asset, size: 'small' }
      ]);
      return {
        type: 'B1A', item: pickA.item, size: pickA.size,
        options: aOpts,
        correct: b1IndexOfSize(aOpts, pickA.size),
        audio: [pickA.size === 'big' ? pickA.item.big : pickA.item.small]
      };
    }

    if (type === 1) {
      // 题型 B：三只动物，只有一只与指令里的大小一致
      //   例："The elephant is big." + "The cat is small." + "Find the big one." → 点大象
      var bCombos = [];
      B1_ANIMALS.forEach(function (an) {
        bCombos.push({ key: 'B-' + an.id + '-big', animal: an, size: 'big' });
        bCombos.push({ key: 'B-' + an.id + '-small', animal: an, size: 'small' });
      });
      var bPrev = (prev && prev.type === 'B1B') ? 'B-' + prev.animal.id + '-' + prev.size : null;
      var pickB = takeFresh(bCombos, usedPairs, bPrev);
      var othersB = shuffle(B1_ANIMALS.filter(function (a) { return a.id !== pickB.animal.id; })).slice(0, 2);
      var opp = pickB.size === 'big' ? 'small' : 'big';
      var bOpts = shuffle([
        { kind: 'bsAnimal', animal: pickB.animal, size: pickB.size },
        { kind: 'bsAnimal', animal: othersB[0], size: opp },
        { kind: 'bsAnimal', animal: othersB[1], size: opp }
      ]);
      return {
        type: 'B1B', animal: pickB.animal, size: pickB.size,
        options: bOpts,
        correct: bOpts.indexOf(bOpts.filter(function (o) {
          return o.animal.id === pickB.animal.id && o.size === pickB.size;
        })[0]),
        audio: [
          b1Sentence(pickB.animal, pickB.size),
          b1Sentence(othersB[0], opp),
          pickB.size === 'big' ? 'l3_find_big_one' : 'l3_find_small_one'
        ]
      };
    }

    // 题型 C：大箱子 / 小箱子分类，把对应大小的物品拖进同尺寸的箱子
    var cCombos = [];
    B1_ITEMS.filter(function (it) { return it.putBig; }).forEach(function (it) {
      cCombos.push({ key: 'C-' + it.id + '-big', item: it, size: 'big' });
      cCombos.push({ key: 'C-' + it.id + '-small', item: it, size: 'small' });
    });
    var cPrev = (prev && prev.type === 'B1C') ? 'C-' + prev.item.id + '-' + prev.size : null;
    var pickC = takeFresh(cCombos, usedPairs, cPrev);
    var cOpts = shuffle([
      { kind: 'bsDrag', asset: pickC.item.asset, size: 'big' },
      { kind: 'bsDrag', asset: pickC.item.asset, size: 'small' }
    ]);
    return {
      type: 'B1C', item: pickC.item, size: pickC.size,
      options: cOpts,
      correct: b1IndexOfSize(cOpts, pickC.size),
      audio: [pickC.size === 'big' ? pickC.item.putBig : pickC.item.putSmall]
    };
  }

  /* ---------------- 第 3 岛第 2 关（多 / 少 More / Less） ---------------- */

  var B2_FRUITS_A = [{ id: 'apple' }, { id: 'banana' }, { id: 'grape' }];
  var B2_FRUITS_B = [{ id: 'apple' }, { id: 'strawberry' }, { id: 'grape' }];
  var B2_FRUITS_C = [{ id: 'apple' }, { id: 'banana' }, { id: 'grape' }];

  /** 选项洗过牌，正确下标必须按「多 / 少」重新找，不能写死 0/1 */
  function b2CmpIndex(opts, cmp) {
    for (var i = 0; i < opts.length; i++) if (opts[i].cmp === cmp) return i;
    return 0;
  }

  function makeQuestionB2(type, prev) {
    if (type === 0) {
      // 题型 A：两堆相同水果，听 "Which one has more / less <果>?" 点对应堆
      var aCombos = [];
      B2_FRUITS_A.forEach(function (f) {
        aCombos.push({ key: 'A|' + f.id + '|more', fruit: f, cmp: 'more' });
        aCombos.push({ key: 'A|' + f.id + '|less', fruit: f, cmp: 'less' });
      });
      var aPrev = (prev && prev.type === 'B2A') ? ('A|' + prev.fruit.id + '|' + prev.cmp) : null;
      var pickA = takeFresh(aCombos, usedPairs, aPrev);
      var moreCount = pick([5, 6, 7, 8]);
      var lessCount = pick([1, 2, 3]);
      var aOpts = shuffle([
        { kind: 'b2Pile', fruit: pickA.fruit, count: moreCount, cmp: 'more' },
        { kind: 'b2Pile', fruit: pickA.fruit, count: lessCount, cmp: 'less' }
      ]);
      return {
        type: 'B2A', fruit: pickA.fruit, cmp: pickA.cmp,
        moreCount: moreCount, lessCount: lessCount,
        options: aOpts,
        correct: b2CmpIndex(aOpts, pickA.cmp),
        audio: [pickA.cmp === 'more' ? 'l3w2a_more_' + pickA.fruit.id : 'l3w2a_less_' + pickA.fruit.id]
      };
    }

    if (type === 1) {
      // 题型 B：三堆不同水果，听 "Find the group with less <果>"，点那一堆
      //   （被点名的水果就是数量最少的那一堆，符合"点少的那堆"设计）
      var bCombos = [];
      B2_FRUITS_B.forEach(function (f) { bCombos.push({ key: 'B|' + f.id, fruit: f }); });
      var bPrev = (prev && prev.type === 'B2B') ? ('B|' + prev.fruit.id) : null;
      var pickB = takeFresh(bCombos, usedPairs, bPrev);
      var others = shuffle(B2_FRUITS_B.filter(function (f) { return f.id !== pickB.fruit.id; })).slice(0, 2);
      var tCount = pick([1, 2, 3]);
      var oCounts = shuffle([6, 7, 8]).slice(0, 2);
      var bOpts = shuffle([
        { kind: 'b2Pile', fruit: pickB.fruit, count: tCount, cmp: 'less' },
        { kind: 'b2Pile', fruit: others[0], count: oCounts[0], cmp: 'more' },
        { kind: 'b2Pile', fruit: others[1], count: oCounts[1], cmp: 'more' }
      ]);
      return {
        type: 'B2B', fruit: pickB.fruit,
        options: bOpts,
        correct: bOpts.indexOf(bOpts.filter(function (o) { return o.fruit.id === pickB.fruit.id; })[0]),
        audio: ['l3w2b_less_' + pickB.fruit.id]
      };
    }

    // 题型 C：两堆相同水果（多 / 少），拖进 More / Less 箱分类
    var cCombos = [];
    B2_FRUITS_C.forEach(function (f) {
      cCombos.push({ key: 'C|' + f.id + '|more', fruit: f, cmp: 'more' });
      cCombos.push({ key: 'C|' + f.id + '|less', fruit: f, cmp: 'less' });
    });
    var cPrev = (prev && prev.type === 'B2C') ? ('C|' + prev.fruit.id + '|' + prev.cmp) : null;
    var pickC = takeFresh(cCombos, usedPairs, cPrev);
    var cmp = pickC.cmp;
    var cMore = pick([5, 6, 7, 8]);
    var cLess = pick([1, 2, 3]);
    var cOpts = shuffle([
      { kind: 'b2Drag', fruit: pickC.fruit, count: cMore, cmp: 'more' },
      { kind: 'b2Drag', fruit: pickC.fruit, count: cLess, cmp: 'less' }
    ]);
    return {
      type: 'B2C', fruit: pickC.fruit, cmp: cmp,
      moreCount: cMore, lessCount: cLess,
      options: cOpts,
      correct: b2CmpIndex(cOpts, cmp),
      audio: ['l3w2c_' + cmp + '_' + pickC.fruit.id]
    };
  }

  /** 正确颜色 + 两个不同颜色干扰项，顺序打乱 */
  function withColorDistractors(answer) {
    var others = shuffle(COLORS.filter(function (c) { return c.id !== answer.id; })).slice(0, 2);
    return shuffle([answer].concat(others));
  }

  function makeQuestion(type, prev) {
    var num, fruit, pairKey, guard = 0;
    do {
      num = pick(NUMBERS, prev ? prev.num : null);
      fruit = pick(FRUITS, prev ? prev.fruit : null);
      pairKey = num + '-' + fruit.id;
      guard += 1;
    } while (usedPairs[pairKey] && guard < 60);
    usedPairs[pairKey] = true;
    if (type === 0) {
      // 题型甲：屏幕给一堆水果，只播数字发音，孩子数完去选数字标牌
      var nums = withDistractors(NUMBERS, num);
      return {
        type: 'A', num: num, fruit: fruit,
        options: nums.map(function (v) { return { kind: 'sign', value: v, fruit: fruit }; }),
        correct: nums.indexOf(num),
        audio: ['n' + num], reinforce: 'n' + num
      };
    }

    if (type === 1) {
      var others = shuffle(FRUITS.filter(function (f) { return f.id !== fruit.id; })).slice(0, 2);
      var list = shuffle([fruit].concat(others));
      var order = list.map(function (f) { return f.id; });
      return {
        type: 'B', num: num, fruit: fruit,
        options: list.map(function (f) { return { kind: 'fruit', fruit: f }; }),
        correct: order.indexOf(fruit.id),
        audio: ['f_' + fruit.id], reinforce: 'f_' + fruit.id
      };
    }

    var counts = withDistractors(NUMBERS, num);
    return {
      type: 'C', num: num, fruit: fruit,
      options: counts.map(function (v) { return { kind: 'pile', count: v, fruit: fruit }; }),
      correct: counts.indexOf(num),
      audio: ['q_' + num + '_' + fruit.id], reinforce: 'n' + num
    };
  }

  function pileNode(fruit, count, variant) {
    var box = document.createElement('div');
    box.className = 'pile ' + (variant === 'opt' ? 'pile-opt' : 'pile-display');
    for (var i = 0; i < count; i++) {
      var cell = document.createElement('span');
      cell.appendChild(fruitImg(fruit));
      box.appendChild(cell);
    }
    return box;
  }

  /** 「仔细听」大喇叭提示（不泄露任何答案线索） */
  function listenNode() {
    var wrap = document.createElement('div');
    wrap.className = 'listen-wrap';
    var horn = document.createElement('div');
    horn.className = 'listen-horn';
    horn.appendChild(svgIcon('speaker'));
    var bubble = document.createElement('span');
    bubble.className = 'listen-bubble';
    bubble.textContent = '?';
    wrap.appendChild(horn);
    wrap.appendChild(bubble);
    return wrap;
  }

  /** 第 5 关题型 B：上方可拖拽的彩色水果托盘 */
  function renderTray(q) {
    var old = askDisplay.querySelector('.fruit-tray');
    if (old) old.parentNode.removeChild(old);
    if (!q || q.type !== 'W5B' || !q.tray) return;

    var tray = document.createElement('div');
    tray.className = 'fruit-tray';
    q.tray.forEach(function (t, i) {
      var chip = document.createElement('div');
      chip.className = 'tray-fruit' + (state.pickedFruit === i ? ' picked' : '');
      chip.dataset.drag = 'fruit';
      chip.dataset.idx = String(i);
      var img = assetImg(t.fruit.id + '_' + t.color.id, 'tray-img');
      if (img) chip.appendChild(img);
      chip.addEventListener('click', function () { tapFruit(i, chip); });
      tray.appendChild(chip);
    });
    askDisplay.appendChild(tray);
  }

  /* ---------------- 第 3 岛第 1 关的视觉零件（大 / 小） ---------------- */

  /** 一只 3D 物品：size = big / small，只改显示尺寸，素材完全一样 */
  function bsItemNode(assetKey, size, cls) {
    var box = document.createElement('div');
    box.className = 'bs-item ' + (size === 'big' ? 'is-big' : 'is-small') + (cls ? ' ' + cls : '');
    box.dataset.size = size;
    var img = assetImg(assetKey, 'bs-img');
    if (img) box.appendChild(img);
    return box;
  }

  /** 一只 3D 动物（图库与水果不同） */
  function bsAnimalNode(id, size) {
    var box = document.createElement('div');
    box.className = 'bs-animal ' + (size === 'big' ? 'is-big' : 'is-small');
    box.dataset.size = size;
    box.dataset.animal = id;
    var img = animalImg(id, 'bs-img');
    if (img) box.appendChild(img);
    return box;
  }

  /** 一个圆润 3D 纸箱，正面画「大圆 / 小圆」当尺寸标记 */
  function b1BoxNode(size) {
    var box = document.createElement('div');
    box.className = 'bs-box ' + (size === 'big' ? 'is-big' : 'is-small');
    box.dataset.drop = 'sizebox';
    box.dataset.size = size;

    var svg = svgEl('svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('class', 'bs-box-svg');
    var r = size === 'big' ? 21 : 11;
    svg.innerHTML =
      '<ellipse cx="50" cy="89" rx="33" ry="6" fill="#8a6a48" opacity=".14"/>' +
      '<path d="M14 36h72v40a11 11 0 01-11 11H25a11 11 0 01-11-11z" fill="#e3b884"/>' +
      '<path d="M14 36h72v12H14z" fill="#d3a06a"/>' +
      '<ellipse cx="50" cy="36" rx="36" ry="11" fill="#f3d3a6"/>' +
      '<ellipse cx="50" cy="35" rx="29" ry="8" fill="#e8c193"/>' +
      '<circle cx="50" cy="63" r="' + r + '" fill="#fff6e4" stroke="#c08d5b" stroke-width="3"/>' +
      '<ellipse cx="38" cy="52" rx="9" ry="3.2" fill="#fff8ec" opacity=".55"/>';
    box.appendChild(svg);

    // 点选兜底：已点选物品后再点箱子 = 投放（RULES §二.10）
    box.addEventListener('click', function () {
      if (state.pickedFruit === null) return;
      resolveB1C(state.pickedFruit, box);
    });
    return box;
  }

  function b1BoxRow() {
    var row = document.createElement('div');
    row.className = 'bs-box-row';
    row.appendChild(b1BoxNode('big'));
    row.appendChild(b1BoxNode('small'));
    return row;
  }

  /** 答对时：物品当场落进箱子里，保留视觉结果 */
  function placeInB1Box(assetKey, size) {
    var box = askDisplay.querySelector('.bs-box[data-size="' + size + '"]');
    if (!box) return;
    var old = box.querySelector('.bs-in-box');
    if (old) old.parentNode.removeChild(old);
    var img = assetImg(assetKey, 'bs-in-box');
    if (img) box.appendChild(img);
  }

  /* ---------------- 第 3 岛第 2 关的视觉零件（多 / 少） ---------------- */

  /** 一只装了若干水果的篮子（数量一眼可数，不标数字） */
  function b2BasketBg() {
    var svg = svgEl('svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('class', 'b2-basket-bg');
    svg.innerHTML =
      '<path d="M12 46h76l-7 44a8 8 0 01-8 7H27a8 8 0 01-8-7z" fill="#e3b884"/>' +
      '<path d="M8 44h84a5 5 0 010 10H8a5 5 0 010-10z" fill="#cf9d63"/>' +
      '<path d="M12 46h76l-2 12H14z" fill="#efcaa0"/>' +
      '<ellipse cx="50" cy="93" rx="34" ry="5" fill="#8a6a48" opacity=".12"/>';
    return svg;
  }

  function b2BasketNode(fruit, count) {
    var fid = (typeof fruit === 'string') ? fruit : (fruit && fruit.id) || fruit;
    var box = document.createElement('div');
    box.className = 'b2-basket';
    box.dataset.count = String(count);
    box.appendChild(b2BasketBg());
    var pile = document.createElement('div');
    pile.className = 'b2-fruits';
    for (var i = 0; i < count; i++) {
      var cell = document.createElement('span');
      cell.appendChild(assetImg(fid, 'b2-fruit'));
      pile.appendChild(cell);
    }
    box.appendChild(pile);
    return box;
  }

  function b2Dot(x, y, r) {
    return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#5b8aa6" opacity=".72"/>';
  }

  /** 一个分类箱：Many dots = 多，Few dots = 少（不出现英文字母） */
  function b2BoxNode(kind) {
    var box = document.createElement('div');
    box.className = 'b2-box ' + (kind === 'more' ? 'is-more' : 'is-less');
    box.dataset.drop = 'b2box';
    box.dataset.box = kind;
    var svg = svgEl('svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('class', 'b2-box-svg');
    var body =
      '<path d="M16 34h68l-6 50a8 8 0 01-8 7H30a8 8 0 01-8-7z" fill="#bfe0ef"/>' +
      '<path d="M12 32h76a4 4 0 010 8H12a4 4 0 010-8z" fill="#a3d0e4"/>' +
      '<path d="M16 34h68l-2 11H14z" fill="#d3ecf6"/>';

  function makeQuestionB3(type, prev) {
    if (type === 0) {
      // 题型 A：两样相同物品（一长一短），听 "Find the long/short <物>" 点对应
      var objs = ['snake', 'rope', 'pencil', 'bread', 'scarf', 'car'];
      var aCombos = objs.map(function (k) { return { key: 'A|' + k, obj: k }; });
      var aPrev = (prev && prev.type === 'B3A') ? ('A|' + prev.obj) : null;
      var pickA = takeFresh(aCombos, usedPairs, aPrev);
      var cmp = pick(['long', 'short']);
      var aOpts = shuffle([
        { kind: 'lsObj', obj: pickA.obj, cmp: 'long' },
        { kind: 'lsObj', obj: pickA.obj, cmp: 'short' }
      ]);
      return {
        type: 'B3A', obj: pickA.obj, cmp: cmp,
        options: aOpts,
        correct: aOpts.indexOf(aOpts.filter(function (o) { return o.cmp === cmp; })[0]),
        audio: ['l3w3a_' + cmp + '_' + pickA.obj]
      };
    }

    if (type === 1) {
      // 题型 B：三只动物（长颈鹿/兔子/乌龟），听短句找「长」的那只
      var scenes = [
        { id: 'giraffe', word: 'l3w3b_long_giraffe' },
        { id: 'rabbit',  word: 'l3w3b_long_rabbit' }
      ];
      var bPrev = (prev && prev.type === 'B3B') ? ('B|' + prev.animal) : null;
      var pickScene = takeFresh(scenes.map(function (s) {
        return { key: 'B|' + s.id, id: s.id, word: s.word };
      }), usedPairs, bPrev);
      var others = shuffle(['giraffe', 'rabbit', 'turtle'].filter(function (a) { return a !== pickScene.id; })).slice(0, 2);
      var bOpts = shuffle([
        { kind: 'lsAnimal', animal: pickScene.id },
        { kind: 'lsAnimal', animal: others[0] },
        { kind: 'lsAnimal', animal: others[1] }
      ]);
      return {
        type: 'B3B', animal: pickScene.id,
        options: bOpts,
        correct: bOpts.indexOf(bOpts.filter(function (o) { return o.animal === pickScene.id; })[0]),
        audio: [pickScene.word]
      };
    }

    // 题型 C：长香蕉 / 短香蕉，拖进 Long / Short 箱分类
    var cCombos = ['long', 'short'].map(function (c) { return { key: 'C|' + c, cmp: c }; });
    var cPrev = (prev && prev.type === 'B3C') ? ('C|' + prev.cmp) : null;
    var pickC = takeFresh(cCombos, usedPairs, cPrev);
    var cOpts = shuffle([
      { kind: 'b3Drag', obj: 'banana', cmp: 'long' },
      { kind: 'b3Drag', obj: 'banana', cmp: 'short' }
    ]);

      audio: ['l3w3c_' + pickC.cmp + '_banana']
    };

  function makeQuestionB4(type, prev) {
    ensureB4Css();
    var pool = type === 0 ? B4_ANIMAL : type === 1 ? B4_FRUIT : B4_COLOR;
    var pickC, guard = 0;
    do {
      pickC = pool[randInt(0, pool.length - 1)];
      guard += 1;
    } while (prev && prev.sig === pickC.sig && guard < 30);

    var opts = [];
    for (var i = 0; i < 3; i++) opts.push({ asset: pickC.maj, lib: pickC.lib });
    opts.push({ asset: pickC.odd, lib: pickC.lib });
    shuffle(opts);
    var oddSlot = opts.filter(function (o) { return o.asset === pickC.odd; })[0];
    var correct = opts.indexOf(oddSlot);

    return {
      type: 'B4', sig: pickC.sig, lib: pickC.lib,
      options: opts, correct: correct, audio: [pickC.audio]
    };
  }

  /* 教学：演示 → 互动（4 秒小手指）→ t_ready 进入答题。结构与「两个位置对比」不同，走 custom 分支 */
  /* ============================================================

     只考不教新词：大小 / 多少 / 长短 / 找不同 全岛复习（RULES §三.9）

  var B5_ATTR_CN = { big: '大', small: '小', long: '长', short: '短' };

  /** 跨三套图库取图（FRUIT / ANIMAL / COLOR），避免 assetImg 只认 FRUIT_IMG */
  function b5Img(asset, lib, cls) {
    var src = lib === 'animal' ? ANIMAL_IMG[asset]
            : lib === 'color'  ? COLOR_IMG[asset]
            :                    FRUIT_IMG[asset];
    if (!src) return null;
    var img = document.createElement('img');
    img.src = src; img.alt = ''; img.draggable = false;
    img.className = cls || 'b5-img';
    img.dataset.asset = asset;
    return img;
  }

  /** 统一「物品」节点：大小（图按 scale 缩放）/ 长短（rod / train / snake） */
  function b5ItemNode(it) {
    var box = document.createElement('div');
    box.className = 'b5-item';
    if (it.mode === 'len') {
      if (it.shape === 'train') box.appendChild(b5Train(it.segs || 0));

  /** 找出 4 件物品中「唯一不同」的那一件（按视觉特征分组，计数为 1 者即异类） */
  function findB5Odd(items) {
    var sigs = items.map(function (o) {
      return o.mode === 'len'
        ? ('len|' + (o.shape || 'rod') + '|' + o.frac)
        : ('size|' + o.asset + '|' + (o.lib || '') + '|' + o.scale);
    });
    for (var i = 0; i < sigs.length; i++) {
      var c = 0;
      for (var j = 0; j < sigs.length; j++) if (sigs[j] === sigs[i]) c++;
      if (c === 1) return i;
    }
    return 3;
  }

  /** 结业关出题：A 混合比较（3）/ B 混合分类（4）/ C 拖拽游乐场（3） */
  function makeQuestionB5(type, prev) {
    ensureB5Css();

    if (type === 0) {
      // 题型 A：3 个物品，比大小或比长短；语音 Which one is bigger/smaller/longer/shorter?
      var useLen = Math.random() < 0.5;
      var askBig = Math.random() < 0.5;
      var optsA = [], correctA = 0, audioA;
      if (useLen) {
        var fracs = shuffle([0.45, 0.70, 0.95]);
        optsA = fracs.map(function (f) { return { kind: 'b5item', mode: 'len', shape: 'rod', frac: f }; });
        correctA = fracs.indexOf(askBig ? 0.95 : 0.45);
        audioA = askBig ? 'b5_a_longer' : 'b5_a_shorter';
      } else {
        var scales = shuffle([0.55, 0.75, 0.95]);
        var assetA = pick(['apple', 'strawberry', 'banana']);
        optsA = scales.map(function (s) {
          return { kind: 'b5item', mode: 'size', asset: assetA, lib: 'fruit', scale: s };
        });
        correctA = scales.indexOf(askBig ? 0.95 : 0.55);
        audioA = askBig ? 'b5_a_bigger' : 'b5_a_smaller';
      }
      return { type: 'B5A', options: optsA, correct: correctA, audio: [audioA], askBig: askBig, useLen: useLen };
    }

    if (type === 1) {
      // 题型 B：4 个物品，3 同 + 1 异；语音 Find the odd one out.
      var v = pick(['size', 'len', 'color', 'animal']);
      var items = [];
      if (v === 'size') {
        var bigSame = Math.random() < 0.5;
        var sSame = bigSame ? 0.95 : 0.55;
        var sDiff = bigSame ? 0.55 : 0.95;
        items = [sSame, sSame, sSame, sDiff].map(function (s) {
          return { kind: 'b5item', mode: 'size', asset: 'apple', lib: 'fruit', scale: s };
        });
      } else if (v === 'len') {
        var longSame = Math.random() < 0.5;
        var fSame = longSame ? 0.95 : 0.45;
        var fDiff = longSame ? 0.45 : 0.95;
        items = [fSame, fSame, fSame, fDiff].map(function (f) {
          return { kind: 'b5item', mode: 'len', shape: 'rod', frac: f };
        });
      } else if (v === 'color') {
        items = ['balloon_red', 'balloon_red', 'balloon_red', 'balloon_blue'].map(function (a) {
          return { kind: 'b5item', mode: 'size', asset: a, lib: 'color', scale: 1 };
        });
      } else {
        items = ['dog', 'dog', 'dog', 'cat'].map(function (a) {
          return { kind: 'b5item', mode: 'size', asset: a, lib: 'animal', scale: 1 };
        });
      }
      shuffle(items);
      return { type: 'B5B', variant: v, options: items, correct: findB5Odd(items), audio: ['b5_b_odd'] };
    }

    // 题型 C：游乐园入口标（大/小/长/短），3 个物品，拖/点符合属性者进入
    var attr = pick(['big', 'small', 'long', 'short']);
    var optsC = [], correctC = 0;
    if (attr === 'big' || attr === 'small') {
      var cs = shuffle([0.55, 0.72, 0.95]);
      var ca = pick(['apple', 'strawberry']);
      optsC = cs.map(function (s) {
        return { kind: 'b5item', mode: 'size', asset: ca, lib: 'fruit', scale: s };
      });
      correctC = cs.indexOf(attr === 'big' ? 0.95 : 0.55);
    } else {
      var cf = shuffle([0.45, 0.68, 0.95]);
      optsC = cf.map(function (f) {
        return { kind: 'b5item', mode: 'len', shape: 'rod', frac: f };
      });
      correctC = cf.indexOf(attr === 'long' ? 0.95 : 0.45);
    }
    return { type: 'B5C', attr: attr, options: optsC, correct: correctC, audio: ['b5_c_' + attr] };
  }

  /** 题型 C 判定：物品是正确的那件，且落到入口上 */
  function resolveB5C(itemIdx, target) {
    var q = state.question;
    if (!q || q.type !== 'B5C') return;
    var isGate = !!(target && target.dataset && target.dataset.drop === 'b5gate');
    var ok = isGate && itemIdx === q.correct;
    judge(ok, ok ? target : optionEls[itemIdx]);
  }

  /* 结业复习教学：大小 / 多少 / 长短 / 找不同，各两个案例 + 一问（RULES §三.9） */
  var runB5Tutorial = (function () {
    function blank(me) {
      me.ask = null;
      me.hintTarget = null;
      me.hintFrom = null;
      me.hintTo = null;
      me.hintToY = 0.5;
      me.replay = null;
      clearHint();
    }
    function stage(me) {
      blank(me);
      askDisplay.innerHTML = '';
      ensureB5Css();
      var w = document.createElement('div');
      w.className = 'b5-tut-stage';
      askDisplay.appendChild(w);
      return w;
    }
    function mkCell(node, w) {
      var c = document.createElement('div');
      c.className = 'b5-tut-cell';
      if (w) c.style.width = w;
      c.appendChild(node);
      return c;
    }
    function mkRow(wrap) {
      var r = document.createElement('div');
      r.className = 'b5-tut-row';
      wrap.appendChild(r);
      return r;
    }

    // ---- 大小：大象 vs 老鼠 ----
    function bsElephant(me) {
      var wrap = stage(me), row = mkRow(wrap);
      var left = mkCell(b5ItemNode({ mode: 'size', asset: 'elephant', lib: 'animal', scale: 1 }), 'min(34vw,150px)');
      var right = mkCell(b5ItemNode({ mode: 'size', asset: 'mouse', lib: 'animal', scale: 1 }), 'min(19vw,80px)');
      row.appendChild(left); row.appendChild(right);
      return { entries: [{ key: 'big', el: left }, { key: 'small', el: right }] };
    }
    // ---- 大小：大苹果 vs 小苹果 ----
    function bsApple(me) {
      var wrap = stage(me), row = mkRow(wrap);
      var left = mkCell(b5ItemNode({ mode: 'size', asset: 'apple', lib: 'fruit', scale: 1 }), 'min(32vw,140px)');
      var right = mkCell(b5ItemNode({ mode: 'size', asset: 'apple', lib: 'fruit', scale: 1 }), 'min(17vw,72px)');
      row.appendChild(left); row.appendChild(right);
      return { entries: [{ key: 'big', el: left }, { key: 'small', el: right }] };
    }
    // ---- 多少：两筐苹果 ----
    function mlPair(me, nLeft, nRight) {
      var wrap = stage(me), row = mkRow(wrap);
      var Lb = document.createElement('div'); Lb.className = 'b5-tut-basket'; Lb.appendChild(b2BasketNode('apple', nLeft));
      var Rb = document.createElement('div'); Rb.className = 'b5-tut-basket'; Rb.appendChild(b2BasketNode('apple', nRight));
      var left = mkCell(Lb, 'min(38vw,160px)');
      var right = mkCell(Rb, 'min(38vw,160px)');
      row.appendChild(left); row.appendChild(right);
      var leftMore = nLeft > nRight;
      return {
        entries: [
          { key: leftMore ? 'more' : 'less', el: left },
          { key: leftMore ? 'less' : 'more', el: right }
        ]
      };
    }
    // ---- 长短：长/短 蛇 或 火车 ----
    function lsPair(me, shape) {
      var wrap = stage(me), row = mkRow(wrap);
      var longN = b5ItemNode({ mode: 'len', shape: shape, segs: shape === 'snake' ? 6 : 4 });
      var shortN = b5ItemNode({ mode: 'len', shape: shape, segs: shape === 'snake' ? 2 : 1 });
      var left = mkCell(longN, 'min(46vw,200px)');
      var right = mkCell(shortN, 'min(30vw,120px)');
      row.appendChild(left); row.appendChild(right);
      return { entries: [{ key: 'long', el: left }, { key: 'short', el: right }] };
    }
    // ---- 找不同：3 同 + 1 异（四宫格） ----
    function oddGrid(me, specs) {
      var wrap = stage(me);
      var g = document.createElement('div');
      g.className = 'b5-grid';
      g.dataset.n = '2';
      g.setAttribute('aria-label', '找不同');
      wrap.appendChild(g);
      var entries = [];
      shuffle(specs).forEach(function (it) {
        var cell = document.createElement('div');
        cell.className = 'b5-tile';
        cell.setAttribute('aria-label', '图片');
        cell.appendChild(b5ItemNode({ mode: 'size', asset: it.asset, lib: it.lib, scale: 1 }));
        g.appendChild(cell);
        entries.push({ key: it.key, el: cell });
      });
      return { entries: entries };
    }
    function oddAnimals(me) {
      return oddGrid(me, [
        { key: 'same', asset: 'dog', lib: 'animal' }, { key: 'same', asset: 'dog', lib: 'animal' },
        { key: 'same', asset: 'dog', lib: 'animal' }, { key: 'odd', asset: 'cat', lib: 'animal' }
      ]);
    }
    function oddBalloons(me) {
      return oddGrid(me, [
        { key: 'same', asset: 'balloon_red', lib: 'color' }, { key: 'same', asset: 'balloon_red', lib: 'color' },
        { key: 'same', asset: 'balloon_red', lib: 'color' }, { key: 'odd', asset: 'balloon_blue', lib: 'color' }
      ]);
    }

    var ACTS = [
      // 1）大小
      { type: 'demo', build: bsElephant, hi: 'big',   word: 'b5_tut_bs1' },
      { type: 'demo', build: bsApple,    hi: 'big',   word: 'b5_tut_bs2' },
      { type: 'ask',  build: bsElephant, ans: 'big',  word: 'b5_tut_bs_ask' },
      // 2）多少
      { type: 'demo', build: function (me) { return mlPair(me, 6, 2); }, hi: 'more', word: 'b5_tut_ml1' },
      { type: 'demo', build: function (me) { return mlPair(me, 1, 4); }, hi: 'less', word: 'b5_tut_ml2' },
      { type: 'ask',  build: function (me) { return mlPair(me, 6, 2); }, ans: 'less', word: 'b5_tut_ml_ask' },
      // 3）长短
      { type: 'demo', build: function (me) { return lsPair(me, 'snake'); }, hi: 'long',  word: 'b5_tut_ls1' },
      { type: 'demo', build: function (me) { return lsPair(me, 'train'); }, hi: 'long',  word: 'b5_tut_ls2' },
      { type: 'ask',  build: function (me) { return lsPair(me, 'train'); }, ans: 'short', word: 'b5_tut_ls_ask' },
      // 4）找不同
      { type: 'demo', build: oddAnimals,  hi: 'odd', word: 'b5_tut_odd1' },
      { type: 'demo', build: oddBalloons, hi: 'odd', word: 'b5_tut_odd2' },
      { type: 'ask',  build: oddAnimals,  ans: 'odd', word: 'l3w4_tut_ask' }
    ];

    function playAct(me, i) {
      if (state.tut !== me) return;
      if (i >= ACTS.length) { tutFinish(me); return; }
      var act = ACTS[i];
      var built = act.build(me);
      if (act.type === 'demo') {
        me.replay = function () { say([act.word]); };
        say([act.word], function () {
          if (state.tut !== me) return;
          var hiEl = null;
          built.entries.forEach(function (e) { if (e.key === act.hi) hiEl = e; });
          if (hiEl) hiEl.el.classList.add('b5-glow');
          setTimeout(function () { if (state.tut === me) playAct(me, i + 1); }, 1500);
        });
        return;
      }
      // 互动：点对才推进；点错抖一下 + 温柔鼓励；4 秒无操作弹小手指
      var ansEl = null;
      built.entries.forEach(function (e) { if (e.key === act.ans) ansEl = e; });
      me.ask = act.ans;
      me.hintTarget = ansEl ? ansEl.el : null;
      me.replay = function () { say([act.word]); };
      say([act.word]);
      armHint();
      built.entries.forEach(function (entry) {
        entry.el.addEventListener('click', function () {
          if (state.tut !== me || !me.ask) return;
          if (entry.key === me.ask) {
            clearHint();
            coin();
            ting();
            me.ask = null;
            entry.el.classList.add('b5-right');
            setTimeout(function () { if (state.tut === me) playAct(me, i + 1); }, 900);
          } else {
            entry.el.classList.add('b5-shake');
            setTimeout(function () { entry.el.classList.remove('b5-shake'); }, 520);
            say(['again']);
            armHint();
          }
        });
      });
    }

    var api = function (me) { playAct(me, 0); };
    api.check = function () { return false; };
    return api;
  })();

  /* ==================== 第 4 岛第 1 关（L4-W1：农场动物 Farm animals） ==================== */
  /* 目标：把动物图像与发音建立强联系（RULES §三.6 先教后练）。
     教学：狗 → 猫 → 动手找狗 → 猪 → 牛 → 动手找牛（4 秒小手指）→ 过渡语直接进答题。
     答题：A 听名字找动物 / B 听叫声找动物 / C 把动物拖进农场（含点选兜底，RULES §二.11）。
     规则：全中文（只有图片 + 中文 aria-label，§二.1）、答对只音效 + 星星（§1.6）、

  /** 题型 A / B：3 只动物的点选宫格（选项栏隐藏，图更大、手指更好点） */

  function f1PlaceInFarm(animal) {

  /** 出题：0 = 听名字找（A）/ 1 = 听叫声找（B）/ 2 = 拖进农场（C）。都是 1 正 + 2 干扰 */
  function makeQuestionF1(type, prev) {
    ensureF1Css();
    var pickC, sig, guard = 0;
    do {
      pickC = F1_ANIMALS[randInt(0, F1_ANIMALS.length - 1)];
      sig = type + ':' + pickC;
      guard += 1;
    } while (prev && prev.sig === sig && guard < 30);

    var others = F1_ANIMALS.filter(function (a) { return a !== pickC; });
    shuffle(others);
    var opts = [
      { kind: 'f1animal', animal: pickC },
      { kind: 'f1animal', animal: others[0] },
      { kind: 'f1animal', animal: others[1] }
    ];
    var answerOpt = opts[0];
    shuffle(opts);
    var correct = opts.indexOf(answerOpt);

    var typeName = type === 0 ? 'F1A' : type === 1 ? 'F1B' : 'F1C';
    var prefix = type === 0 ? 'l4w1_f_' : type === 1 ? 'l4w1_s_' : 'l4w1_c_';
    return {
      type: typeName, sig: sig, animal: pickC,
      options: opts, correct: correct, audio: [prefix + pickC]
    };
  }

  /** 题型 C 判定：点名的动物 + 落在农场门上才算对 */
  function resolveF1C(itemIdx, target) {
    var q = state.question;
    if (!q || q.type !== 'F1C') return;
    var onFarm = !!(target && target.dataset && target.dataset.drop === 'f1gate');
    var ok = onFarm && itemIdx === q.correct;
    judge(ok, ok ? target : optionEls[itemIdx]);
  }

  /* 教学（custom 分支）：6 个环节逐个登场 + 两次动手 + 过渡语，收尾仍走 tutFinish() */
  var runF1Tutorial = (function () {
    function blank(me) {
      me.ask = null;
      me.hintTarget = null;
      me.hintFrom = null;
      me.hintTo = null;
      me.hintToY = 0.5;
      me.replay = null;
      clearHint();
    }
    function stage(me) {
      blank(me);
      askDisplay.innerHTML = '';
      ensureF1Css();
      var w = document.createElement('div');
      w.className = 'f1-stage';
      askDisplay.appendChild(w);
      return w;
    }
    function cell(animal) {
      var c = document.createElement('div');
      c.className = 'f1-cell';
      c.dataset.animal = animal;
      var img = f1Img(animal, 'f1-big');
      if (img) c.appendChild(img);
      return c;
    }
    /** 一个动物单独登场（演示用） */
    function one(me, animal) {
      var wrap = stage(me);
      var c = cell(animal);
      wrap.appendChild(c);
      return { entries: [{ key: animal, el: c }] };
    }
    /** 多只动物排成宫格（互动用） */
    function many(me, animals) {
      var wrap = stage(me);
      var g = document.createElement('div');
      g.className = 'f1-grid';
      g.dataset.n = String(animals.length);
      g.setAttribute('aria-label', '动物图片');
      wrap.appendChild(g);
      var entries = [];
      animals.forEach(function (a) {
        var c = cell(a);
        g.appendChild(c);
        entries.push({ key: a, el: c });
      });
      return { entries: entries };
    }

    var ACTS = [
      { type: 'demo', build: function (me) { return one(me, 'dog'); }, hi: 'dog', word: 'l4w1_tut_dog' },
      { type: 'demo', build: function (me) { return one(me, 'cat'); }, hi: 'cat', word: 'l4w1_tut_cat' },
      { type: 'ask',  build: function (me) { return many(me, shuffle(['dog', 'cat'])); },
        ans: 'dog', word: 'l4w1_tut_ask_dog' },
      { type: 'demo', build: function (me) { return one(me, 'pig'); }, hi: 'pig', word: 'l4w1_tut_pig' },
      { type: 'demo', build: function (me) { return one(me, 'cow'); }, hi: 'cow', word: 'l4w1_tut_cow' },
      { type: 'ask',  build: function (me) { return many(me, shuffle(['dog', 'cat', 'pig', 'cow'])); },
        ans: 'cow', word: 'l4w1_f_cow' },
      { type: 'outro', build: function (me) { return many(me, shuffle(['dog', 'cat', 'pig', 'cow'])); },
        word: 'l4w1_tut_done' }
    ];

    function playAct(me, i) {
      if (state.tut !== me) return;
      if (i >= ACTS.length) { tutFinish(me, false); return; }
      var act = ACTS[i];
      var built = act.build(me);

      if (act.type === 'outro') {
        // 过渡语由本步自己播；播完直接进答题，不再叠加 t_ready
        me.replay = function () { say([act.word]); };
        built.entries.forEach(function (e) { e.el.classList.add('f1-glow'); });
        say([act.word], function () {
          if (state.tut !== me) return;
          tutFinish(me, false);
        });
        return;
      }

      if (act.type === 'demo') {
        me.replay = function () { say([act.word]); };
        say([act.word], function () {
          if (state.tut !== me) return;
          var hiEl = null;
          built.entries.forEach(function (e) { if (e.key === act.hi) hiEl = e; });
          if (hiEl) hiEl.el.classList.add('f1-glow');
          setTimeout(function () { if (state.tut === me) playAct(me, i + 1); }, 1500);
        });
        return;
      }

      // 互动：点对才推进；点错抖一下 + 温柔鼓励；4 秒无操作弹小手指（RULES §二.12）
      var ansEl = null;
      built.entries.forEach(function (e) { if (e.key === act.ans) ansEl = e; });
      me.ask = act.ans;
      me.hintTarget = ansEl ? ansEl.el : null;
      me.replay = function () { say([act.word]); };
      say([act.word]);
      armHint();
      built.entries.forEach(function (entry) {
        entry.el.addEventListener('click', function () {
          if (state.tut !== me || !me.ask) return;
          if (entry.key === me.ask) {
            clearHint();
            coin();
            ting();
            me.ask = null;
            entry.el.classList.add('f1-right');
            setTimeout(function () { if (state.tut === me) playAct(me, i + 1); }, 900);
          } else {
            entry.el.classList.add('f1-shake');
            setTimeout(function () { entry.el.classList.remove('f1-shake'); }, 520);
            say(['again']);
            armHint();
          }
        });
      });
    }

    var api = function (me) { playAct(me, 0); };
    api.check = function () { return false; };
    return api;
  })();

  /* ==================== 第 4 岛第 2 关（L4-W2：野生动物 Wild animals） ==================== */
  /* 目标：从农场动物扩到丛林动物，并建立「丛林 / 农场」两个栖息地的分类概念。
     教学（RULES §三.10 双倍量）：每个词 2 次不同演示 + 2 次互动，共 16 环节 + 1 条过渡语。
       狮子：单词+吼叫 → 草原大图（森林之王）→ 狮子 vs 狗 → 三选一
       老虎：单词+吼声 → 条纹特写 → 老虎 vs 猫 → 听描述（谁有条纹）
       猴子：单词+叫声 → 猴子爱吃香蕉 → 猴子 vs 狗 → 听描述（谁爱香蕉）
       大象：单词+叫声 → 大象很大（大象 vs 老鼠）→ 大象 vs 猪 → 听描述（谁很大）
     答题：A 听名字找 / B 听描述找 / C 把动物拖进丛林或农场（含点选兜底，§二.11）。
     图片：ANIMAL_IMG（lion / tiger / monkey / elephant + 农场 4 只）+ 内联 SVG 场景（§二.13）。 */

  var F2_JUNGLE = ['lion', 'tiger', 'monkey', 'elephant'];
  var F2_FARM = ['dog', 'cat', 'pig', 'cow'];

  /** 题型 B 的描述题：答案 + 允许的干扰项（干扰项必须都不具备该特征，否则题目有歧义） */
  var F2_DESC = [
    { key: 'stripes', ans: 'tiger',    pool: ['lion', 'monkey', 'elephant'] },
    { key: 'king',    ans: 'lion',     pool: ['tiger', 'monkey', 'elephant'] },
    { key: 'bananas', ans: 'monkey',   pool: ['lion', 'tiger', 'elephant'] },
    { key: 'big',     ans: 'elephant', pool: ['monkey', 'dog', 'cat'] }
  ];

  /** 取动物图（禁用原生 drag，避免与指针拖拽流程打架） */
  function f2Img(animal, cls) {
    var src = ANIMAL_IMG[animal];
    if (!src) return null;
    var img = document.createElement('img');
    img.src = src; img.alt = ''; img.draggable = false;
    img.className = cls || 'f2-img';
    img.dataset.animal = animal;
    return img;
  }

  /** 丛林场景（SVG，纯图形无文字；中间留白给动物图） */
  var F2_JUNGLE_SVG =

  /** 题型 A / B：3 只动物的点选宫格（选项栏隐藏，图更大更好点） */
  function renderF2Grid(q) {
    ensureF2Css();
    askDisplay.innerHTML = '';
    var grid = document.createElement('div');
    grid.className = 'f2-grid';
    grid.dataset.n = String(q.options.length);
    grid.setAttribute('aria-label', '动物图片');
    q.options.forEach(function (opt, i) {
      var tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'f2-tile';
      tile.dataset.idx = String(i);
      tile.dataset.animal = opt.animal;
      tile.setAttribute('aria-label', '动物图片');
      var img = f2Img(opt.animal, 'f2-img');
      if (img) tile.appendChild(img);
      tile.addEventListener('click', function () {
        if (state.phase !== 'asking' || state.busy) return;
        judge(Number(tile.dataset.idx) === state.question.correct, tile);
      });
      grid.appendChild(tile);
    });
    askDisplay.appendChild(grid);
  }

  /** 题型 C：丛林 / 农场两个投放区（纯图形 + 中文小标签，绝无英文字母） */
  function renderF2Zones(q) {
    ensureF2Css();
    askDisplay.innerHTML = '';
    var wrap = document.createElement('div');
    wrap.className = 'f2-zones';
    [['jungle', '丛林'], ['farm', '农场']].forEach(function (pair) {
      var zone = pair[0];
      var box = document.createElement('div');
      box.className = 'f2-zone';
      box.dataset.drop = 'f2' + zone;
      box.dataset.zone = zone;
      box.setAttribute('aria-label', pair[1]);
      var svg = svgEl('svg');
      svg.setAttribute('viewBox', '0 0 120 100');
      svg.innerHTML = zone === 'jungle' ? F2_JUNGLE_SVG : F2_FARM_SVG;
      box.appendChild(svg);
      var label = document.createElement('div');
      label.className = 'f2-zone-label';
      label.textContent = pair[1];
      box.appendChild(label);
      // 点选兜底：先点动物、再点区域 = 投放（RULES §二.11）
      box.addEventListener('click', function () {
        if (state.pickedFruit === null) return;
        resolveF2C(state.pickedFruit, box);
      });
      wrap.appendChild(box);
    });
    askDisplay.appendChild(wrap);
  }

  /** 答对后把动物放进对应栖息地里（视觉反馈；下一题重绘自动清掉） */
  function f2PlaceInZone(animal, zone) {
    var box = askDisplay.querySelector('.f2-zone[data-zone="' + zone + '"]');
    if (!box) return;
    var img = f2Img(animal, 'f2-in-zone');
    if (img) box.appendChild(img);
  }

  function f2Split(ans, pool) {
    var rest = pool.filter(function (a) { return a !== ans; });
    shuffle(rest);
    var opts = [
      { kind: 'f2animal', animal: ans },
      { kind: 'f2animal', animal: rest[0] },
      { kind: 'f2animal', animal: rest[1] }
    ];
    var answerOpt = opts[0];
    shuffle(opts);
    return { options: opts, correct: opts.indexOf(answerOpt) };
  }

  /** 出题：0 = A 听名字找 / 1 = B 听描述找 / 2 = C 拖进丛林或农场 */
  function makeQuestionF2(type, prev) {
    ensureF2Css();
    var q, guard = 0;
    do {
      if (type === 0) {
        var a1 = F2_JUNGLE[randInt(0, F2_JUNGLE.length - 1)];
        var s1 = f2Split(a1, F2_JUNGLE);
        q = {
          type: 'F2A', sig: 'A:' + a1, animal: a1, options: s1.options, correct: s1.correct,
          audio: ['l4w2_f_' + a1]
        };
      } else if (type === 1) {
        var d = F2_DESC[randInt(0, F2_DESC.length - 1)];
        var s2 = f2Split(d.ans, d.pool);
        q = {
          type: 'F2B', sig: 'B:' + d.key, animal: d.ans, desc: d.key,
          options: s2.options, correct: s2.correct, audio: ['l4w2_b_' + d.key]
        };
      } else {
        // 两个干扰项全部来自「另一种栖息地」：因此只有两个变量同时正确才算对
        var zone = Math.random() < 0.5 ? 'jungle' : 'farm';
        var same = zone === 'jungle' ? F2_JUNGLE : F2_FARM;
        var other = zone === 'jungle' ? F2_FARM : F2_JUNGLE;
        var a3 = same[randInt(0, same.length - 1)];
        var s3 = f2Split(a3, other);
        q = {
          type: 'F2C', sig: 'C:' + zone + ':' + a3, animal: a3, zone: zone,
          options: s3.options, correct: s3.correct,
          // 农场的 4 句与第 1 关文本完全相同，直接复用 l4w1_c_*（RULES §1.12 不建同文本第二条 key）
          audio: [(zone === 'farm' ? 'l4w1_c_' : 'l4w2_c_jungle_') + a3]
        };
      }
      guard += 1;
    } while (prev && prev.sig === q.sig && guard < 30);
    return q;
  }

  /** 题型 C 判定：点名的动物 + 落在指定栖息地，两个条件都满足才算对 */
  function resolveF2C(itemIdx, target) {
    var q = state.question;
    if (!q || q.type !== 'F2C') return;
    var drop = target && target.dataset ? target.dataset.drop : '';
    var rightZone = drop === 'f2' + q.zone;
    var ok = rightZone && itemIdx === q.correct;
    judge(ok, ok ? target : optionEls[itemIdx]);
  }

  /* 教学（custom 分支）：16 个环节 + 过渡语，收尾仍走 tutFinish() */
  var runF2Tutorial = (function () {

      { type: 'ask',  build: function (me) { return pair2(me, 'elephant', 'pig'); },
        ans: 'elephant', word: 'l4w2_f_elephant' },
      { type: 'ask',  build: function (me) { return many(me, shuffle(['elephant', 'monkey', 'cat'])); },
        ans: 'elephant', word: 'l4w2_b_big' },
      // 过渡语（自带，不再叠 t_ready）
      { type: 'outro', build: function (me) { return many(me, shuffle(F2_JUNGLE.slice())); },
        word: 'l4w2_t_done' }
    ];

    function playAct(me, i) {
      if (state.tut !== me) return;
      if (i >= ACTS.length) { tutFinish(me, false); return; }
      var act = ACTS[i];
      var built = act.build(me);

      if (act.type === 'outro') {
        me.replay = function () { say([act.word]); };
        built.entries.forEach(function (e) { e.el.classList.add('f2-glow'); });
        say([act.word], function () {
          if (state.tut !== me) return;
          tutFinish(me, false);
        });
        return;
      }

      if (act.type === 'demo') {
        me.replay = function () { say([act.word]); };
        say([act.word], function () {
          if (state.tut !== me) return;
          var hiEl = null;
          built.entries.forEach(function (e) { if (e.key === act.hi) hiEl = e; });
          if (hiEl) hiEl.el.classList.add('f2-glow');
          setTimeout(function () { if (state.tut === me) playAct(me, i + 1); }, 1500);
        });
        return;
      }

      // 互动：点对才推进；点错抖一下 + 温柔鼓励；4 秒无操作弹小手指（RULES §二.12）
      var ansEl = null;
      built.entries.forEach(function (e) { if (e.key === act.ans) ansEl = e; });
      me.ask = act.ans;
      me.hintTarget = ansEl ? ansEl.el : null;
      me.replay = function () { say([act.word]); };
      say([act.word]);
      armHint();
      built.entries.forEach(function (entry) {
        entry.el.addEventListener('click', function () {
          if (state.tut !== me || !me.ask) return;
          if (entry.key === me.ask) {
            clearHint();
            coin();
            ting();
            me.ask = null;
            entry.el.classList.add('f2-right');
            setTimeout(function () { if (state.tut === me) playAct(me, i + 1); }, 900);
          } else {
            entry.el.classList.add('f2-shake');
            setTimeout(function () { entry.el.classList.remove('f2-shake'); }, 520);
            say(['again']);
            armHint();
          }
        });
      });
    }

    var api = function (me) { playAct(me, 0); };
    api.check = function () { return false; };
    return api;
  })();
