  /** 题型 A / B：动作图宫格（选项栏隐藏，图更大更好点） */
  function renderF3Grid(q) {
    ensureF3Css();
    askDisplay.innerHTML = '';
    var grid = document.createElement('div');
    grid.className = 'f3-grid';
    grid.dataset.n = String(q.options.length);
    grid.setAttribute('aria-label', '动作图片');
    q.options.forEach(function (opt, i) {
      var tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'f3-tile';
      tile.dataset.idx = String(i);
      tile.dataset.subj = opt.subj;
      tile.setAttribute('aria-label', '动作图片');
      tile.appendChild(f3TileNode(opt.subj));
      tile.addEventListener('click', function () {
        if (state.phase !== 'asking' || state.busy) return;
        judge(Number(tile.dataset.idx) === state.question.correct, tile);
      });
      grid.appendChild(tile);
    });
    askDisplay.appendChild(grid);
  }

  /** 题型 C：在跑 / 在睡 两个投放筐（图标 + 中文小标签，绝无英文字母） */
  function renderF3Zones(q) {
    ensureF3Css();
    askDisplay.innerHTML = '';
    var wrap = document.createElement('div');
    wrap.className = 'f3-zones';
    [['run', '在跑'], ['sleep', '在睡']].forEach(function (pair) {
      var zone = pair[0];
      var box = document.createElement('div');
      box.className = 'f3-zone';
      box.dataset.drop = 'f3' + zone;
      box.dataset.zone = zone;
      box.setAttribute('aria-label', pair[1]);

      var badge = document.createElement('div');
      badge.className = 'f3-zone-badge';
      var bs = svgEl('svg');
      if (zone === 'run') {
        bs.setAttribute('viewBox', '0 8 120 104');
        bs.innerHTML = f3KidMarkup('run');
      } else {
        // 睡：直接用小人的睡姿特写（枕头 + 闭眼 + Z），与「在跑」的跑姿对举
        bs.setAttribute('viewBox', '8 26 104 58');
        bs.innerHTML = f3KidMarkup('sleep');
      }
      badge.appendChild(bs);
      box.appendChild(badge);

      var tub = svgEl('svg');
      tub.setAttribute('viewBox', '0 0 120 100');
      tub.innerHTML = zone === 'run' ? F3_TUB_RUN : F3_TUB_SLEEP;
      box.appendChild(tub);

      var label = document.createElement('div');
      label.className = 'f3-zone-label';
      label.textContent = pair[1];
      box.appendChild(label);

      // 点选兜底：先点动作图、再点筐 = 投放（RULES §二.11）
      box.addEventListener('click', function () {
        if (state.pickedFruit === null) return;
        resolveF3C(state.pickedFruit, box);
      });
      wrap.appendChild(box);
    });
    askDisplay.appendChild(wrap);
  }

  /** 答对后把动作图放进对应的筐里（下一题重绘自动清掉） */
  function f3PlaceInZone(subj, zone) {
    var box = askDisplay.querySelector('.f3-zone[data-zone="' + zone + '"]');
    if (!box) return;
    box.appendChild(f3TileNode(subj, 'f3-in-zone'));
  }

  /** 正确答案 + 2 个干扰项，打乱后返回（§二.10 选项槽位固定 3 个） */
  function f3SplitFrom(ans, others) {
    var opts = [{ kind: 'f3act', subj: ans }];
    others.slice(0, 2).forEach(function (s2) { opts.push({ kind: 'f3act', subj: s2 }); });
    var answerOpt = opts[0];
    shuffle(opts);
    return { options: opts, correct: opts.indexOf(answerOpt) };
  }

  /** 出题：0 = A 听音找动作 / 1 = B 听三句短句找 / 2 = C 拖进「在跑 / 在睡」 */
  function makeQuestionF3(type, prev) {
    ensureF3Css();
    var q, guard = 0;
    do {
      if (type === 0) {
        var act = F3_ACTIONS[randInt(0, F3_ACTIONS.length - 1)];
        var rest = F3_ACTIONS.filter(function (a) { return a !== act; });
        shuffle(rest);
        var s1 = f3SplitFrom(F3_CANON[act], [F3_CANON[rest[0]], F3_CANON[rest[1]]]);
        q = {
          type: 'F3A', sig: 'A:' + act, act: act,
          options: s1.options, correct: s1.correct, audio: ['l4w3_a_' + act]
        };
      } else if (type === 1) {
        var sc = F3_SCENES[randInt(0, F3_SCENES.length - 1)];
        var opts = sc.subs.map(function (s2) { return { kind: 'f3act', subj: s2 }; });
        var ansOpt = opts.filter(function (o) { return o.subj === sc.ans; })[0];
        shuffle(opts);
        q = {
          type: 'F3B', sig: 'B:' + sc.key, act: sc.key, subj: sc.ans,
          options: opts, correct: opts.indexOf(ansOpt), audio: ['l4w3_b_' + sc.key]
        };
      } else {
        // 干扰项必须来自「另一个动作」：所以「动作对 + 筐对」两个条件同时成立才算对
        var tgt = F3_ALL_ITEMS[randInt(0, F3_ALL_ITEMS.length - 1)];
        var zone = F3_ZONE_OF[tgt];
        var otherSet = zone === 'run' ? ['boy_sleep', 'cat_sleep'] : ['boy_run', 'dog_run'];
        var other = otherSet[randInt(0, otherSet.length - 1)];
        var opts3 = [{ kind: 'f3act', subj: tgt }, { kind: 'f3act', subj: other }];
        var ans3 = opts3[0];
        shuffle(opts3);
        q = {
          type: 'F3C', sig: 'C:' + zone + ':' + tgt, subj: tgt, zone: zone,
          options: opts3, correct: opts3.indexOf(ans3), audio: ['l4w3_c_' + tgt]
        };
      }
      guard += 1;
    } while (prev && prev.sig === q.sig && guard < 30);
    return q;
  }

  /** 题型 C 判定：点名的动作 + 落进对应的筐，两个条件都满足才算对 */
  function resolveF3C(itemIdx, target) {
    var q = state.question;
    if (!q || q.type !== 'F3C') return;
    var drop = target && target.dataset ? target.dataset.drop : '';
    var rightZone = drop === 'f3' + q.zone;
    var ok = rightZone && itemIdx === q.correct;
    judge(ok, ok ? target : optionEls[itemIdx]);
  }

  /* 教学（custom 分支）：17 个环节 + 过渡语，收尾仍走 tutFinish() */
  var runF3Tutorial = (function () {
    function blank(me) {
      me.ask = null;
      me.hintTarget = null;
      me.hintFrom = null;
      me.hintTo = null;
      me.hintToY = 0.5;
      me.replay = null;
      clearHint();
    }
    function stage(me) {
      blank(me);
      askDisplay.innerHTML = '';
      ensureF3Css();
      var w = document.createElement('div');
      w.className = 'f3-stage';
      askDisplay.appendChild(w);
      return w;
    }
    /** 演示 1：单个主体登场（动作装饰自带，靠动画让「动」看得出来） */
    function one(me, subj) {
      var wrap = stage(me);
      var c = f3TileNode(subj);
      wrap.appendChild(c);
      return { entries: [{ key: subj, el: c }] };
    }
    /** 演示 B-1：夜色大图（熊在睡） */
    function night(me, subj) {
      var wrap = stage(me);
      var d = document.createElement('div');
      d.className = 'f3-night';
      var svg = svgEl('svg');
      svg.setAttribute('viewBox', '0 0 200 140');
      svg.innerHTML = F3_NIGHT_SVG;
      d.appendChild(svg);
      var c = f3TileNode(subj, 'f3-night-subj');
      d.appendChild(c);
      wrap.appendChild(d);
      return { entries: [{ key: subj, el: c }] };
    }
    /** 演示 B-2：特写（垫子上睡觉的猫，Z 云放大） */
    function zoom(me, subj) {
      var wrap = stage(me);
      var d = document.createElement('div');
      d.className = 'f3-zoom';
      var c = f3TileNode(subj, 'f3-zoom-subj');
      d.appendChild(c);
      wrap.appendChild(d);
      return { entries: [{ key: subj, el: c }] };
    }
    /** 互动 A：二选一（目标 + 一个易混项） */
    function pair2(me, a, b) {
      var wrap = stage(me);
      var pair = document.createElement('div');
      pair.className = 'f3-pair';
      var entries = [];
      shuffle([a, b]).forEach(function (k) {
        var c = f3TileNode(k);
        pair.appendChild(c);
        entries.push({ key: k, el: c });
      });
      wrap.appendChild(pair);
      return { entries: entries };
    }
    /** 互动 B：三 / 四选一宫格 */
    function many(me, subjs) {
      var wrap = stage(me);
      var g = document.createElement('div');
      g.className = 'f3-grid';
      g.dataset.n = String(subjs.length);
      g.setAttribute('aria-label', '动作图片');
      wrap.appendChild(g);
      var entries = [];
      subjs.forEach(function (k) {
        var c = f3TileNode(k);
        g.appendChild(c);
        entries.push({ key: k, el: c });
      });
      return { entries: entries };
    }

    var ACTS = [
      // 跑：2 次演示 + 2 次互动
      { type: 'demo', build: function (me) { return one(me, 'boy_run'); },
        hi: 'boy_run', word: 'l4w3_t_run1' },
      { type: 'demo', build: function (me) { return one(me, 'dog_run'); },
        hi: 'dog_run', word: 'l4w3_t_run2' },
      { type: 'ask',  build: function (me) { return pair2(me, 'boy_run', 'boy_walk'); },
        ans: 'boy_run', word: 'l4w3_t_ask_run' },
      { type: 'ask',  build: function (me) { return many(me, shuffle(['boy_run', 'cat_sleep', 'monkey_eat'])); },
        ans: 'boy_run', word: 'l4w3_t_run3' },
      // 跳
      { type: 'demo', build: function (me) { return one(me, 'kangaroo'); },
        hi: 'kangaroo', word: 'l4w3_t_jump1' },
      { type: 'demo', build: function (me) { return one(me, 'frog'); },
        hi: 'frog', word: 'l4w3_t_jump2' },
      { type: 'ask',  build: function (me) { return pair2(me, 'frog', 'cat_sleep'); },
        ans: 'frog', word: 'l4w3_t_jump3' },
      { type: 'ask',  build: function (me) { return many(me, shuffle(['kangaroo', 'bear_sleep', 'boy_run'])); },
        ans: 'kangaroo', word: 'l4w3_t_jump4' },
      // 吃
      { type: 'demo', build: function (me) { return one(me, 'monkey_eat'); },
        hi: 'monkey_eat', word: 'l4w3_t_eat1' },
      { type: 'demo', build: function (me) { return one(me, 'pig_eat'); },
        hi: 'pig_eat', word: 'l4w3_t_eat2' },
      { type: 'ask',  build: function (me) { return pair2(me, 'monkey_eat', 'cat_sleep'); },
        ans: 'monkey_eat', word: 'l4w3_t_eat3' },
      { type: 'ask',  build: function (me) { return many(me, shuffle(['monkey_eat', 'boy_run', 'frog'])); },
        ans: 'monkey_eat', word: 'l4w3_t_eat4' },
      // 睡
      { type: 'demo', build: function (me) { return night(me, 'bear_sleep'); },
        hi: 'bear_sleep', word: 'l4w3_t_sleep1' },
      { type: 'demo', build: function (me) { return zoom(me, 'cat_sleep'); },
        hi: 'cat_sleep', word: 'l4w3_t_sleep2' },
      { type: 'ask',  build: function (me) { return pair2(me, 'bear_sleep', 'kangaroo'); },
        ans: 'bear_sleep', word: 'l4w3_t_sleep3' },
      { type: 'ask',  build: function (me) { return many(me, shuffle(['cat_sleep', 'dog_run', 'monkey_eat'])); },
        ans: 'cat_sleep', word: 'l4w3_t_sleep4' },
      // 综合互动：四个动作里「给我看看吃」（四选一）
      { type: 'ask',  build: function (me) {
          return many(me, shuffle(['boy_run', 'kangaroo', 'monkey_eat', 'bear_sleep']));
        }, ans: 'monkey_eat', word: 'l4w3_t_show_eat' },
      // 过渡语（自带，不再叠 t_ready）
      { type: 'outro', build: function (me) {
          return many(me, shuffle(['dog_run', 'frog', 'pig_eat', 'cat_sleep']));
        }, word: 'l4w3_t_done' }
    ];

    function playAct(me, i) {
      if (state.tut !== me) return;
      if (i >= ACTS.length) { tutFinish(me, false); return; }
      var act = ACTS[i];
      var built = act.build(me);

      if (act.type === 'outro') {
        me.replay = function () { say([act.word]); };
        built.entries.forEach(function (e) { e.el.classList.add('f3-glow'); });
        say([act.word], function () {
          if (state.tut !== me) return;
          tutFinish(me, false);
        });
        return;
      }

      if (act.type === 'demo') {
        me.replay = function () { say([act.word]); };
        say([act.word], function () {
          if (state.tut !== me) return;
          var hiEl = null;
          built.entries.forEach(function (e) { if (e.key === act.hi) hiEl = e; });
          if (hiEl) hiEl.el.classList.add('f3-glow');
          setTimeout(function () { if (state.tut === me) playAct(me, i + 1); }, 1500);
        });
        return;
      }

      // 互动：点对才推进；点错抖一下 + 温柔鼓励；4 秒无操作弹小手指（RULES §二.12）
      var ansEl = null;
      built.entries.forEach(function (e) { if (e.key === act.ans) ansEl = e; });
      me.ask = act.ans;
      me.hintTarget = ansEl ? ansEl.el : null;
      me.replay = function () { say([act.word]); };
      say([act.word]);
      armHint();
      built.entries.forEach(function (entry) {
        entry.el.addEventListener('click', function () {
          if (state.tut !== me || !me.ask) return;
          if (entry.key === me.ask) {
            clearHint();
            coin();
            ting();
            me.ask = null;
            entry.el.classList.add('f3-right');
            setTimeout(function () { if (state.tut === me) playAct(me, i + 1); }, 900);
          } else {
            entry.el.classList.add('f3-shake');
            setTimeout(function () { entry.el.classList.remove('f3-shake'); }, 520);
            say(['again']);
            armHint();
          }
        });
      });
    }

    var api = function (me) { playAct(me, 0); };
    api.check = function () { return false; };
    return api;
  })();

  /** 场景登记：动物 + 动作 + 背景。
      key 只有「进答题池」的 6 个场景才有（对应语音 l4w4_a_/b_/c_ 的后缀），

  var F4_SCENES = {

    dog_sleep:  { img: 'dog',    act: 'sleep', bg: 'mat',    key: null },

  /** 主体（动物 + 动作装饰），定位在场景中心偏下 */
  function f4Actor(subj, cls) {
    var def = F4_SCENES[subj];
    var box = document.createElement('div');
    box.className = 'f4-actor' + (cls ? ' ' + cls : '');
    if (!def) return box;
    var img = animalImg(def.img, 'f4-actor-img');
    if (img) box.appendChild(img);
    // 只借用跑 / 睡两种装饰；吃的食物不放身上，改放在地上（见 f4SceneNode）
    // 跳跃（第 5 关的青蛙 / 袋鼠）只加一个弹跳类，动画在 .f5-style 里
    if (def.act === 'jump') {
      box.classList.add('f4-hop');
    } else if (def.act === 'run' || def.act === 'sleep') {
      var deco = f3DecoNode(def.act);
      if (deco) box.appendChild(deco);
    }
    return box;
  }

  /** 一整幅场景卡（背景 SVG + 主体 [+ 地上的食物]） */
  function f4SceneNode(subj, cls) {
    var def = F4_SCENES[subj];
    var card = document.createElement('div');
    card.className = 'f4-card' + (cls ? ' ' + cls : '');
    card.dataset.subj = subj;
    if (!def) return card;
    card.dataset.act = def.act;   // 只给样式用：跑 / 跳 / 吃 / 睡 的装饰能不能看清，靠它选中
    var bg = svgEl('svg');
    bg.setAttribute('viewBox', '0 0 160 130');
    bg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
    bg.setAttribute('class', 'f4-bg');
    bg.setAttribute('aria-hidden', 'true');
    bg.innerHTML = F4_BG[def.bg] || '';
    card.appendChild(bg);
    card.appendChild(f4Actor(subj));
    if (def.act === 'eat') {
      var food = assetImg('apple', 'f4-food');
      if (food) card.appendChild(food);
    }
    return card;
  }

    s.textContent =
      // minmax(0,1fr)：三列必须能压到小于卡片固有宽度，否则右侧会被容器裁掉（第 4 岛第 2 关踩过）

      '.option .f4-card{width:100%;aspect-ratio:1 / 1;border-radius:14px}' +
      '.option .f4-actor{width:78%}' +

  /** 题型 A：三幅场景宫格（选项栏隐藏，图更大更好点） */
  function renderF4Grid(q) {
    ensureF4Css();
    askDisplay.innerHTML = '';
    var grid = document.createElement('div');
    grid.className = 'f4-grid';
    grid.dataset.n = String(q.options.length);
    grid.setAttribute('aria-label', '句子图片');
    q.options.forEach(function (opt, i) {
      var tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'f4-tile';
      tile.dataset.idx = String(i);
      tile.dataset.subj = opt.subj;
      tile.setAttribute('aria-label', '句子图片');
      tile.appendChild(f4SceneNode(opt.subj));
      tile.addEventListener('click', function () {
        if (state.phase !== 'asking' || state.busy) return;
        judge(Number(tile.dataset.idx) === state.question.correct, tile);
      });
      grid.appendChild(tile);
    });
    askDisplay.appendChild(grid);
  }

  /** 题型 B：中央一幅「画面」，孩子在下方点 ✅ / ❌ 判断句子对不对 */
  function renderF4Picture(q) {
    ensureF4Css();
    askDisplay.innerHTML = '';
    var wrap = document.createElement('div');
    wrap.className = 'f4-stage';
    var card = f4SceneNode(q.pic, 'f4-big');
    card.id = 'f4-pic';
    wrap.appendChild(card);
    askDisplay.appendChild(wrap);
  }

  /** 题型 C：在跑 / 在睡 两个投放筐（图标 + 中文小标签，绝无英文字母） */
  function renderF4Zones(q) {
    ensureF4Css();
    askDisplay.innerHTML = '';
    var wrap = document.createElement('div');
    wrap.className = 'f4-zones';
    [['run', '在跑'], ['sleep', '在睡']].forEach(function (pair) {
      var zone = pair[0];
      var box = document.createElement('div');
      box.className = 'f4-zone';
      box.dataset.drop = 'f4' + zone;
      box.dataset.zone = zone;
      box.setAttribute('aria-label', pair[1]);

      var badge = document.createElement('div');
      badge.className = 'f4-zone-badge';
      var bs = svgEl('svg');
      if (zone === 'run') {
        bs.setAttribute('viewBox', '0 8 120 104');
        bs.innerHTML = f3KidMarkup('run');
      } else {
        bs.setAttribute('viewBox', '8 26 104 58');
        bs.innerHTML = f3KidMarkup('sleep');
      }
      badge.appendChild(bs);
      box.appendChild(badge);

      var tub = svgEl('svg');
      tub.setAttribute('viewBox', '0 0 120 100');
      tub.innerHTML = zone === 'run' ? F3_TUB_RUN : F3_TUB_SLEEP;
      box.appendChild(tub);

      var label = document.createElement('div');
      label.className = 'f4-zone-label';
      label.textContent = pair[1];
      box.appendChild(label);

      // 点选兜底：先点场景、再点筐 = 投放（RULES §二.11）
      box.addEventListener('click', function () {
        if (state.pickedFruit === null) return;
        resolveF4C(state.pickedFruit, box);
      });
      wrap.appendChild(box);
    });
    askDisplay.appendChild(wrap);
  }

  /** 答对后把场景缩略图放进对应的筐里（下一题重绘自动清掉） */
  function f4PlaceInZone(subj, zone) {
    var box = askDisplay.querySelector('.f4-zone[data-zone="' + zone + '"]');
    if (!box) return;
    box.appendChild(f4SceneNode(subj, 'f4-in-zone'));
  }

  /** 出题：0 = A 听长句找场景 / 1 = B 看图判断句子对错 / 2 = C 拖进「在跑 / 在睡」 */
  function makeQuestionF4(type, prev) {
    ensureF4Css();
    var q, guard = 0;
    do {
      if (type === 0) {
        var tgt = F4_POOL[randInt(0, F4_POOL.length - 1)];
        var rest = F4_POOL.filter(function (s) { return s !== tgt; });
        shuffle(rest);
        var optsA = [
          { kind: 'f4scene', subj: tgt },
          { kind: 'f4scene', subj: rest[0] },
          { kind: 'f4scene', subj: rest[1] }
        ];
        var ansA = optsA[0];
        shuffle(optsA);
        q = {
          type: 'F4A', sig: 'A:' + tgt, subj: tgt,
          options: optsA, correct: optsA.indexOf(ansA),
          audio: ['l4w4_a_' + F4_SCENES[tgt].key]
        };
      } else if (type === 1) {
        // 题型 B：说出的句子与画面「有时对、有时不对」，✅ / ❌ 交替出现，不靠运气
        var claim = F4_POOL[randInt(0, F4_POOL.length - 1)];
        state.f4Flip = !state.f4Flip;
        var truth = state.f4Flip;
        var pic = claim;
        if (!truth) {
          var cand = F4_POOL.filter(function (s) { return s !== claim; });
          pic = cand[randInt(0, cand.length - 1)];
        }
        var optsB = shuffle([{ kind: 'yesNo', val: true }, { kind: 'yesNo', val: false }]);
        q = {
          type: 'F4B', sig: 'B:' + claim + ':' + pic, claim: claim, pic: pic, truth: truth,
          options: optsB, correct: optsB[0].val === truth ? 0 : 1,
          audio: ['l4w4_b_' + F4_SCENES[claim].key, 'yesno']
        };
      } else {
        // 干扰项必须来自「另一个动作」：所以「动作对 + 筐对」两个条件同时成立才算对
        var ct = F4_C_ITEMS[randInt(0, F4_C_ITEMS.length - 1)];
        var cz = F4_ZONE_OF[ct];
        var pool2 = F4_C_ITEMS.filter(function (s) { return F4_ZONE_OF[s] !== cz; });
        var other = pool2[randInt(0, pool2.length - 1)];
        var optsC = [{ kind: 'f4scene', subj: ct }, { kind: 'f4scene', subj: other }];
        var ansC = optsC[0];
        shuffle(optsC);
        q = {
          type: 'F4C', sig: 'C:' + cz + ':' + ct, subj: ct, zone: cz,
          options: optsC, correct: optsC.indexOf(ansC),
          audio: ['l4w4_c_' + F4_SCENES[ct].key]
        };
      }
      guard += 1;
    } while (prev && prev.sig === q.sig && guard < 30);
    return q;
  }

  /** 题型 C 判定：点名的场景 + 落进对应的筐，两个条件都满足才算对 */
  function resolveF4C(itemIdx, target) {
    var q = state.question;
    if (!q || q.type !== 'F4C') return;
    var drop = target && target.dataset ? target.dataset.drop : '';
    var ok = drop === 'f4' + q.zone && itemIdx === q.correct;
    judge(ok, ok ? target : optionEls[itemIdx]);
  }

  /* 教学（custom 分支）：16 个环节 + 过渡语，收尾仍走 tutFinish() */
  var runF4Tutorial = (function () {
    function blank(me) {
      me.ask = null;
      me.hintTarget = null;
      me.hintFrom = null;
      me.hintTo = null;
      me.hintToY = 0.5;
      me.replay = null;
      clearHint();
    }
    function stage(me) {
      blank(me);
      askDisplay.innerHTML = '';
      ensureF4Css();
      var w = document.createElement('div');
      w.className = 'f4-stage';
      askDisplay.appendChild(w);
      return w;
    }
    /** 演示 A：一整幅场景（主体 + 背景），靠动作装饰与动画让句子"看得见" */
    function one(me, subj) {
      var wrap = stage(me);
      var c = f4SceneNode(subj, 'f4-big');
      wrap.appendChild(c);
      return { entries: [{ key: subj, el: c }] };
    }
    /** 演示 B：同一场景拉近（换视觉），配合句式变化（换句子） */
    function zoom(me, subj) {
      var wrap = stage(me);
      var c = f4SceneNode(subj, 'f4-big f4-zoom');
      wrap.appendChild(c);
      return { entries: [{ key: subj, el: c }] };
    }
    /** 互动 A：二选一（目标 + 一个易混项） */
    function pair2(me, a, b) {
      var wrap = stage(me);
      var pair = document.createElement('div');
      pair.className = 'f4-pair';
      var entries = [];
      shuffle([a, b]).forEach(function (k) {
        var c = f4SceneNode(k);
        pair.appendChild(c);
        entries.push({ key: k, el: c });
      });
      wrap.appendChild(pair);
      return { entries: entries };
    }
    /** 互动 B：三 / 四选一宫格 */
    function many(me, list) {
      var wrap = stage(me);
      var g = document.createElement('div');
      g.className = 'f4-grid';
      g.dataset.n = String(list.length);
      g.setAttribute('aria-label', '句子图片');
      wrap.appendChild(g);
      var entries = [];
      shuffle(list).forEach(function (k) {
        var c = f4SceneNode(k);
        g.appendChild(c);
        entries.push({ key: k, el: c });
      });
      return { entries: entries };
    }
    /** 对错判断：一幅画面 + 两个内联 SVG 按钮（✅ / ❌，绝不用 emoji 字符） */
    function ynStage(me, subj) {
      var wrap = stage(me);
      var card = f4SceneNode(subj, 'f4-big');
      wrap.appendChild(card);
      var bar = document.createElement('div');
      bar.className = 'f4-yn';
      wrap.appendChild(bar);
      var btns = [];
      shuffle([true, false]).forEach(function (v) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'f4-yn-btn';
        b.dataset.val = v ? '1' : '0';
        b.setAttribute('aria-label', v ? '对' : '不对');
        b.appendChild(yesNoNode(v));
        bar.appendChild(b);
        btns.push(b);
      });
      return { entries: [{ key: subj, el: card }], btns: btns };
    }

    var ACTS = [
      // 狗在跑：2 次演示 + 2 次互动
      { type: 'demo', build: function (me) { return one(me, 'dog_run'); },
        hi: 'dog_run', word: 'l4w4_t_dog1' },
      { type: 'demo', build: function (me) { return zoom(me, 'dog_run'); },
        hi: 'dog_run', word: 'l4w4_t_dog2' },
      { type: 'ask',  build: function (me) { return pair2(me, 'dog_run', 'dog_sleep'); },
        ans: 'dog_run', word: 'l4w4_t_dog3' },
      { type: 'ask',  build: function (me) { return many(me, ['dog_run', 'cat_sleep', 'horse_run']); },
        ans: 'dog_run', word: 'l4w4_t_dog4' },
      // 猫在睡
      { type: 'demo', build: function (me) { return one(me, 'cat_sleep'); },
        hi: 'cat_sleep', word: 'l4w4_t_cat1' },
      { type: 'demo', build: function (me) { return zoom(me, 'cat_sleep'); },
        hi: 'cat_sleep', word: 'l4w4_t_cat2' },
      { type: 'ask',  build: function (me) { return pair2(me, 'cat_sleep', 'dog_eat'); },
        ans: 'cat_sleep', word: 'l4w4_t_cat3' },
      { type: 'ask',  build: function (me) { return many(me, ['cat_sleep', 'horse_run', 'monkey_eat']); },
        ans: 'cat_sleep', word: 'l4w4_t_cat4' },
      // 猴子在吃
      { type: 'demo', build: function (me) { return one(me, 'monkey_eat'); },
        hi: 'monkey_eat', word: 'l4w4_t_mon1' },
      { type: 'demo', build: function (me) { return zoom(me, 'monkey_eat'); },
        hi: 'monkey_eat', word: 'l4w4_t_mon2' },
      { type: 'ask',  build: function (me) { return pair2(me, 'monkey_eat', 'bear_sleep'); },
        ans: 'monkey_eat', word: 'l4w4_t_mon3' },
      { type: 'ask',  build: function (me) { return many(me, ['monkey_eat', 'dog_run', 'horse_run']); },
        ans: 'monkey_eat', word: 'l4w4_t_mon4' },
      // 综合互动：三幅场景里挑出一句
      { type: 'ask',  build: function (me) { return many(me, ['dog_run', 'cat_sleep', 'monkey_eat']); },
        ans: 'monkey_eat', word: 'l4w4_t_show' },
      // 题型 B 的新交互（✅ / ❌）先由"老师"示范一次判断
      { type: 'yn',   build: function (me) { return ynStage(me, 'horse_run'); },
        ans: false, auto: true, word: 'l4w4_t_yn1' },
      // 再让孩子自己判一次
      { type: 'yn',   build: function (me) { return ynStage(me, 'cat_sleep'); },
        ans: true, word: 'l4w4_t_yn2' },
      // 过渡语（自带，不再叠 t_ready）
      { type: 'outro', build: function (me) {
          return many(me, ['dog_run', 'cat_sleep', 'monkey_eat', 'horse_run']);
        }, word: 'l4w4_t_done' }
    ];

    function playAct(me, i) {
      if (state.tut !== me) return;
      if (i >= ACTS.length) { tutFinish(me, false); return; }
      var act = ACTS[i];
      var built = act.build(me);

      if (act.type === 'outro') {
        me.replay = function () { say([act.word]); };
        built.entries.forEach(function (e) { e.el.classList.add('f4-glow'); });
        say([act.word], function () {
          if (state.tut !== me) return;
          tutFinish(me, false);
        });
        return;
      }

      if (act.type === 'demo') {
        me.replay = function () { say([act.word]); };
        say([act.word], function () {
          if (state.tut !== me) return;
          built.entries.forEach(function (e) {
            if (!act.hi || e.key === act.hi) e.el.classList.add('f4-glow');
          });
          setTimeout(function () { if (state.tut === me) playAct(me, i + 1); }, 1500);
        });
        return;
      }

      if (act.type === 'yn') {
        me.replay = function () { say([act.word]); };
        var rightBtn = null;
        built.btns.forEach(function (b) {
          if ((b.dataset.val === '1') === act.ans) rightBtn = b;
        });
        if (act.auto) {
          // 示范：先说完，再把正确答案点亮，停 1.8 秒进入下一步
          say([act.word], function () {
            if (state.tut !== me) return;
            if (rightBtn) rightBtn.classList.add('f4-yn-right', 'f4-glow');
            setTimeout(function () { if (state.tut === me) playAct(me, i + 1); }, 1800);
          });
          return;
        }
        me.ask = act.ans ? 'yes' : 'no';
        me.hintTarget = rightBtn;
        say([act.word]);
        armHint();
        built.btns.forEach(function (b) {
          b.addEventListener('click', function () {
            if (state.tut !== me || !me.ask) return;
            if ((b.dataset.val === '1') === act.ans) {
              clearHint();
              coin();
              ting();
              me.ask = null;
              b.classList.add('f4-yn-right');
              setTimeout(function () { if (state.tut === me) playAct(me, i + 1); }, 900);
            } else {
              b.classList.add('f4-shake');
              setTimeout(function () { b.classList.remove('f4-shake'); }, 520);
              say(['again']);
              armHint();
            }
          });
        });
        return;
      }

      // 互动：点对才推进；点错抖一下 + 温柔鼓励；4 秒无操作弹小手指（RULES §二.12）
      var ansEl = null;
      built.entries.forEach(function (e) { if (e.key === act.ans) ansEl = e; });
      me.ask = act.ans;
      me.hintTarget = ansEl ? ansEl.el : null;
      me.replay = function () { say([act.word]); };
      say([act.word]);
      armHint();
      built.entries.forEach(function (entry) {
        entry.el.addEventListener('click', function () {
          if (state.tut !== me || !me.ask) return;
          if (entry.key === me.ask) {
            clearHint();
            coin();
            ting();
            me.ask = null;
            entry.el.classList.add('f4-right');
            setTimeout(function () { if (state.tut === me) playAct(me, i + 1); }, 900);
          } else {
            entry.el.classList.add('f4-shake');
            setTimeout(function () { entry.el.classList.remove('f4-shake'); }, 520);
            say(['again']);
            armHint();
          }
        });
      });
    }

    var api = function (me) { playAct(me, 0); };
    api.check = function () { return false; };
    return api;
  })();

  /** 题型 A：三个动作场景 + 一台大相机（模仿完点相机即完成） */
  function renderF5Imitate(q) {

  /** 出题：0 = A 听指令做动作 / 1 = B 看剪影猜动物 / 2 = C 找同一只动物里正在做那件事的 */
  function makeQuestionF5(type, prev) {
    ensureF5Css();
    var q, guard = 0;
    do {
      if (type === 0) {
        var ca = F5_A_CASES[randInt(0, F5_A_CASES.length - 1)];
        var listA = [ca.target].concat(ca.set);
        shuffle(listA);
        var optsA = listA.map(function (s) { return { kind: 'f4scene', subj: s }; });
        q = {
          type: 'F5A', sig: 'A:' + ca.key, subj: ca.target,
          options: optsA, correct: listA.indexOf(ca.target),
          audio: [ca.key]
        };
      } else if (type === 1) {
        var sb = F5_B_SETS[randInt(0, F5_B_SETS.length - 1)];
        var animals = shuffle(sb.animals.slice());
        var target = animals[randInt(0, animals.length - 1)];
        var optsB = animals.map(function (a) { return { kind: 'f5animal', animal: a }; });
        q = {
          type: 'F5B', sig: 'B:' + sb.act + ':' + target, animal: target, act: sb.act,
          options: optsB, correct: animals.indexOf(target),
          audio: [sb.key]
        };
      } else {
        var cc = F5_C_CASES[randInt(0, F5_C_CASES.length - 1)];
        var listC = shuffle(cc.set.slice());
        var optsC = listC.map(function (s) { return { kind: 'f4scene', subj: s }; });
        q = {
          type: 'F5C', sig: 'C:' + cc.animal + ':' + cc.ans, subj: cc.ans, animal: cc.animal,
          options: optsC, correct: listC.indexOf(cc.ans),
          audio: [cc.key]
        };
      }
      guard += 1;
    } while (prev && prev.sig === q.sig && guard < 30);
    return q;
  }

  /* 教学（custom 分支）：14 个环节，收尾仍走 tutFinish() */
  var runF5Tutorial = (function () {

      wrap.appendChild(cam);

    /** 互动：孩子做动作，点相机才算完成 */
    function camKid(me, pose, tag, variant) {
      var wrap = stage(me);
      var kid = f5KidNode(pose, tag, variant);
      wrap.appendChild(kid);
      var cam = f5CamButton();
      wrap.appendChild(cam);
      return { kid: kid, cam: cam };
    }

    var ACTS = [
      // ① 新交互：相机按钮本身
      { type: 'camdemo', word: 'l4w5_t_cam', build: function (me) { return camOnly(me); } },
      // ② run：2 次演示 + 2 次互动
      { type: 'demo', word: 'l4w5_t_run1', hi: 'dog_run',
        build: function (me) { return camScene(me, 'dog_run'); } },
      { type: 'cam',  word: 'l4w5_t_run2',
        build: function (me) { return camKid(me, 'run', 'kid_run_a'); } },
      { type: 'demo', word: 'l4w5_t_run3', hi: 'horse_run',
        build: function (me) { return camScene(me, 'horse_run', 'f4-zoom'); } },
      { type: 'cam',  word: 'l4w5_t_run4',
        build: function (me) { return camKid(me, 'run', 'kid_run_b', 'b'); } },
      // ③ jump：2 次演示 + 2 次互动
      { type: 'demo', word: 'l4w5_t_jump1', hi: 'frog_jump',
        build: function (me) { return camScene(me, 'frog_jump'); } },
      { type: 'cam',  word: 'l4w5_t_jump2',
        build: function (me) { return camKid(me, 'jump', 'kid_jump_a'); } },
      { type: 'demo', word: 'l4w5_t_jump3', hi: 'kangaroo_jump',
        build: function (me) { return camScene(me, 'kangaroo_jump', 'f4-zoom'); } },
      { type: 'cam',  word: 'l4w5_t_jump4',
        build: function (me) { return camKid(me, 'jump', 'kid_jump_b', 'b'); } },
      // ④ sleep：2 次演示 + 2 次互动
      { type: 'demo', word: 'l4w5_t_sleep1', hi: 'cat_sleep',
        build: function (me) { return camScene(me, 'cat_sleep'); } },
      { type: 'cam',  word: 'l4w5_t_sleep2',
        build: function (me) { return camKid(me, 'sleep', 'kid_sleep_a'); } },
      { type: 'demo', word: 'l4w5_t_sleep3', hi: 'pig_sleep',
        build: function (me) { return camScene(me, 'pig_sleep', 'f4-zoom'); } },
      { type: 'cam',  word: 'l4w5_t_sleep4',
        build: function (me) { return camKid(me, 'sleep', 'kid_sleep_b', 'b'); } },
      // ⑤ 过渡语（自带，不再叠 t_ready）
      { type: 'outro', word: 'l4w5_t_done',
        build: function (me) {
          var wrap = stage(me);
          var row = document.createElement('div');
          row.className = 'f5-row';
          var cards = [];
          ['dog_run', 'frog_jump', 'cat_sleep'].forEach(function (k) {
            var c = f4SceneNode(k);
            row.appendChild(c);
            cards.push({ key: k, el: c });
          });
          wrap.appendChild(row);
          return { entries: cards };
        } }
    ];

    function playAct(me, i) {
      if (state.tut !== me) return;
      if (i >= ACTS.length) { tutFinish(me, false); return; }
      var act = ACTS[i];
      var built = act.build(me);

      // 过渡语：三幅场景一起发光 → 说完直接进答题
      if (act.type === 'outro') {
        me.replay = function () { say([act.word]); };
        built.entries.forEach(function (e) { e.el.classList.add('f4-glow'); });
        say([act.word], function () {
          if (state.tut !== me) return;
          tutFinish(me, false);
        });
        return;
      }

      // 相机示范：说完把这台相机点亮，停 1.8 秒再走
      if (act.type === 'camdemo') {
        me.replay = function () { say([act.word]); };
        say([act.word], function () {
          if (state.tut !== me) return;
          built.cam.classList.add('f5-cam-hot');
          setTimeout(function () { if (state.tut === me) playAct(me, i + 1); }, 1800);
        });
        return;
      }

      // 演示：说完让画面发光，停一下再走
      if (act.type === 'demo') {
        me.replay = function () { say([act.word]); };
        say([act.word], function () {
          if (state.tut !== me) return;
          built.entries.forEach(function (e) {
            if (!act.hi || e.key === act.hi) e.el.classList.add('f4-glow');
          });
          setTimeout(function () { if (state.tut === me) playAct(me, i + 1); }, 1500);
        });
        return;
      }

      // 互动：点相机 → 音效 + 推进；4 秒没动 → 小手指指向相机（RULES §二.12）
      var cam = built.cam;
      me.ask = 'cam';
      me.hintTarget = cam;
      me.replay = function () { say([act.word]); };
      say([act.word]);
      armHint();
      cam.addEventListener('click', function () {
        if (state.tut !== me || !me.ask) return;
        clearHint();
        coin();
        ting();
        me.ask = null;
        cam.classList.add('right');
        setTimeout(function () { if (state.tut === me) playAct(me, i + 1); }, 900);
      });
    }

    var api = function (me) { playAct(me, 0); };
    api.check = function () { return false; };
    return api;
  })();

  var runB4Tutorial = (function () {
    function blank(me) { me.hintTarget = null; me.ask = null; clearHint(); }
    function stage(me) {
      askDisplay.innerHTML = '';
      var g = document.createElement('div');

      return g;
    }
    function tile(asset, lib) {

      t.type = 'button';
      t.className = 'b4-tile';
      t.dataset.asset = asset;
      t.setAttribute('aria-label', '图片');

      if (img) t.appendChild(img);
      return t;
    }
    function demo(me) {
      if (state.tut !== me) return;
      blank(me);
      var g = stage(me);
      var apples = [tile('apple', 'fruit'), tile('apple', 'fruit'), tile('apple', 'fruit')];
      var banana = tile('banana', 'fruit');
      apples.concat([banana]).forEach(function (t) { g.appendChild(t); });
      // 演示：先播讲解，再让香蕉发光（动画挂在 say 的 onDone 上，不猜音频时长）
      say(['l3w4_tut_demo'], function () {
        if (state.tut !== me) return;
        banana.classList.add('glow');
        setTimeout(function () { if (state.tut === me) interactive(me); }, 1500);
      });
    }
    function interactive(me) {
      if (state.tut !== me) return;
      blank(me);
      var g = stage(me);
      var dogs = [tile('dog', 'animal'), tile('dog', 'animal'), tile('dog', 'animal')];
      var cat = tile('cat', 'animal');
      var all = dogs.concat([cat]);
      shuffle(all).forEach(function (t) { g.appendChild(t); });
      me.ask = 'cat';
      me.hintTarget = cat;
      me.replay = function () { say(['l3w4_tut_ask']); };
      say(['l3w4_tut_ask'], function () {
        if (state.tut !== me) return;
        armHint();   // 4 秒无操作 → 小手指示范点猫（RULES §二.12）
      });
      all.forEach(function (t) {
        t.addEventListener('click', function () {
          if (state.tut !== me || !me.ask) return;
          if (t.dataset.asset === 'cat') {
            clearHint(); coin(); ting();
            t.classList.add('right'); me.ask = null;
            setTimeout(function () { if (state.tut === me) tutFinish(me); }, 900);
          } else {
            t.classList.add('wrong');

    api.check = function () { return false; };

  })();

  var runB3Tutorial = (function () {
    // 四个教学案例（两个长、两个短），每个都给一个视觉对比 + 一个生活联想
    var CASES = [
      { kind: 'snake',  cmp: 'long',  word: 'l3w3_tut_long1',  anim: 'ls-glow',  ask: false },
      { kind: 'bread',  cmp: 'long',  word: 'l3w3_tut_long2',  anim: 'ls-bounce', ask: false },
      { kind: 'pencil', cmp: 'short', word: 'l3w3_tut_short1', anim: 'ls-flash',  ask: false },
      { kind: 'scarf',  cmp: 'short', word: 'l3w3_tut_short2', anim: 'ls-sway',   ask: false }
    ];
    // 两道互动跟做（4 秒透明小手引导）
    var ASKS = [
      { kind: 'snake',  cmp: 'long',  word: 'l3w3_tut_long_ask' },
      { kind: 'pencil', cmp: 'short', word: 'l3w3_tut_short_ask' }
    ];

    function blank(me) {
      me.ask = null;
      me.hintTarget = null;
      me.replay = null;
      clearHint();
    }

    function stage(me) {
      blank(me);
      askDisplay.innerHTML = '';
      var wrap = document.createElement('div');
      wrap.className = 'b3-tut-stage';
      askDisplay.appendChild(wrap);
      return wrap;
    }

    function renderPair(me, kind) {
      var wrap = stage(me);
      var pair = b3Pair(kind);
      wrap.appendChild(pair.row);
      me.nodes = pair;
      return pair;
    }

    /* 教学四案例：逐条播语音 + 高亮被强调的那一只 */
    function teachCase(me, i) {
      if (state.tut !== me) return;
      if (i >= CASES.length) { askLoop(me, 0); return; }
      var c = CASES[i];
      var pair = renderPair(me, c.kind);
      var target = (c.cmp === 'long') ? pair.long : pair.short;
      say([c.word], function () {
        if (state.tut !== me) return;
        target.classList.add(c.anim);   // 拉长发光 / 弹跳 / 缩小闪烁 / 摇摆
        setTimeout(function () {
          if (state.tut !== me) return;
          teachCase(me, i + 1);
        }, 1500);
      });
    }

    /* 互动跟做：两题，点对才推进，点错抖一下 + 温柔鼓励 */
    function askLoop(me, k) {
      if (state.tut !== me) return;
      if (k >= ASKS.length) { tutFinish(me); return; }
      var a = ASKS[k];
      var pair = renderPair(me, a.kind);
      me.ask = a.cmp;
      me.hintTarget = (a.cmp === 'long') ? pair.long : pair.short;
      me.replay = function () { say([a.word]); };
      say([a.word]);
      armHint();
      [pair.long, pair.short].forEach(function (node) {
        node.addEventListener('click', function () {
          if (state.tut !== me || !me.ask) return;
          if (node.dataset.ls === me.ask) {
            clearHint();
            coin();
            ting();
            node.classList.add('right');
            me.ask = null;
            setTimeout(function () { if (state.tut === me) askLoop(me, k + 1); }, 950);
          } else {
            node.classList.add('shake');
            setTimeout(function () { node.classList.remove('shake'); }, 520);
            say(['again']);
            armHint();
          }
        });
      });
    }

    var api = function (me) { teachCase(me, 0); };
    api.check = function () { return false; };
    return api;
  })();

  function renderDisplay(q) {
    askDisplay.innerHTML = '';

    /* ---- 第 3 岛第 4 关：找不同（4 张图点选，选项栏隐藏） ---- */
    if (q.type === 'B4') { optionsBar.classList.add('gone'); return; }
    if (q.type === 'B5A' || q.type === 'B5B') { optionsBar.classList.add('gone'); return; }
    if (q.type === 'B5C') { renderB5Gate(q); return; }

    /* ---- 第 4 岛第 1 关：农场动物（A/B 用独立宫格，C 用农场门） ---- */
    if (q.type === 'F1A' || q.type === 'F1B') { optionsBar.classList.add('gone'); return; }
    if (q.type === 'F1C') { renderF1Farm(q); return; }

    /* ---- 第 4 岛第 2 关：野生动物（A/B 用宫格，C 用丛林/农场两个投放区） ---- */
    if (q.type === 'F2A' || q.type === 'F2B') { optionsBar.classList.add('gone'); return; }
    if (q.type === 'F2C') { renderF2Zones(q); return; }

    /* ---- 第 4 岛第 3 关：动词（A/B 用宫格，C 用在跑 / 在睡两个筐） ---- */
    if (q.type === 'F3A' || q.type === 'F3B') { optionsBar.classList.add('gone'); return; }
    if (q.type === 'F3C') { renderF3Zones(q); return; }

    /* ---- 第 4 岛第 4 关：动物 + 动作短句（A 用场景宫格，B 用单幅画面 + ✅/❌，C 用在跑 / 在睡两个筐） ---- */
    if (q.type === 'F4A') { optionsBar.classList.add('gone'); return; }
    if (q.type === 'F4B') { renderF4Picture(q); return; }
    if (q.type === 'F4C') { renderF4Zones(q); return; }

    /* ---- 第 4 岛第 5 关：游乐场 · 听音模仿（A 三场景 + 大相机，B 放大镜剪影，C 同种动物宫格） ---- */
    if (q.type === 'F5A') { optionsBar.classList.add('gone'); renderF5Imitate(q); return; }
    if (q.type === 'F5B') { renderF5Lens(q); return; }
    if (q.type === 'F5C') { optionsBar.classList.add('gone'); return; }

    /* ---- 第 3 岛第 1 关：大与小 ---- */
    if (q.type === 'B1A' || q.type === 'B1B') {
      // 答案都在下方选项里，中央只提示"仔细听"
      askDisplay.appendChild(listenNode());
      return;
    }
    if (q.type === 'B1C') {
      // 左大箱 / 右小箱，两个箱子都是投放目标（判定区放宽 8%）
      askDisplay.appendChild(b1BoxRow());
      return;
    }

    /* ---- 第 3 岛第 2 关：多 / 少 ---- */
    if (q.type === 'B2A' || q.type === 'B2B') {
      // 答案都在下方选项（两 / 三堆水果）里，中央只提示"仔细听"
      askDisplay.appendChild(listenNode());
      return;
    }
    if (q.type === 'B2C') {
      // 上方两个箱子（Many dots = 多，Few dots = 少），都是投放目标（判定区放宽 8%）
      askDisplay.appendChild(b2BoxRow());
      return;
    }

    /* ---- 第 3 岛第 3 关：长 / 短 ---- */
    if (q.type === 'B3A' || q.type === 'B3B') {
      // 答案都在下方选项里，中央只提示"仔细听"
      askDisplay.appendChild(listenNode());
      return;
    }
    if (q.type === 'B3C') {
      // 上方两个箱子（长条 = 长，短条 = 短），都是投放目标（判定区放宽 8%）
      askDisplay.appendChild(b3BoxRow());
      return;
    }

    /* ---- 第 2 岛第 5 关：形状与空间终极考验 ---- */
    if (q.type === 'P5A') {
      // 三个场景都在选项里，中央只提示"仔细听"
      askDisplay.appendChild(listenNode());
      return;
    }
    if (q.type === 'P5B') {
      // 中央透明正方形（放宽判定）即投放目标
      askDisplay.appendChild(p5SquareStage());
      return;
    }
    if (q.type === 'P5C') {
      // 夸张场景：三角形坐在正方形上 / 圆形在正方形里 / 长方形躲在正方形后
      askDisplay.appendChild(p5VerdictNode(q.kind));
      return;
    }

    /* ---- 第 2 岛第 4 关：形状 + 空间组合 ---- */
    if (q.type === 'P4A') {
      // 三个场景都在选项里，中央只提示"仔细听"
      askDisplay.appendChild(listenNode());
      return;
    }
    if (q.type === 'P4B') {
      // 中央透明正方形即投放目标
      askDisplay.appendChild(squareStage());
      return;
    }
    if (q.type === 'P4C') {
      // 夸张场景：三角形坐在正方形上 / 圆形在正方形里
      askDisplay.appendChild(p4VerdictNode(q.kind));
      return;
    }

    /* ---- 第 2 岛第 3 关：空间进阶 ---- */
    if (q.type === 'P3A') {
      // 三个椅子场景都在选项里，中央只提示"仔细听"
      askDisplay.appendChild(listenNode());
      return;
    }
    if (q.type === 'P3B') {
      // 中央大纸箱即投放目标（要放到箱子后面）
      askDisplay.appendChild(boxSceneNode());
      return;
    }
    if (q.type === 'P3C') {
      // 复杂场景：球在床下 / 男孩在门后 …
      askDisplay.appendChild(p3VerdictNode(q.kind));
      return;
    }

    /* ---- 第 2 岛第 2 关：空间方位 ---- */
    if (q.type === 'P2A') {
      // 三个盒子场景都在下方选项里，中央只提示"仔细听"
      askDisplay.appendChild(listenNode());
      return;
    }
    if (q.type === 'P2B') {
      // 中央桌子即投放目标
      askDisplay.appendChild(tableStage());
      return;
    }
    if (q.type === 'P2C') {
      // 夸张场景：猫顶着盘子 / 猫在盒子里 / 球在盒子里 / 球在盒子上
      askDisplay.appendChild(p2VerdictNode(q.kind));
      return;
    }

    /* ---- 第 2 岛第 1 关：形状 ---- */
    if (q.type === 'S1A' || q.type === 'S1B') {
      // 答案都在下方选项里，中央只提示"仔细听"
      askDisplay.appendChild(listenNode());
      return;
    }

    if (q.type === 'S1C') {
      // 拼图房子：答对时对应那一块会亮
      askDisplay.appendChild(houseSvg());
      return;
    }

    /* ---- 第 5 关：游乐场 ---- */
    if (q.type === 'W5A') {
      // 小怪兽是投放目标：把装着正确数量的果篮拖到它嘴边
      var m = monsterNode(q.num, q.fruit);
      m.classList.add('drop-target');
      m.dataset.drop = 'monster';
      m.dataset.idx = '0';
      askDisplay.appendChild(m);
      return;
    }

    if (q.type === 'W5B') {
      renderTray(q);
      return;
    }

    if (q.type === 'W5C') {
      askDisplay.appendChild(listenNode());
      return;
    }

    /* ---- 第 4 关：颜色 ---- */
    if (q.type === 'W4A' || q.type === 'W4B') {
      // A/B 的答案都在下方的图片选项里，屏幕中央只提示"仔细听"
      askDisplay.appendChild(listenNode());
      return;
    }

    if (q.type === 'W4C') {
      // 灰色物品：答对瞬间会被"刷"成目标颜色（见 paintItem）
      var paintWrap = document.createElement('div');
      paintWrap.className = 'paint-wrap';
      var img = assetImg(q.item.asset + '_gray', 'paint-item');
      if (img) paintWrap.appendChild(img);
      askDisplay.appendChild(paintWrap);
      return;
    }

    /* ---- 第 3 关三题型 ---- */
    if (q.type === 'W3A') {
      // 听 "Twenty-four" 点数字底板；屏幕不给任何数字，靠耳朵分辨连读
      askDisplay.appendChild(listenNode());
      return;
    }

    if (q.type === 'W3B') {
      // 听短句找组合图：中央什么都不显示，答案只在语音里
      return;
    }

    if (q.type === 'W3C') {
      // 数数大挑战：中央十格阵果堆（10 个一组，25 = 10+10+5）
      askDisplay.appendChild(tenFrame(q.fruit, q.num, { cls: 'tf-display' }));
      return;
    }

    /* ---- 第 2 关三题型 ---- */
    if (q.type === 'W2A') {
      // 听数字找数量组：显示区只给"仔细听"，三堆果堆在选项里（十格阵已足够直观）
      var listenA = document.createElement('div');
      listenA.className = 'listen-wrap';
      var hornA = document.createElement('div');
      hornA.className = 'listen-horn';
      hornA.appendChild(svgIcon('speaker'));
      var bubbleA = document.createElement('span');
      bubbleA.className = 'listen-bubble';
      bubbleA.textContent = '?';
      listenA.appendChild(hornA);
      listenA.appendChild(bubbleA);
      askDisplay.appendChild(listenA);
      return;
    }

    if (q.type === 'W2B') {
      // 听短句找水果标牌：显示区给"单个大水果 + 放大镜"提示当前水果种类
      var wrapB2 = document.createElement('div');
      wrapB2.className = 'target-wrap';
      var fruitB2 = document.createElement('div');
      fruitB2.className = 'target-fruit';
      fruitB2.appendChild(fruitImg(q.fruit));
      var badgeB2 = document.createElement('span');
      badgeB2.className = 'target-badge';
      badgeB2.appendChild(svgIcon('search'));
      wrapB2.appendChild(fruitB2);
      wrapB2.appendChild(badgeB2);
      askDisplay.appendChild(wrapB2);
      return;
    }

    if (q.type === 'W2C') {
      // 数字喂食机：肚子挂数字牌的小怪兽，语音 "Feed me twenty strawberries."
      askDisplay.appendChild(monsterNode(q.num, q.fruit));
      return;
    }

    // 三种题型显示区各不相同，防止看屏幕就知道答案：
    //   A 听数字找实物 → 果堆（数量即线索，语音报数字）
    //   B 听名词找水果 → 只给大喇叭"仔细听"提示，答案完全靠语音（f_xxx），
    //     屏幕绝不出示任何水果，否则孩子直接看图配对，听力练习失效
    //   C 听指令找果堆 → 单个大水果 + 放大镜，答案靠语音（q_xxx_fruit）
    if (q.type === 'A') {
      askDisplay.appendChild(pileNode(q.fruit, q.num, 'display'));
      return;
    }

    if (q.type === 'B') {
      var listen = document.createElement('div');
      listen.className = 'listen-wrap';
      var horn = document.createElement('div');
      horn.className = 'listen-horn';
      horn.appendChild(svgIcon('speaker'));
      var bubble = document.createElement('span');
      bubble.className = 'listen-bubble';
      bubble.textContent = '?';
      listen.appendChild(horn);
      listen.appendChild(bubble);
      askDisplay.appendChild(listen);
      return;
    }

    var wrap = document.createElement('div');
    wrap.className = 'target-wrap';
    var fruit = document.createElement('div');
    fruit.className = 'target-fruit';
    fruit.appendChild(fruitImg(q.fruit));
    var badge = document.createElement('span');
    badge.className = 'target-badge';
    badge.appendChild(svgIcon('search'));
    wrap.appendChild(fruit);
    wrap.appendChild(badge);
    askDisplay.appendChild(wrap);
  }

  /* ==================== 第 2 关（W2）：16–20 与数量 ==================== */

  /**
   * 十格阵：10 个一组排成 2×5 的格子，余数另起一格。
   * 16 = 一个满格(10) + 一个 6 格，孩子在视觉上就能"十 + 六"地读出来。
   */
  function tenFrame(fruit, count, opts) {
    opts = opts || {};
    var wrap = document.createElement('div');
    wrap.className = 'ten-frame' + (opts.cls ? ' ' + opts.cls : '');

    var tens = Math.floor(count / 10);
    var rest = count % 10;

    function grid(filled, cells) {
      var g = document.createElement('div');
      g.className = 'tf-grid';
      for (var i = 0; i < cells; i++) {
        var cell = document.createElement('span');
        cell.className = 'tf-cell' + (i < filled ? ' on' : '');
        if (i < filled) cell.appendChild(fruitImg(fruit));
        g.appendChild(cell);
      }
      return g;
    }

    for (var t = 0; t < tens; t++) wrap.appendChild(grid(10, 10));
    if (rest > 0 || tens === 0) wrap.appendChild(grid(rest, 10));
    return wrap;
  }

  /** 估数堆：不排格子，松散堆叠，只用于"大概多少个"的视觉估数 */
  function loosePile(fruit, count, cls) {
    var box = document.createElement('div');
    box.className = 'loose-pile' + (cls ? ' ' + cls : '');
    for (var i = 0; i < count; i++) {
      var s = document.createElement('span');
      s.appendChild(fruitImg(fruit));
      box.appendChild(s);
    }
    return box;
  }

  /** 3D 卡通小怪兽：肚子上挂数字牌（numberSign），可张嘴吃水果 */
  function monsterNode(num, fruit) {
    var box = document.createElement('div');
    box.className = 'monster';

    var ears = document.createElement('div');
    ears.className = 'monster-ears';
    ears.innerHTML = '<i></i><i></i>';
    box.appendChild(ears);

    var body = document.createElement('div');
    body.className = 'monster-body';

    var eyes = document.createElement('div');
    eyes.className = 'monster-eyes';
    eyes.innerHTML = '<i><b></b></i><i><b></b></i>';
    body.appendChild(eyes);

    var belly = document.createElement('div');
    belly.className = 'monster-belly';
    belly.appendChild(numberSign(num, null));
    body.appendChild(belly);

    var mouth = document.createElement('div');
    mouth.className = 'monster-mouth';
    body.appendChild(mouth);

    box.appendChild(body);
    return box;
  }

  /** 题型 B（W2）：数字标牌 + 小水果图标，三选一 */
  function signCard(num, fruit) {
    var wrap = document.createElement('div');
    wrap.className = 'sign-plate';
    wrap.appendChild(numberSign(num, null));
    var chip = document.createElement('span');
    chip.className = 'sign-chip';
    chip.appendChild(fruitImg(fruit));
    wrap.appendChild(chip);
    return wrap;
  }

  /** 第 3 关：巨大 3D 数字底板（圆润木牌 + 立体投影，绝不用裸文本数字） */
  function numSlab(num) {
    var slab = document.createElement('div');
    slab.className = 'num-slab';
    slab.appendChild(numberSign(num, null));
    return slab;
  }

  function removeDecor(btn) {
    var nodes = btn.querySelectorAll('.hint-hand, .pile-num');    for (var i = nodes.length - 1; i >= 0; i--) nodes[i].parentNode.removeChild(nodes[i]);
  }

  function renderOptions(q) {
    if (q.type === 'B4') { renderB4Grid(q); return; }
    if (q.type === 'B5A' || q.type === 'B5B') { renderB5Grid(q); return; }
    if (q.type === 'F1A' || q.type === 'F1B') { renderF1Grid(q); return; }
    if (q.type === 'F2A' || q.type === 'F2B') { renderF2Grid(q); return; }
    if (q.type === 'F3A' || q.type === 'F3B') { renderF3Grid(q); return; }
    if (q.type === 'F4A') { renderF4Grid(q); return; }   // F4B 走公共的对错按钮，不需要单独分支
    if (q.type === 'F5C') { renderF4Grid(q); return; }   // 三只同种动物做不同动作，与第 4 关同款宫格
    optionEls.forEach(function (btn, i) {
      removeDecor(btn);
      btn.className = 'option';
      btn.hidden = false;
      var slot = btn.querySelector('.slot');
      slot.className = 'slot';
      slot.innerHTML = '';

      var opt = q.options[i];
      if (!opt) { btn.hidden = true; return; }   // 对错题只有 2 个选项，第三个收起

      if (opt.kind === 'sign') {
        btn.classList.add('sign-opt');
        slot.appendChild(numberSign(opt.value, opt.fruit));
      } else if (opt.kind === 'bsItem') {
        // 第 3 岛第 1 关题型 A：同一件物品的一大一小
        btn.classList.add('bs-opt');
        slot.appendChild(bsItemNode(opt.asset, opt.size));
      } else if (opt.kind === 'bsAnimal') {
        // 题型 B：三只动物，只有一只尺寸与指令一致
        btn.classList.add('bs-opt');
        slot.appendChild(bsAnimalNode(opt.animal.id, opt.size));
      } else if (opt.kind === 'bsDrag') {
        // 题型 C：可拖进同尺寸箱子的大 / 小物品
        btn.classList.add('bs-opt', 'bs-drag-opt');
        slot.appendChild(bsItemNode(opt.asset, opt.size));
      } else if (opt.kind === 'lsObj') {
        // 第 3 岛第 3 关题型 A：同物一长一短，点对应那一只
        btn.classList.add('ls-opt');
        slot.appendChild(lsObjectNode(opt.obj, opt.cmp));
      } else if (opt.kind === 'lsAnimal') {
        // 题型 B：三只动物，点「长」的那只
        btn.classList.add('ls-opt');
        slot.appendChild(lsAnimalNode(opt.animal));
      } else if (opt.kind === 'b3Drag') {
        // 题型 C：可拖进 Long / Short 箱的长 / 短香蕉
        btn.classList.add('ls-opt', 'ls-drag-opt');
        slot.appendChild(lsObjectNode(opt.obj, opt.cmp));
      } else if (opt.kind === 'b2Pile') {
        // 第 3 岛第 2 关题型 A / B：一堆水果（数量一眼可数）
        btn.classList.add('b2-opt');
        slot.appendChild(b2BasketNode(opt.fruit, opt.count));
      } else if (opt.kind === 'b2Drag') {
        // 题型 C：可拖进 More / Less 箱的一堆水果
        btn.classList.add('b2-opt', 'b2-drag-opt');
        slot.appendChild(b2BasketNode(opt.fruit, opt.count));
      } else if (opt.kind === 'fruit') {
        var fimg = fruitImg(opt.fruit);
        fimg.classList.add('slot-img');
        slot.appendChild(fimg);
      } else if (opt.kind === 'tf') {
        // 第 2 关题型 A：十格阵果堆（不标数字，让孩子自己数）
        btn.classList.add('tf-opt');
        slot.appendChild(tenFrame(opt.fruit, opt.count));
      } else if (opt.kind === 'sign2') {
        // 第 2 关题型 B：数字标牌 + 小水果图标
        btn.classList.add('sign2-opt');
        slot.appendChild(signCard(opt.value, opt.fruit));
      } else if (opt.kind === 'loose') {
        // 第 2 关题型 C：松散果堆，凭视觉估数
        btn.classList.add('loose-opt');
        slot.appendChild(loosePile(opt.fruit, opt.count));
      } else if (opt.kind === 'slab') {
        // 第 3 关题型 A/C：巨大 3D 数字底板
        btn.classList.add('slab-opt');
        slot.appendChild(numSlab(opt.value));
      } else if (opt.kind === 'combo') {
        // 第 3 关题型 B：一小堆水果（2–5 个）
        btn.classList.add('combo-opt');
        slot.appendChild(loosePile(opt.fruit, opt.count, 'combo-pile'));
      } else if (opt.kind === 'colorBalloon') {
        // 第 4 关题型 A：3D 气球
        btn.classList.add('color-opt');
        slot.appendChild(assetImg('balloon_' + opt.color.id, 'color-img') || document.createTextNode(''));
      } else if (opt.kind === 'colorFruit') {
        // 第 4 关题型 B：3D 苹果（同形状、异颜色）
        btn.classList.add('color-opt');
        slot.appendChild(assetImg(opt.fruit + '_' + opt.color.id, 'color-img') || document.createTextNode(''));
      } else if (opt.kind === 'shape') {
        // 第 2 岛第 1 关题型 A：纯色 3D 几何图形
        btn.classList.add('shape-opt');
        slot.appendChild(shapeSvg(opt.shape.id, opt.color));
      } else if (opt.kind === 'object') {
        // 题型 B：生活物品（披萨 / 窗户 / 西瓜片）
        btn.classList.add('shape-opt', 'obj-opt');
        slot.appendChild(objectSvg(opt.shape.id, opt.color));
      } else if (opt.kind === 'shapeBtn') {
        // 题型 C：形状按钮
        btn.classList.add('shape-opt', 'shape-btn-opt');
        slot.appendChild(shapeSvg(opt.shape.id, opt.color));
      } else if (opt.kind === 'p5star') {
        // 第 2 岛第 5 关题型 A：星星与圆环（圈上 / 圈里 / 圈后）
        btn.classList.add('pos-opt');
        slot.appendChild(p5StarSceneNode(opt.pos));
      } else if (opt.kind === 'p5item') {
        // 题型 B：可拖进正方形的三件物品（圆苹果 / 三角披萨 / 长方书）
        btn.classList.add('item-opt');
        slot.appendChild(p4ItemNode(opt.item.id));
      } else if (opt.kind === 'p4star') {
        // 第 2 岛第 4 关题型 A：星星与圆圈（圈上 / 圈里 / 圈旁）
        btn.classList.add('pos-opt');
        slot.appendChild(starSceneNode(opt.pos));
      } else if (opt.kind === 'p4item') {
        // 题型 B：可拖进正方形的物品
        btn.classList.add('item-opt');
        slot.appendChild(p4ItemNode(opt.item.id));
      } else if (opt.kind === 'p3chair') {
        // 第 2 岛第 3 关题型 A：椅子 + 小猫（下 / 后 / 上）
        btn.classList.add('pos-opt');
        slot.appendChild(chairSceneNode(opt.pos));
      } else if (opt.kind === 'p3item') {
        // 题型 B：可拖到纸箱后面的物品
        btn.classList.add('item-opt');
        slot.appendChild(itemNode3(opt.item.id));
      } else if (opt.kind === 'posScene') {
        // 第 2 岛第 2 关题型 A：盒子场景（里面 / 上面 / 旁边）
        btn.classList.add('pos-opt');
        slot.appendChild(posSceneNode(opt.pos, { drop: false }));
      } else if (opt.kind === 'p2item') {
        // 题型 B：可拖到桌上的物品
        btn.classList.add('item-opt');
        slot.appendChild(itemNode(opt.item.id));
      } else if (opt.kind === 'yesNo') {
        // 题型 C：对 / 错按钮
        btn.classList.add('yn-opt');
        slot.appendChild(yesNoNode(opt.val));
      } else if (opt.kind === 'basketPile') {
        // 第 5 关题型 A：装着十格阵果堆的篮子（可拖动）
        btn.classList.add('basket-pile-opt');
        var pile = document.createElement('div');
        pile.className = 'basket-pile';
        pile.appendChild(tenFrame(opt.fruit, opt.count));
        slot.appendChild(pile);
      } else if (opt.kind === 'basketColor') {
        // 第 5 关题型 B：彩色篮子（投放目标）
        btn.classList.add('basket-color-opt');
        var bk = document.createElement('div');
        bk.className = 'basket';
        bk.style.setProperty('--c', opt.color.css);
        bk.style.setProperty('--cd', opt.color.deep);
        slot.appendChild(bk);
      } else if (opt.kind === 'comboCard') {
        // 第 5 关题型 C：组合卡片（N 个同色苹果）
        btn.classList.add('card-opt');
        var card = document.createElement('div');
        card.className = 'combo-card';
        for (var ci = 0; ci < opt.count; ci++) {
          var cimg = assetImg(opt.fruit + '_' + opt.color.id, 'card-fruit');
          if (cimg) card.appendChild(cimg);
        }
        slot.appendChild(card);
      } else if (opt.kind === 'colorBtn') {
        // 第 4 关题型 C：圆润 3D 颜色按钮
        btn.classList.add('color-btn-opt');
        var swatch = document.createElement('span');
        swatch.className = 'color-swatch';
        swatch.style.setProperty('--c', opt.color.css);
        swatch.style.setProperty('--cd', opt.color.deep);
        slot.appendChild(swatch);
      } else if (opt.kind === 'b5item') {
        // 第 3 岛第 5 关：大小 / 长短物品（题型 C 的拖拽物；A/B 用独立宫格）
        btn.classList.add('b5-opt');
        slot.appendChild(b5ItemNode(opt));
      } else if (opt.kind === 'f1animal') {
        // 第 4 岛第 1 关题型 C：可拖进农场的动物
        btn.classList.add('f1-opt');
        var f1a = f1Img(opt.animal, 'f1-opt-img');
        if (f1a) slot.appendChild(f1a);
      } else if (opt.kind === 'f2animal') {
        // 第 4 岛第 2 关题型 C：可拖进丛林 / 农场的动物
        btn.classList.add('f2-opt');
        var f2a = f2Img(opt.animal, 'f2-opt-img');
        if (f2a) slot.appendChild(f2a);
      } else if (opt.kind === 'f4scene') {
        // 第 4 岛第 4 关题型 C：可拖进「在跑 / 在睡」筐的整幅场景
        btn.classList.add('f4-opt');
        slot.appendChild(f4SceneNode(opt.subj));
      } else if (opt.kind === 'f5animal') {
        // 第 4 岛第 5 关题型 B：三个动物里点出剪影那一只
        btn.classList.add('f5-opt');
        var f5op = animalImg(opt.animal, 'f5-opt-img');
        if (f5op) slot.appendChild(f5op);
      } else if (opt.kind === 'f3act') {
        // 第 4 岛第 3 关题型 C：可拖进「在跑 / 在睡」筐的动作画面
        btn.classList.add('f3-opt');
        slot.appendChild(f3TileNode(opt.subj));
      } else {
        btn.classList.add('pile-opt');
        slot.appendChild(pileNode(opt.fruit, opt.count, 'opt'));
        var badge = document.createElement('div');
        badge.className = 'pile-num';
        badge.appendChild(numberSign(opt.count, null));
        btn.appendChild(badge);
      }

      if (!isCustomLevel() && state.roundIndex < HINT_ROUNDS && i === q.correct) {
        var hand = document.createElement('span');
        hand.className = 'hint-hand';
        hand.textContent = '👆';
        hand.setAttribute('aria-hidden', 'true');
        btn.appendChild(hand);
      }
    });
    applyDragAttrs(q);
    optionsBar.classList.remove('off');
  }

  /** 给第 5 关的选项挂上拖动/投放标记（不改 DOM 结构，只加 data 属性） */
  function applyDragAttrs(q) {
    optionEls.forEach(function (btn, i) {
      btn.removeAttribute('data-drag');
      btn.removeAttribute('data-drop');
      btn.classList.toggle('drop-target', false);
      if (q.type === 'W5A') {
        btn.dataset.drag = 'basket';
        btn.dataset.idx = String(i);
        btn.classList.add('draggable');
      } else if (q.type === 'P2B' || q.type === 'P3B' || q.type === 'P4B' || q.type === 'P5B') {
        // 第 2 岛第 2/3 关题型 B：物品可拖动，桌子 / 纸箱是投放目标
        btn.dataset.drag = 'item';
        btn.dataset.idx = String(i);
        btn.classList.add('draggable');
      } else if (q.type === 'W5B') {
        btn.dataset.drop = 'basket';
        btn.dataset.idx = String(i);
        btn.classList.add('drop-target');
      } else if (q.type === 'B1C') {
        // 第 3 岛第 1 关题型 C：大 / 小物品可拖进对应尺寸的箱子
        btn.dataset.drag = 'item';
        btn.dataset.idx = String(i);
        btn.classList.add('draggable');
      } else if (q.type === 'B2C') {
        // 第 3 岛第 2 关题型 C：一堆水果可拖进 More / Less 箱
        btn.dataset.drag = 'item';
        btn.dataset.idx = String(i);
        btn.classList.add('draggable');
      } else if (q.type === 'B3C') {
        // 第 3 岛第 3 关题型 C：长 / 短香蕉可拖进 Long / Short 箱
        btn.dataset.drag = 'item';
        btn.dataset.idx = String(i);
        btn.classList.add('draggable');
      } else if (q.type === 'B5C') {
        // 第 3 岛第 5 关题型 C：物品可拖进游乐场入口
        btn.dataset.drag = 'item';
        btn.dataset.idx = String(i);
        btn.classList.add('draggable');
      } else if (q.type === 'F1C') {
        // 第 4 岛第 1 关题型 C：动物可拖进农场
        btn.dataset.drag = 'item';
        btn.dataset.idx = String(i);
        btn.classList.add('draggable');
      } else if (q.type === 'F2C') {
        // 第 4 岛第 2 关题型 C：动物可拖进丛林 / 农场
        btn.dataset.drag = 'item';
        btn.dataset.idx = String(i);
        btn.classList.add('draggable');
      } else if (q.type === 'F3C') {
        // 第 4 岛第 3 关题型 C：动作画面可拖进「在跑 / 在睡」筐
        btn.dataset.drag = 'item';
        btn.dataset.idx = String(i);
        btn.classList.add('draggable');
      } else if (q.type === 'F4C') {
        // 第 4 岛第 4 关题型 C：整幅场景可拖进「在跑 / 在睡」筐
        btn.dataset.drag = 'item';
        btn.dataset.idx = String(i);
        btn.classList.add('draggable');
      }
    });
  }

  /** 打乱选项顺序（保持题目与正确答案不变），防止孩子记住位置 */
  function reshuffleOptions(q) {
    if (!q || !q.options) return;
    var correctOpt = q.options[q.correct];
    var before = q.options.slice();
    // 3 个选项有 1/6 概率洗回原序，孩子看到的位置没变；
    // 这里强制“必须换一个排列”，最多重试 8 次。
    for (var attempt = 0; attempt < 8; attempt++) {
      shuffle(q.options);
      var same = q.options.every(function (o, i) { return o === before[i]; });
      if (!same) break;
    }
    q.correct = q.options.indexOf(correctOpt);
  }

  function clearOptions() {
    optionEls.forEach(function (btn) {
      removeDecor(btn);
      btn.className = 'option';
      btn.hidden = false;
      var slot = btn.querySelector('.slot');
      slot.className = 'slot';
      slot.innerHTML = '';
    });
  }

  function renderRound() {
    var q = state.question;
    state.phase = 'asking';
    state.busy = false;
    state.pickedFruit = null;
    clearPicked();
    optionsBar.classList.remove('gone');   // 教学阶段隐藏过，进答题必须恢复

    viewStart.hidden = true;
    viewDone.hidden = true;
    viewAsk.hidden = false;

    renderDisplay(q);
    renderOptions(q);
    say(q.audio);
  }

  function nextRound() {
    state.roundIndex += 1;
    if (state.roundIndex >= TOTAL_ROUNDS) { finish(); return; }
    state.question = newQuestion(state.plan[state.roundIndex], state.question);
    renderRound();
  }

  /* ---------------- 星星飞入 ---------------- */

  function flyStar(fromEl, toEl, onDone) {
    var a = fromEl.getBoundingClientRect();
    var b = toEl.getBoundingClientRect();
    var star = starSvg('fly-star');
    star.style.left = (a.left + a.width / 2) + 'px';
    star.style.top = (a.top + a.height / 2) + 'px';
    flyLayer.appendChild(star);

    var dx = (b.left + b.width / 2) - (a.left + a.width / 2);
    var dy = (b.top + b.height / 2) - (a.top + a.height / 2);

    var anim = star.animate([
      { transform: 'translate(-50%,-50%) scale(.35)', opacity: .25 },
      { transform: 'translate(-50%,-50%) scale(1.6)', opacity: 1, offset: .26 },
      { transform: 'translate(calc(-50% + ' + (dx * .42) + 'px), calc(-50% + ' + (dy * .28 - 46) + 'px)) scale(1.15)', opacity: 1, offset: .62 },
      { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(.5)', opacity: .95 }
    ], { duration: 380, easing: 'cubic-bezier(.36,.72,.35,1)', fill: 'forwards' });

    var settled = false;
    function settle() {
      if (settled) return;
      settled = true;
      if (star.parentNode) star.parentNode.removeChild(star);
      if (onDone) onDone();
    }
    anim.onfinish = settle;
    setTimeout(settle, 620);
  }

  /* ---------------- 判定 ---------------- */

  function handlePick(index, btn) {
    if (state.phase !== 'asking' || state.busy) return;
    judge(index === state.question.correct, btn);
  }

  /** 统一判定入口：点击与拖拽都走这里（ok 由调用方算好） */
  function judge(ok, btn) {
    if (state.phase !== 'asking' || state.busy) return;
    var q = state.question;

    if (ok) {
      state.busy = true;
      state.phase = 'judging';
      optionsBar.classList.add('off');
      btn.classList.add('right');
      state.stars += 1;

      stop();          // 立即掐断题干语音
      coin();          // 只留音效，不播任何语音

      // 第 4 关题型 C：灰色物品当场被刷上颜色（视觉+音效反馈）
      if (q.type === 'W4C') paintItem(q.item.asset, q.color);
      // 第 2 岛第 1 关题型 C：点亮房子上对应的那一块
      if (q.type === 'S1C') lightHousePart(q.shape.id);
      // 第 2 岛第 2 关题型 B：物品落到桌面上
      if (q.type === 'P2B') placeItemOnTable(q.item);
      if (q.type === 'P3B') placeItemBehindBox(q.item);
      if (q.type === 'P4B') placeItemInSquare(q.item);
      if (q.type === 'P5B') placeItemInSquare(q.item);
      if (q.type === 'B1C') placeInB1Box(q.item.asset, q.size);
      if (q.type === 'B2C') placeInB2Box((q.fruit && q.fruit.id) || q.fruit, q.cmp);
      if (q.type === 'B3C') placeInB3Box(q.obj, q.cmp);
      if (q.type === 'F1C') f1PlaceInFarm(q.animal);
      if (q.type === 'F2C') f2PlaceInZone(q.animal, q.zone);
      if (q.type === 'F3C') f3PlaceInZone(q.subj, q.zone);
      if (q.type === 'F4C') f4PlaceInZone(q.subj, q.zone);
      // 第 4 岛第 4 关题型 B：判对时让画面里的动物欢呼一下（视觉反馈，仍不播语音）
      if (q.type === 'F4B') {
        var f4pic = document.getElementById('f4-pic');
        if (f4pic) f4pic.classList.add('f4-cheer');
      }
      // 第 4 岛第 5 关题型 B：剪影当场被上色（视觉反馈，仍然不播语音）
      if (q.type === 'F5B') {
        var f5lens = document.querySelector('.f5-lens');
        if (f5lens) f5lens.classList.add('f5-found');
      }

      // 必须先捕获索引：430ms 后 state.roundIndex 会自增，
      // 动画回调若晚于推进执行就会点亮错位/丢失（第 12 轮尤其明显）
      var starIndex = state.roundIndex;
      flyStar(btn, starEls[starIndex], function () {
        lightStar(starIndex);
        ting();
      });

      // 不等语音，立刻进入下一题
      setTimeout(nextRound, 430);
    } else {
      state.busy = true;
      btn.classList.add('wrong');
      clearPicked();          // 选项会重洗，旧选中下标立即失效
      say(['again'], function () {
        // 答错后把三个选项重新打乱，避免靠记位置蒙对
        reshuffleOptions(state.question);
        state.pickedFruit = null;
        renderOptions(state.question);
        renderTray(state.question);
        state.busy = false;
      });
    }
  }

  /* ---------------- 第 5 关：拖拽引擎 ---------------- */

  var dragLayer = document.getElementById('dragLayer');

  function clearPicked() {
    state.pickedFruit = null;
    optionEls.forEach(function (b) { b.classList.remove('picked'); });
    if (askDisplay) {
      Array.prototype.forEach.call(askDisplay.querySelectorAll('.tray-fruit'), function (n) {
        n.classList.remove('picked');
      });
    }
  }

  function pickFruit(idx, el) {
    var same = state.pickedFruit === idx;
    clearPicked();
    if (!same) {
      state.pickedFruit = idx;
      el.classList.add('picked');
    }
  }

  /** 点选水果（指针流程与纯 click 兜底共用，400ms 内只认一次） */
  function tapFruit(idx, el) {
    if (Date.now() - (state.lastPointerAt || 0) < 400) return;
    state.lastPointerAt = Date.now();
    pickFruit(idx, el);
  }

  /** 题型 A：把果篮拖给怪兽（或直接点果篮） */
  function resolveW5A(basketIdx, el) {
    judge(basketIdx === state.question.correct, el);
  }

  /** 题型 B：水果和篮子都要对 */
  function resolveW5B(fruitIdx, basketIdx, basketEl) {
    var q = state.question;
    var ok = fruitIdx === q.correctFruit && basketIdx === q.correct;
    judge(ok, basketEl);
  }

  function startDrag(e) {
    var mode = dragMode();
    if (!mode) return;

    var el = e.target.closest ? e.target.closest('[data-drag]') : null;
    if (!el) return;

    e.preventDefault();
    var idx = parseInt(el.dataset.idx, 10);
    var rect = el.getBoundingClientRect();

    var ghost = el.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.width = rect.width + 'px';
    ghost.style.height = rect.height + 'px';
    ghost.style.left = (e.clientX - rect.width / 2) + 'px';
    ghost.style.top = (e.clientY - rect.height / 2) + 'px';
    dragLayer.appendChild(ghost);

    state.drag = {
      el: el, idx: idx, ghost: ghost, moved: false, mode: mode,
      x0: e.clientX, y0: e.clientY, kind: el.dataset.drag
    };
  }

  function moveDrag(e) {
    var d = state.drag;
    if (!d) return;
    var dx = e.clientX - d.x0, dy = e.clientY - d.y0;
    if (!d.moved && Math.abs(dx) + Math.abs(dy) > 8) {
      d.moved = true;
      d.el.classList.add('dragging');
    }
    if (!d.moved) return;
    d.ghost.style.left = (e.clientX - d.ghost.offsetWidth / 2) + 'px';
    d.ghost.style.top = (e.clientY - d.ghost.offsetHeight / 2) + 'px';
    highlightDrop(e.clientX, e.clientY);
  }

  function highlightDrop(x, y) {
    var hit = dropAt(x, y);
    Array.prototype.forEach.call(document.querySelectorAll('[data-drop]'), function (n) {
      n.classList.toggle('drop-hot', n === hit);
    });
  }

  function dropAt(x, y) {
    var nodes = document.elementsFromPoint ? document.elementsFromPoint(x, y) : [];
    for (var i = 0; i < nodes.length; i++) {
      var t = nodes[i].closest ? nodes[i].closest('[data-drop]') : null;
      if (t) return t;
    }
    return null;
  }

  function endDrag(e) {
    var d = state.drag;
    if (!d) return;
    state.drag = null;
    d.el.classList.remove('dragging');
    Array.prototype.forEach.call(document.querySelectorAll('[data-drop]'), function (n) {
      n.classList.remove('drop-hot');
    });

    var q = state.question;
    var target = d.moved ? dropAt(e.clientX, e.clientY) : null;

    if (!d.moved) {
      // 轻点：A 直接作答；B 选中/取消选中水果
      d.ghost.remove();
      state.lastPointerAt = Date.now();
      if (d.mode === 'W5A') resolveW5A(d.idx, d.el);
      else if (d.mode === 'TUT') tutPickBall(d.el, e.clientX, e.clientY);
      else pickFruit(d.idx, d.el);
      return;
    }

    if (target) {
      // 吸附动画：把小幽灵挪到目标中心再消失
      var tr = target.getBoundingClientRect();
      d.ghost.style.transition = 'left .16s ease-out, top .16s ease-out, transform .16s ease-out, opacity .16s';
      d.ghost.style.left = (tr.left + tr.width / 2 - d.ghost.offsetWidth / 2) + 'px';
      d.ghost.style.top = (tr.top + tr.height / 2 - d.ghost.offsetHeight / 2) + 'px';
      d.ghost.style.transform = 'scale(.5)';
      d.ghost.style.opacity = '0';
      setTimeout(function () { d.ghost.remove(); }, 180);

      if (d.mode === 'W5A') {
        resolveW5A(d.idx, d.el);
      } else if (d.mode === 'W5B') {
        resolveW5B(d.idx, parseInt(target.dataset.idx, 10), target);
      } else if (d.mode === 'P2B') {
        resolveP2B(d.idx, target);
      } else if (d.mode === 'P3B') {
        resolveP3B(d.idx, target, e.clientY);
      } else if (d.mode === 'P4B') {
        resolveP4B(d.idx, target);
      } else if (d.mode === 'P5B') {
        resolveP5B(d.idx, target);
      } else if (d.mode === 'B1C') {
        resolveB1C(d.idx, target);
      } else if (d.mode === 'B2C') {
        resolveB2C(d.idx, target);
      } else if (d.mode === 'B3C') {
        resolveB3C(d.idx, target);
      } else if (d.mode === 'B5C') {
        resolveB5C(d.idx, target);
      } else if (d.mode === 'F1C') {
        resolveF1C(d.idx, target);
      } else if (d.mode === 'F2C') {
        resolveF2C(d.idx, target);
      } else if (d.mode === 'F3C') {
        resolveF3C(d.idx, target);
      } else if (d.mode === 'F4C') {
        resolveF4C(d.idx, target);
      } else if (d.mode === 'TUT') {
        tutDropOn(target, e.clientX, e.clientY);
      }
    } else {
      // 拖到空白处：飞回原位
      d.ghost.style.transition = 'transform .18s, opacity .18s';
      d.ghost.style.transform = 'scale(.7)';
      d.ghost.style.opacity = '0';
      setTimeout(function () { d.ghost.remove(); }, 200);
    }
  }

  document.addEventListener('pointerdown', startDrag, { passive: false });
  document.addEventListener('pointermove', moveDrag, { passive: true });
  document.addEventListener('pointerup', endDrag, { passive: true });
  document.addEventListener('pointercancel', function () {
    if (state.drag) {
      state.drag.ghost.remove();
      state.drag.el.classList.remove('dragging');
      state.drag = null;
      Array.prototype.forEach.call(document.querySelectorAll('[data-drop]'), function (n) {
        n.classList.remove('drop-hot');
      });
    }
  }, { passive: true });

  /* ================= 第 2 岛第 5 关：教学大复习（形状 + 方位） ================= */

  /* 透明小手指：四秒没有正确操作才出现，只示范轨迹，绝不代替孩子完成 */
  var P5_HAND =
    '<rect x="26" y="7" width="12" height="36" rx="6" fill="#ffd9a4" stroke="#d08f4c" stroke-width="2.8"/>' +
    '<rect x="15" y="34" width="34" height="28" rx="13" fill="#ffe3b8" stroke="#d08f4c" stroke-width="2.8"/>' +
    '<rect x="8" y="42" width="12" height="17" rx="6" fill="#ffdcaa" stroke="#d08f4c" stroke-width="2.8" ' +
      'transform="rotate(-14 14 50)"/>' +
    '<rect x="18" y="60" width="28" height="13" rx="6.5" fill="#ffeecb" stroke="#d08f4c" stroke-width="2.8"/>';

  var hintTimer = null;

  function clearHint() {
    if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
    if (state.tut) state.tut.hintArmed = false;
    var n = document.querySelector('.tut-hint');
    if (n && n.parentNode) n.parentNode.removeChild(n);
  }

  function hintNode() {
    var d = document.createElement('div');
    d.className = 'tut-hint';
    d.setAttribute('aria-hidden', 'true');
    var svg = svgEl('svg');
    svg.setAttribute('viewBox', '0 0 64 78');
    svg.innerHTML = P5_HAND;
    d.appendChild(svg);
    return d;
  }

  /** 重新开始 4 秒计时（每次可以动手时调用；答错后也调用，手指会再出现） */
  function armHint() {
    var me = state.tut;
    clearHint();
    if (!me) return;
    me.hintArmed = true;
    hintTimer = setTimeout(function () {
      hintTimer = null;
      if (state.tut !== me || !me.hintArmed) return;
      showHint(me);
    }, 4000);
  }

  function showHint(me) {
    var host = askDisplay;
    if (!host || !me || !me.hintTarget) return;
    var anchor = me.hintTarget.getBoundingClientRect();
    if (!anchor.width || !anchor.height) return;

    var hb = host.getBoundingClientRect();
    var h = hintNode();

    if (me.hintFrom && me.hintTo) {
      // 拖拽示范：手指从物品出发，滑到目标处再回来，如此循环
      var a = me.hintFrom.getBoundingClientRect();
      var b = me.hintTo.getBoundingClientRect();
      if (!a.width || !b.width) return;
      var ax = a.left + a.width / 2 + a.width * 0.2;
      var ay = a.top + a.height / 2;
      var by = b.top + b.height * (me.hintToY || 0.5);
      h.style.left = (ax - hb.left) + 'px';
      h.style.top = (ay - hb.top + a.height * 0.22) + 'px';
      h.style.setProperty('--hx', (b.left + b.width / 2 - ax) + 'px');
      h.style.setProperty('--hy', (by - ay) + 'px');
      h.classList.add('drag');
    } else {
      // 点选示范：指尖落在目标底边偏右，指着它又不盖住图形本身
      h.style.left = (anchor.left + anchor.width * 0.72 - hb.left) + 'px';
      h.style.top = (anchor.top + anchor.height * 0.96 - hb.top) + 'px';
    }
    host.appendChild(h);
  }

  var runP5Tutorial = (function () {
    var SHAPES = [
      { id: 'circle',    color: '#ea5a4f', word: 'p5_circle' },
      { id: 'square',    color: '#f3b93e', word: 'p5_square' },
      { id: 'triangle',  color: '#7fb3e6', word: 'p5_triangle' },
      { id: 'rectangle', color: '#8ecf9a', word: 'p5_rectangle' }
    ];
    var ASKS = [
      { id: 'triangle',  key: 'p5_touch_triangle' },
      { id: 'rectangle', key: 'p5_touch_rectangle' }
    ];

    function blank(me) {
      me.canDrag = false;
      me.picked = false;
      me.hintTarget = null;
      me.hintFrom = null;
      me.hintTo = null;
      me.hintToY = 0.5;
      me.replay = null;
      clearHint();
    }

    function freshStage() {
      askDisplay.innerHTML = '';
      var wrap = document.createElement('div');
      wrap.className = 'p5-tut-stage';
      askDisplay.appendChild(wrap);
      return wrap;
    }

    /** 串行播放：每步可先做动画（act）、再说一句（say）、说完再等 wait 毫秒 */
    function runSeq(me, steps, onDone) {
      var i = 0;
      function next() {
        if (state.tut !== me) return;
        if (i >= steps.length) { if (onDone) onDone(); return; }
        var st = steps[i++];
        if (st.act) st.act();
        var wait = st.wait || 0;
        if (st.say) {
          say([st.say], function () {
            if (state.tut !== me) return;
            setTimeout(function () { if (state.tut === me) next(); }, wait);
          });
        } else {
          setTimeout(function () { if (state.tut === me) next(); }, wait || 90);

      next();
