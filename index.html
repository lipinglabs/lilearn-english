    /* ---- 第 1 步：四个形状依次亮相 ---- */

    function shapesIntro(me) {
      if (state.tut !== me) return;
      me.stage = 'shapes';
      blank(me);

      var wrap = freshStage();
      var row = document.createElement('div');
      row.className = 'p5-shape-row';
      wrap.appendChild(row);

      var cards = SHAPES.map(function (s) {
        var b = document.createElement('div');
        b.className = 'p5-shape-card off';
        b.dataset.shape = s.id;
        b.appendChild(shapeSvg(s.id, s.color, 'p5-shape-svg'));
        row.appendChild(b);
        return b;
      });

      var keys = ['p5_tut_intro'].concat(SHAPES.map(function (s) { return s.word; }));
      var i = 0;
      (function step() {
        if (state.tut !== me) return;
        if (i >= keys.length) { shapeAsk(me, 0); return; }
        if (i > 0) cards[i - 1].classList.remove('off');
        var key = keys[i];
        i += 1;
        say([key], step);
      })();
    }

    /* ---- 第 2 步：摸一摸（点选；4 秒不动出现手指） ---- */

    function shapeAsk(me, k) {
      if (state.tut !== me) return;
      if (k >= ASKS.length) { boxDemo(me); return; }
      me.stage = 'shape-ask';
      blank(me);

      var row = askDisplay.querySelector('.p5-shape-row');
      if (!row) { shapesIntro(me); return; }
      var cards = row.querySelectorAll('.p5-shape-card');
      var target = row.querySelector('[data-shape="' + ASKS[k].id + '"]');

      Array.prototype.forEach.call(cards, function (c) {
        c.classList.add('tappable');
        c.classList.remove('right', 'shake');
        c.onclick = function () {
          if (state.tut !== me || me.stage !== 'shape-ask') return;
          if (c.dataset.shape === ASKS[k].id) {
            clearHint();
            c.classList.add('right');
            coin();
            ting();
            setTimeout(function () { if (state.tut === me) shapeAsk(me, k + 1); }, 760);
          } else {
            c.classList.add('shake');
            setTimeout(function () { c.classList.remove('shake'); }, 520);
            say(['again']);
            armHint();
          }
        };
      });

      me.replay = function () { say([ASKS[k].key]); };
      me.hintTarget = target;
      say([ASKS[k].key]);
      armHint();

        { say: 's_in' },
        { act: function () { to('above'); }, wait: 820 },
        { say: 't_on' },
        { act: function () { to('on'); }, wait: 900 },
        { say: 's_on' },

      me.hintTarget = ball;
      me.hintFrom = ball;
      me.hintTo = scene;
      me.hintToY = 0.68;
      me.replay = function () { say(['t_in_ask']); };
      scene.classList.add('ready');

    /* ---- 投放判定 / 成功吸附（由 tutDropOn 调用，RULES §三.8） ---- */

    function check(target, ratio) {
      var me = state.tut;
      if (!me || !target || target.dataset.drop !== 'target') return false;
      if (me.stage === 'box') return true;                     // 球落进盒子即可
      if (me.stage === 'table') {
        if (me.expect === 'under') return ratio > 0.58;         // 桌面下半区 = under
        if (me.expect === 'behind') return ratio >= 0.18 && ratio <= 0.56;
        return true;
      }
      if (me.stage === 'combo') return target.dataset.shape === 'square';
      return false;
    }

    function success(target, me) {
      if (!me) me = state.tut;
      if (!me) return;
      clearHint();
      me.canDrag = false;
      me.picked = false;
      var actor = target.querySelector('.p3-actor, .pos-ball');
      if (actor) actor.classList.remove('picked');
      target.classList.remove('ready');

      if (me.stage === 'box') {
        // 球当场落进盒子，保留视觉结果
        target.dataset.pos = 'in';
        coin();
        ting();
        setTimeout(function () { if (state.tut === me) tableDemo(me); }, 900);
        return;
      }

      if (me.stage === 'table') {
        target.dataset.pos = me.expect;      // 吸附到 under / behind
        coin();
        ting();
        var wasUnder = (me.expect === 'under');
        setTimeout(function () {
          if (state.tut !== me) return;
          if (wasUnder) askBehind(me); else comboDemo(me);
        }, 950);
        return;

      if (me.stage === 'combo') {
        var apple = me.hintFrom || askDisplay.querySelector('.p5-apple');
        if (apple) {
          apple.classList.remove('picked', 'ready');
          target.appendChild(apple);
          apple.classList.add('in-shape');
        }
        coin();
        ting();
        setTimeout(function () { if (state.tut === me) tutFinish(me); }, 1000);
      }
    }

    var api = function (me) { shapesIntro(me); };
    api.check = check;
    api.success = success;
    return api;
  })();

      custom: runB3Tutorial,
      steps: [],
      onDrop: function () { return runB3Tutorial.check(); },
      onSuccess: function () { /* 教学无投放环节 */ }
    },
    '3-4': {
      // 找不同：演示（3 苹果 + 1 香蕉，香蕉发光）→ 互动（3 狗 + 1 猫，4 秒小手指）→ t_ready 收尾
      custom: runB4Tutorial,
      steps: [],
      onDrop: function () { return false; },
      onSuccess: function () { /* 教学无投放环节 */ }
    },
    '3-5': {
      // 结业复习：大小 / 多少 / 长短 / 找不同，各两个案例 + 一问（4 秒小手指）→ t_ready 收尾
      custom: runB5Tutorial,
      steps: [],
      onDrop: function () { return false; },
      onSuccess: function () { /* 教学无投放环节 */ }
    },
    '4-1': {
      // 农场动物：狗 → 猫 → 动手找狗 → 猪 → 牛 → 动手找牛（4 秒小手指）→ 过渡语进答题
      custom: runF1Tutorial,
      steps: [],
      onDrop: function () { return false; },
      onSuccess: function () { /* 教学无投放环节 */ }
    },
    '4-2': {
      // 野生动物（RULES §三.10 双倍量）：每个词 2 次演示 + 2 次互动，共 16 环节 + 过渡语
      custom: runF2Tutorial,
      steps: [],
      onDrop: function () { return false; },
      onSuccess: function () { /* 教学无投放环节 */ }
    },
    '4-3': {
      // 动词（RULES §三.10 双倍量）：4 个动词 × 4 环节 + 1 综合互动 + 过渡语 = 18 环节
      custom: runF3Tutorial,
      steps: [],
      onDrop: function () { return false; },
      onSuccess: function () { /* 教学无投放环节 */ }
    },
    '4-4': {
      // 动物 + 动作短句（RULES §三.10 双倍量）：3 个句型 × 4 环节 + 综合 + 对错示范 2 步 + 过渡语 = 16 环节
      custom: runF4Tutorial,
      steps: [],
      onDrop: function () { return false; },
      onSuccess: function () { /* 教学无投放环节 */ }
    },
    '4-5': {
      // 结业关：相机示范 1 步 + 3 个动作 × 4 环节（2 演示 + 2 互动）+ 过渡语 = 14 环节
      custom: runF5Tutorial,
      steps: [],
      onDrop: function () { return false; },
      onSuccess: function () { /* 教学无投放环节 */ }
    }
  };

  function startTutorial() {
    var spec = TUTORIALS[currentIsland + '-' + state.level];
    if (!spec) { beginRounds(); return; }

    state.phase = 'tutorial';
    state.tut = {
      spec: spec, stepIndex: 0, step: 1, canDrag: false, picked: false,
      asked: {}, lastShow: null, current: null, locked: false
    };
    viewStart.hidden = true;
    viewDone.hidden = true;
    viewAsk.hidden = false;
    optionsBar.classList.add('gone');   // 教学阶段不显示选项栏
    clearOptions();
    if (spec.custom) { spec.custom(state.tut); return; }
    tutRunStep(state.tut);
  }

  function tutStageScene(me, pos) {
    askDisplay.innerHTML = '';
    var scene = me.spec.scene(pos);
    scene.classList.add('tut-scene');
    askDisplay.appendChild(scene);
    return scene;
  }

  /** 演示一个位置：播单词 → 动画 → 整句 → 提问 → 开放拖拽 */
  function tutRunStep(me) {
    if (state.tut !== me) return;
    var st = me.spec.steps[me.stepIndex];
    me.step = me.stepIndex + 1;
    me.canDrag = false;
    me.picked = false;

    me.lastDemo = st.pos;
    var scene = tutStageScene(me, st.from || st.pos);
    say([st.word], function () {
      if (state.tut !== me) return;
      scene.dataset.pos = st.pos;       // CSS 过渡：演示动画
      setTimeout(function () {
        if (state.tut !== me) return;
        say([st.sentence], function () {
          if (state.tut !== me) return;
          // 演示完先回到原位，孩子才有「自己放一次」的动作可做
          scene.dataset.pos = st.from || st.pos;
          setTimeout(function () {
            if (state.tut !== me) return;
            say([st.ask], function () {
              if (state.tut !== me) return;
              me.canDrag = true;
              scene.classList.add('ready');
            });
          }, 820);
        });
      }, 880);
    });
  }

  function tutAdvance(me) {
    me.stepIndex += 1;
    if (me.stepIndex < me.spec.steps.length) tutRunStep(me);
    else tutStepShow(me);
  }

  /** 第三步：左右对比，随机指令两次 */
  function tutStepShow(me) {
    if (state.tut !== me) return;
    me.step = me.spec.steps.length + 1;
    me.canDrag = false;
    me.picked = false;
    me.asked = {};
    me.locked = false;

    askDisplay.innerHTML = '';
    var pair = document.createElement('div');
    pair.className = 'tut-pair';
    me.spec.steps.forEach(function (st) {
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'tut-choice';
      card.dataset.choice = st.pos;
      card.appendChild(me.spec.scene(st.pos));
      card.addEventListener('click', function () { tutPickChoice(st.pos, card); });
      pair.appendChild(card);
    });
    askDisplay.appendChild(pair);
    tutAskShow(me);
  }

  function tutAskShow(me) {
    if (state.tut !== me) return;
    var pool = me.spec.steps.map(function (s) { return s.pos; })
      .filter(function (p) { return !me.asked[p]; });
    if (!pool.length) { tutFinish(me); return; }
    var pos = pick(pool, me.lastShow);
    me.current = pos;
    me.lastShow = pos;
    me.locked = false;
    say([me.spec.show[pos]]);
  }

  function tutPickChoice(pos, card) {
    var me = state.tut;
    if (!me || me.stepIndex < me.spec.steps.length || me.locked) return;

    if (pos !== me.current) {
      card.classList.add('shake');
      setTimeout(function () { card.classList.remove('shake'); }, 520);
      say(['again']);                   // 答错：温柔女声鼓励
      return;
    }

    me.locked = true;
    me.asked[pos] = true;
    card.classList.add('right');
    coin();
    ting();
    setTimeout(function () { tutAskShow(me); }, 900);
  }

  /**
   * 轻点角色：第一次是选中，已选中后再点就当作投放（拖拽的等价路径，见 RULES §二.10）。
   * 点在角色身上也认，是因为“桌子后面”这块区域本来就被角色挡着一部分。
   */
  function tutPickBall(el, clientX, clientY) {
    var me = state.tut;
    if (!me || !me.canDrag) return;

    if (me.picked) {
      var scene = el && el.closest ? el.closest('[data-drop="target"]') : null;
      if (scene) { tutDropOn(scene, clientX, clientY); return; }
    }
    me.picked = true;
    if (el) el.classList.add('picked');
  }

  /** 落点在场景里的纵向比例（0=顶部，1=底部） */
  function dropRatioY(scene, clientY) {
    var r = scene.getBoundingClientRect();
    if (!r.height || typeof clientY !== 'number') return 0.5;
    return Math.max(0, Math.min(1, (clientY - r.top) / r.height));
  }

  /** 把角色放到目标位置（教学） */
  function tutDropOn(target, clientX, clientY) {
    var me = state.tut;
    if (!me || !me.canDrag) return;
    if (!target || target.dataset.drop !== 'target') return;

    var st = me.spec.steps[me.stepIndex] || {};
    var ratio = dropRatioY(target, clientY);
    var ok = me.spec.onDrop
      ? !!me.spec.onDrop(target, ratio)
      : (me.spec.hit ? me.spec.hit(target, ratio, st.pos) : true);

    if (!ok) {
      // 放错区域：抖一下 + 温柔鼓励，不推进
      target.classList.add('shake');
      setTimeout(function () { target.classList.remove('shake'); }, 520);
      say(['again']);
      return;
    }

    me.canDrag = false;
    me.picked = false;
    var actor = target.querySelector('.p3-actor, .pos-ball');
    if (actor) actor.classList.remove('picked');
    if (me.spec.onSuccess) { me.spec.onSuccess(target, me); return; }
    target.dataset.pos = st.pos;
    target.classList.add('snap');
    coin();
    ting();
    setTimeout(function () {
      if (state.tut !== me) return;
      tutAdvance(me);
    }, 960);
  }

  /** 教学收尾：统一走这里 → beginRounds()（RULES §三.8）
   *  readyKey 可指定过渡语；传 false 表示过渡语已由关卡自己播完，直接进答题 */
  function tutFinish(me, readyKey) {
    if (state.tut !== me) return;
    me.canDrag = false;
    clearHint();
    function go() {
      if (state.tut !== me) return;
      state.tut = null;
      clearHint();
      askDisplay.innerHTML = '';
      optionsBar.classList.remove('gone');
      beginRounds();
    }
    if (readyKey === false) { go(); return; }
    say([readyKey || 't_ready'], go);
  }

  /** 12 轮答题的统一起点（普通关与教学关共用） */
  function beginRounds() {
    clearHint();
    usedPairs = {};
    state.plan = makePlan();
    state.roundIndex = 0;
    state.stars = 0;
    state.vFlip = Math.random() < 0.5;
    clearStars();
    state.question = newQuestion(state.plan[0], null);
    renderRound();
  }

  /** 当前是否处于可拖拽状态（普通拖拽题 / 教学拖拽） */
  function dragMode() {
    if (state.phase === 'tutorial') {
      return (state.tut && state.tut.canDrag) ? 'TUT' : null;
    }
    if (state.phase !== 'asking' || state.busy) return null;
    var q = state.question;
    if (!q) return null;
    if (q.type === 'W5A' || q.type === 'W5B' || q.type === 'P2B' ||
        q.type === 'P3B' || q.type === 'P4B' || q.type === 'P5B' || q.type === 'B1C' ||
        q.type === 'B2C' || q.type === 'B3C' || q.type === 'B5C' ||
        q.type === 'F1C' || q.type === 'F2C' || q.type === 'F3C' ||
        q.type === 'F4C') return q.type;
    return null;
  }

  /** 第 2 岛第 2 关题型 B：物品与桌子都要对（卡片被拖/点到桌面上即算命中） */
  function resolveP2B(itemIdx, target) {
    var q = state.question;
    if (!q || q.type !== 'P2B') return;
    // 桌子用的是 data-drop="table"，教学/纸箱用 "target"，两种都认
    var drop = target && target.dataset ? target.dataset.drop : null;
    var onTable = (drop === 'table' || drop === 'target');
    var ok = onTable && itemIdx === q.correct;
    judge(ok, ok ? target : optionEls[itemIdx]);
  }

  /** 第 2 岛第 4 关题型 B：物品要对，而且要落在正方形里 */
  function resolveP4B(itemIdx, target) {
    var q = state.question;
    if (!q || q.type !== 'P4B') return;
    var inSquare = !!(target && target.dataset && target.dataset.drop === 'target');
    var ok = inSquare && itemIdx === q.correct;
    judge(ok, ok ? target : optionEls[itemIdx]);
  }

  /** 第 2 岛第 5 关题型 B：物品要对，落在放宽后的正方形判定区内即可 */
  function resolveP5B(itemIdx, target) {
    var q = state.question;
    if (!q || q.type !== 'P5B') return;
    var inSquare = !!(target && target.dataset && target.dataset.drop === 'target');
    var ok = inSquare && itemIdx === q.correct;
    judge(ok, ok ? target : optionEls[itemIdx]);
  }

  /** 第 3 岛第 1 关题型 C：物品大小要对，而且要放进同尺寸的箱子 */
  function resolveB1C(itemIdx, target) {
    var q = state.question;
    if (!q || q.type !== 'B1C') return;
    var opt = q.options ? q.options[itemIdx] : null;
    var isBox = !!(target && target.dataset && target.dataset.drop === 'sizebox');
    var ok = isBox && !!opt && opt.size === q.size && target.dataset.size === q.size;
    judge(ok, ok ? target : optionEls[itemIdx]);
  }

  /** 第 3 岛第 2 关题型 C：水果堆要对、箱子也要对（多堆进多箱、少堆进少箱） */
  function resolveB2C(itemIdx, target) {
    var q = state.question;
    if (!q || q.type !== 'B2C') return;
    var opt = q.options ? q.options[itemIdx] : null;
    var isBox = !!(target && target.dataset && target.dataset.drop === 'b2box');
    var ok = isBox && !!opt && opt.cmp === q.cmp && target.dataset.box === q.cmp;
    judge(ok, ok ? target : optionEls[itemIdx]);
  }

  /** 第 3 岛第 3 关题型 C：香蕉长短要对、箱子也要对（长香蕉进长箱、短香蕉进短箱） */
  function resolveB3C(itemIdx, target) {
    var q = state.question;
    if (!q || q.type !== 'B3C') return;
    var opt = q.options ? q.options[itemIdx] : null;
    var isBox = !!(target && target.dataset && target.dataset.drop === 'b3box');
    var ok = isBox && !!opt && opt.cmp === q.cmp && target.dataset.box === q.cmp;
    judge(ok, ok ? target : optionEls[itemIdx]);
  }

  /** 第 2 岛第 3 关题型 B：物品要对，而且要放到纸箱「后面」（上半区） */
  function resolveP3B(itemIdx, target, clientY) {
    var q = state.question;
    if (!q || q.type !== 'P3B') return;
    var onBox = !!(target && target.dataset && target.dataset.drop === 'target');
    var ratio = onBox ? dropRatioY(target, clientY) : 1;
    var ok = onBox && itemIdx === q.correct && ratio <= 0.56;
    judge(ok, ok ? target : optionEls[itemIdx]);
  }

  /* ---------------- 关卡流程 ---------------- */



  function enterLevel(level) {
    state.level = level || 1;
    showScreen('level');
    buildStars();
    state.phase = 'idle';
    state.busy = false;
    state.roundIndex = 0;
    state.stars = 0;
    state.question = null;
    state.plan = [];
    state.pickedFruit = null;
    state.drag = null;
    state.tut = null;                       // 离开/重进关卡时清掉教学状态
    clearHint();
    if (askDisplay) askDisplay.innerHTML = '';
    optionsBar.classList.remove('gone');
    viewDone.classList.remove('grand');
    clearIslandFlag();
    clearStars();
    clearOptions();
    viewStart.hidden = false;
    viewAsk.hidden = true;
    viewDone.hidden = true;
    btnStart.hidden = false;
    confettiBox.hidden = true;
    confettiBox.innerHTML = '';
  }

  function startGame() {
    if (state.phase !== 'idle') return;
    state.phase = 'intro';
    btnStart.hidden = true;

    // 带教学环节的关卡（第 2 岛第 2 关起）：先进教学模式，不放开场白
    var def = levelDef(currentIsland, state.level);
    if (def && def.tutorial) { startTutorial(); return; }

    say(['intro'], function () { beginRounds(); });
  }

  function confetti(grand) {
    confettiBox.innerHTML = '';
    var colors = grand
      ? ['#ffb3ba', '#ffd9a0', '#ffe97a', '#b9f2c4', '#b9ddf2', '#dcc6f7', '#ffc2e2', '#fff3b0']
      : ['#ffcfa3', '#ffd9a0', '#c8e6b4', '#b9ddf2', '#e3cdf5', '#ffbfa8'];
    var count = grand ? 200 : 90;
    for (var i = 0; i < count; i++) {
      var piece = document.createElement('i');
      piece.style.left = (Math.random() * 100) + '%';
      piece.style.background = colors[i % colors.length];
      piece.style.width = (grand ? 6 : 5 + Math.random() * 7) + (grand ? Math.random() * 8 : 0) + 'px';
      piece.style.height = (grand ? 12 : 9 + Math.random() * 12) + (grand ? Math.random() * 12 : 0) + 'px';
      piece.style.animationDuration = (grand ? 3.2 + Math.random() * 3.4 : 2.6 + Math.random() * 3) + 's';
      piece.style.animationDelay = (Math.random() * (grand ? 3.4 : 2.6)) + 's';
      if (grand && i % 3 === 0) piece.style.borderRadius = '50%';
      confettiBox.appendChild(piece);
    }
    confettiBox.hidden = false;
    if (grand) {
      // 岛屿通关：额外撒一层从中间向两边飞的金色亮片
      for (var k = 0; k < 26; k++) {
        var s2 = document.createElement('i');
        s2.className = 'grand-spark';
        s2.style.left = '50%';
        s2.style.background = k % 2 ? '#FFD700' : '#FFF3B0';
        s2.style.animationDelay = (k * 0.045) + 's';
        s2.style.setProperty('--dx', ((k % 2 ? 1 : -1) * (22 + Math.random() * 58)) + 'vw');
        confettiBox.appendChild(s2);
      }
    }
  }

  function finish() {
    state.phase = 'done';
    state.busy = false;
    viewAsk.hidden = true;
    optionsBar.classList.add('off');
    clearOptions();

    // 岛内最后一关 = 结业考：华丽彩带 + 奖杯区加"通关旗"
    var grand = state.level === LEVELS_PER_ISLAND;
    viewDone.hidden = false;
    viewDone.classList.toggle('grand', grand);
    confetti(grand);

    markCleared(currentIsland, state.level);

    // 记录本关最高星数（12 颗满分），随进度一起同步到云端
    var starKey = currentIsland + '-' + state.level;
    if (!progress.stars) progress.stars = {};
    progress.stars[starKey] = Math.max(progress.stars[starKey] || 0, state.stars);
    saveProgress();
    cloudSchedulePush();

    if (grand) showIslandFlag(currentIsland);

    // 中文女童音随机鼓励 → 英文通用通关夸奖（绝不复用学科绑定语句）
    playRandomPraise(playLevelComplete);
  }

  /** 通关整座岛：在舞台右上角升起一面小旗（避开金色奖杯，否则同色看不清） */
  function showIslandFlag(island) {
    var stage = document.querySelector('.stage');
    if (!stage) return;
    var box = stage.querySelector('.island-flag');
    if (box) box.parentNode.removeChild(box);
    box = document.createElement('div');
    box.className = 'island-flag';
    box.dataset.island = String(island);
    box.appendChild(svgIcon('flag'));
    stage.appendChild(box);
    void box.offsetWidth;
    box.classList.add('rise');
  }

  function clearIslandFlag() {
    var stage = document.querySelector('.stage');
    var box = stage && stage.querySelector('.island-flag');
    if (box) box.parentNode.removeChild(box);
  }

  function restartLevel() {
    stop();
    speakToken += 1;
    confettiBox.hidden = true;
    confettiBox.innerHTML = '';
    usedPairs = {};
    state.plan = makePlan();
    state.roundIndex = 0;
    state.stars = 0;
    state.busy = false;
    clearStars();
    state.question = newQuestion(state.plan[0], null);
    renderRound();
  }

  /* ---------------- 事件 ---------------- */

  btnStart.addEventListener('click', startGame);
  btnRestart.addEventListener('click', restartLevel);

  optionEls.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var idx = parseInt(btn.dataset.idx, 10);
      var q = state.question;
      if (!q) return;

      // 第 5 关题型 A 由拖拽/点按逻辑统一处理（避免一次点击判定两次）
      if (q.type === 'W5A') return;

      // 第 2 岛第 4 关题型 B：点物品选中，再点正方形投放
      if (q.type === 'P4B') {
        tapFruit(idx, btn);   // 400ms 去重：指针流程与 click 只认一次，选中不会被自己取消
        return;
      }

      // 第 2 岛第 5 关题型 B：点物品选中，再点正方形投放
      if (q.type === 'P5B') {
        tapFruit(idx, btn);   // 400ms 去重：指针流程与 click 只认一次，选中不会被自己取消
        return;
      }

      // 第 2 岛第 3 关题型 B：点物品选中，再点纸箱投放
      if (q.type === 'P3B') {
        tapFruit(idx, btn);   // 400ms 去重：指针流程与 click 只认一次，选中不会被自己取消
        return;
      }

      // 第 2 岛第 2 关题型 B：点物品选中，再点桌子投放
      if (q.type === 'P2B') {
        tapFruit(idx, btn);   // 400ms 去重：指针流程与 click 只认一次，选中不会被自己取消
        return;
      }

      // 第 3 岛第 1 关题型 C：点物品选中，再点箱子投放
      if (q.type === 'B1C') {
        tapFruit(idx, btn);   // 400ms 去重：指针流程与 click 只认一次，选中不会被自己取消
        return;
      }

      // 第 3 岛第 2 关题型 C：点水果堆选中，再点 More / Less 箱投放
      if (q.type === 'B2C') {
        tapFruit(idx, btn);   // 400ms 去重：指针流程与 click 只认一次，选中不会被自己取消
        return;
      }

      // 第 3 岛第 3 关题型 C：点香蕉选中，再点 Long / Short 箱投放
      if (q.type === 'B3C') {
        tapFruit(idx, btn);   // 400ms 去重：指针流程与 click 只认一次，选中不会被自己取消
        return;
      }

      // 第 3 岛第 5 关题型 C：点物品选中，再点游乐场入口投放
      if (q.type === 'B5C') {
        tapFruit(idx, btn);
        return;
      }

      // 第 4 岛第 1 关题型 C：点动物选中，再点农场投放（三岁孩子拖不稳，必须有等价路径）
      if (q.type === 'F1C') {
        tapFruit(idx, btn);
        return;
      }

      // 第 4 岛第 2 关题型 C：点动物选中，再点丛林 / 农场投放
      if (q.type === 'F2C') {
        tapFruit(idx, btn);
        return;
      }

      // 第 4 岛第 3 关题型 C：点动作图选中，再点「在跑 / 在睡」筐投放
      if (q.type === 'F3C') {
        tapFruit(idx, btn);
        return;
      }

      // 第 4 岛第 4 关题型 C：点场景选中，再点「在跑 / 在睡」筐投放
      if (q.type === 'F4C') {
        tapFruit(idx, btn);
        return;
      }

      // 第 5 关题型 B：先点水果选中，再点篮子投放
      if (q.type === 'W5B') {
        if (state.pickedFruit === null) return;
        resolveW5B(state.pickedFruit, idx, btn);
        return;
      }

      handlePick(idx, btn);
    });
  });

  btnReplay.addEventListener('click', function () {
    btnReplay.classList.remove('ringing');
    void btnReplay.offsetWidth;
    btnReplay.classList.add('ringing');

    if (state.phase === 'asking' && state.question) say(state.question.audio);
    else if (state.phase === 'done') playRandomPraise();
    else if (state.phase === 'intro') say(['intro']);
    else if (state.phase === 'tutorial' && state.tut) {
      // 教学阶段：重播当前这一步的单词 + 整句 + 提问
      var me = state.tut;
      if (me.replay) { me.replay(); return; }
      if (me.stepIndex >= me.spec.steps.length) {
        if (me.current) say([me.spec.show[me.current]]);
      } else {
        var st = me.spec.steps[me.stepIndex];
        if (st) say([st.word, st.sentence, st.ask]);
      }
    }
  });

  btnBack.addEventListener('click', function () {
    stop();
    if (view === 'level') enterIsland(currentIsland);
    else if (view === 'island') { showScreen('map'); renderMap(); }
  });

  /* ---------------- 云存档界面 ---------------- */

  var btnCloud = document.getElementById('btnCloud');
  var cloudSheet = document.getElementById('cloudSheet');
  var cloudTokenInput = document.getElementById('cloudToken');
  var cloudStatusEl = document.getElementById('cloudStatus');
  var btnCloudConnect = document.getElementById('cloudConnect');
  var btnCloudClose = document.getElementById('cloudClose');
  var btnCloudGetToken = document.getElementById('cloudGetToken');

  /*
   * 生成令牌的入口：GitHub 的「新建经典令牌」页支持用 URL 预填范围与备注，
   * scopes=gist 表示**只给云存档（Gist）读写**，绝不给仓库权限。
   * 家长点「创建」后复制 ghp_ 开头那串，粘回本页面即可。
   */
  var CLOUD_TOKEN_URL =
    'https://github.com/settings/tokens/new?scopes=gist&description=lilearn-english-save';

  if (btnCloudGetToken) {
    btnCloudGetToken.addEventListener('click', function () {
      window.open(CLOUD_TOKEN_URL, '_blank', 'noopener');
    });
  }

  /*
   * 可选：把访问令牌直接写在这里，任何设备打开就自动连上云存档，无需设置。
   * 注意——本页是公开站点，写在这里等于公开这把钥匙。
   * 若确实要写，务必只给它「Gists: Read and write」这一项权限，绝不要 repo 权限。
   */
  var CLOUD_TOKEN_DEFAULT = '';

  function updateCloudBadge() {
    if (!btnCloud) return;
    btnCloud.classList.remove('syncing', 'synced', 'error', 'off');
    btnCloud.classList.add(cloud.state === 'off' ? 'off' : cloud.state);
    var icon = cloud.state === 'synced' ? 'cloudCheck'
      : (cloud.state === 'off' ? 'cloudOff' : 'cloud');
    btnCloud.innerHTML = '';
    btnCloud.appendChild(svgIcon(icon));
    if (cloud.token) {
      var dot = document.createElement('span');
      dot.className = 'cloud-dot';
      btnCloud.appendChild(dot);
    }
    btnCloud.setAttribute('aria-label', '云存档');
  }

  function updateCloudStatus() {
    if (!cloudStatusEl) return;
    var text = '';
    var bad = false;
    if (dev.active) {
      text = '测试模式中，云端同步已暂停';
    } else if (cloud.state === 'syncing') {
      text = '正在同步…';
    } else if (cloud.state === 'synced') {
      var t = cloud.lastSync
        ? new Date(cloud.lastSync).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
        : '';
      text = '进度已自动同步' + (t ? '（' + t + '）' : '');
    } else if (cloud.state === 'error') {
      text = cloud.msg || '同步失败';
      bad = true;
    } else if (cloud.state === 'idle') {
      text = '已配置，正在连接…';
    } else {
      text = cloud.msg || '未开启云存档';
    }
    cloudStatusEl.textContent = text;
    cloudStatusEl.classList.toggle('bad', bad);
  }

  function openCloudSheet() {
    if (!cloudSheet) return;
    cloudSheet.hidden = false;
    if (cloudTokenInput) {
      cloudTokenInput.value = '';
      cloudTokenInput.placeholder = cloud.token ? '已连接（如需更换请粘贴新令牌）' : '粘贴访问令牌';
    }
    updateCloudStatus();
  }

  function closeCloudSheet() {
    if (cloudSheet) cloudSheet.hidden = true;
  }

  if (btnCloud) btnCloud.addEventListener('click', openCloudSheet);
  if (btnCloudClose) btnCloudClose.addEventListener('click', closeCloudSheet);
  if (cloudSheet) {
    cloudSheet.addEventListener('click', function (e) {
      if (e.target === cloudSheet) closeCloudSheet();
    });
  }
  if (btnCloudConnect) {
    btnCloudConnect.addEventListener('click', function () {
      var v = cloudTokenInput ? cloudTokenInput.value : '';
      if (!v.trim() && cloud.token) {
        if (dev.active) { toast('测试模式中，云端同步已暂停'); return; }
        cloudPull();
        return;
      }
      cloudConnect(v).then(function (ok) {
        if (ok && cloudTokenInput) cloudTokenInput.value = '';
      });
    });
  }
  if (cloudTokenInput) {
    cloudTokenInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && btnCloudConnect) btnCloudConnect.click();
    });
  }

  /* ---------------- 初始化 ---------------- */

  btnBack.appendChild(svgIcon('back'));
  btnReplay.appendChild(svgIcon('speaker'));
  btnRestart.appendChild(svgIcon('reload'));
  var trophyBox = document.querySelector('.trophy');
  if (trophyBox) trophyBox.appendChild(fruitImg({ id: 'trophy', emoji: '🏆' }));

  loadProgress();
  buildStars();
  showScreen('map');
  renderMap();

  // 云存档：有令牌就先连（云端优先），连不上就继续用本地缓存
  cloudLoad();
  if (!cloud.token && CLOUD_TOKEN_DEFAULT) cloud.token = CLOUD_TOKEN_DEFAULT;
  updateCloudBadge();
  updateCloudStatus();
  if (cloud.token) {
    if (cloud.gistId) { cloudPull(); cloudStartSilent(); }
    else cloudConnect(cloud.token);
  }

  // Service Worker 注册已提前到 <head>（见文件顶部那段 <script>）：
  // 原先要等 window.load，而 voice.js 有 8.3MB，真机 load 常要等几十秒；
  // 这期间站点不算「可安装应用」，此刻点「添加到桌面」只会得到带地址栏的书签。
  // 这里只做兜底：万一 <head> 那次注册失败（网络抖动），再补一次。
  if ('serviceWorker' in navigator && !window.__lilearnSW) {
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () { });
  }

  /*
   * 预热语音：只建首屏与结算会马上用到的少量元素。
   * 早先这里写的是 Object.keys(bank).forEach(getAudio)，会一次性 new 出全部 305 个
   * <audio>；iOS Safari 对同时存在的 HTMLMediaElement 数量有硬限制，超限后所有
   * play() 会静默失败（表现就是「一点声音都没有」，且控制台无报错）。
   * 现在其余语音在 speak() 时按需创建——getAudio 内部有 cache，同一 key 不会重复建。
   */
  var WARM_KEYS = ['intro', 'win1', 'win2', 'win3',
    'praise_1', 'praise_2', 'praise_3', 'praise_4', 'praise_5', 'praise_6'];
  WARM_KEYS.forEach(function (k) { getAudio(k); });

  if (!Object.keys(voiceBank()).length) {
    /* 排查用：voice.js 未加载成功时给出明确线索，而不是静悄悄地没声音 */
    console.warn('[voice] window.VOICE_BANK 为空：请确认 voice.js 已在本脚本之前加载成功');
  }

  window.Game = {
    speak: speak,
    say: say,
    stop: stop,
    playRandomPraise: playRandomPraise,
    playLevelComplete: playLevelComplete,
    get phase() { return state.phase; },
    get round() { return state.roundIndex; },
    get stars() { return state.stars; },
    get view() { return view; },
    get island() { return currentIsland; },
    get level() { return state.level; },
    get tutorial() {
      return state.tut ? {
        step: state.tut.step, stepIndex: state.tut.stepIndex,
        totalSteps: state.tut.spec.steps.length, lastDemo: state.tut.lastDemo || null,
        stage: state.tut.stage || null,
        ask: state.tut.ask || null,
        canDrag: state.tut.canDrag, picked: state.tut.picked,
        current: state.tut.current, asked: JSON.parse(JSON.stringify(state.tut.asked))
      } : null;
    },
    get progress() { return JSON.parse(JSON.stringify(progress)); },
    get sandbox() { return dev.active; },
    openIsland: enterIsland,
    enterLevel: enterLevel,
    backToMap: function () { showScreen('map'); renderMap(); },
    markCleared: markCleared,
    resetProgress: function () {
      progress = defaultProgress();
      saveProgress();
      cloudSchedulePush();
      renderMap();
    },
    snapshot: function () {
      var q = state.question;
      return {
        phase: state.phase,
        view: view,
        island: currentIsland,
        level: state.level,
        round: state.roundIndex + 1,
        stars: state.stars,
        totalRounds: TOTAL_ROUNDS,
        progress: JSON.parse(JSON.stringify(progress)),
        question: q ? {
          type: q.type,
          num: q.num,
          fruit: q.fruit ? q.fruit.id : null,
          color: q.color ? q.color.id : null,
          shape: q.shape ? q.shape.id : null,
          pos: q.pos || null,
          item: q.item ? q.item.id : null,
          verdict: q.verdict ? q.verdict.key : null,
          truth: (typeof q.truth === 'boolean') ? q.truth : null,
          sentence: q.sentence || null,
          kp: q.kind || null,
          form: q.form || null,
          item: q.item ? q.item.id : null,
          correct: q.correct,
          size: q.size || null,
          cmp: q.cmp || null,
          moreCount: q.moreCount || null,
          lessCount: q.lessCount || null,
          animal: q.animal ? (q.animal.id || q.animal) : null,
          zone: q.zone || null,
          desc: q.desc || null,
          act: q.act || null,
          subj: q.subj || null,
          pic: q.pic || null,
          claim: q.claim || null,
          audio: q.audio[0],
          audios: q.audio.slice(),
          tray: q.tray ? q.tray.map(function (t) { return t.color.id + ':' + t.fruit.id; }) : null,
          correctFruit: (typeof q.correctFruit === 'number') ? q.correctFruit : null,
          options: q.options.map(function (o) {
            if (o.kind === 'sign' || o.kind === 'num' || o.kind === 'sign2' || o.kind === 'slab') return o.value;
            if (o.kind === 'fruit') return o.fruit.id;
            if (o.kind === 'comboCard') return o.count + ':' + o.color.id;
            if (o.kind === 'posScene' || o.kind === 'p3chair') return 'pos:' + o.pos;
            if (o.kind === 'p2item' || o.kind === 'p3item' || o.kind === 'p4item' ||
                o.kind === 'p5item') return 'item:' + o.item.id;
            if (o.kind === 'p4star' || o.kind === 'p5star') return 'pos:' + o.pos;
            if (o.kind === 'bsItem' || o.kind === 'bsDrag') return o.size + ':' + o.asset;
            if (o.kind === 'bsAnimal') return o.size + ':' + o.animal.id;
            if (o.kind === 'b2Pile' || o.kind === 'b2Drag') return o.cmp + ':' + o.count + ':' + (o.fruit ? o.fruit.id : o.asset);
            if (o.kind === 'lsObj' || o.kind === 'b3Drag') return o.cmp + ':' + o.obj;
            if (o.kind === 'lsAnimal') return o.animal;
            if (o.kind === 'f1animal') return o.animal;
            if (o.kind === 'f2animal') return o.animal;
            if (o.kind === 'f3act') return o.subj;
            if (o.kind === 'f4scene') return o.subj;
            if (o.kind === 'f5animal') return o.animal;
            if (o.kind === 'yesNo') return o.val ? 'yes' : 'no';
            if (o.shape) return o.shape.id;
            if (o.color) return o.color.id;
            return o.count;
          })
        } : null
      };
    },
    voiceKeys: Object.keys(voiceBank()),
    cloud: {
      get state() { return cloud.state; },
      get connected() { return !!(cloud.token && cloud.gistId); },
      get gistId() { return cloud.gistId; },
      get stars() { return totalStars(); },
      connect: cloudConnect,
      pull: cloudPull,
      push: cloudPush,
      disconnect: cloudDisconnect,
      merge: mergeProgress
    }
  };
})();
</script>
</body>
</html>
