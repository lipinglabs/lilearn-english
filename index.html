<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#87CEEB" />
<title>英语启蒙乐园</title>

<!-- ============================================================
     PWA：添加到手机主屏幕后必须「无地址栏」全屏运行
     ------------------------------------------------------------
     Android（Chrome / Edge）认的是 manifest.json 的 display:standalone
     ＋ 192px 以上图标 ＋ service worker；三者缺一样，系统只会建一个
     普通书签，点开就还是浏览器（地址栏照旧）。
     iOS（Safari）认的是 apple-mobile-web-app-capable=yes ＋
     180×180 的 apple-touch-icon；meta 必须在 <head> 里、且早于内容。
     ============================================================ -->
<link rel="manifest" href="manifest.json" />
<meta name="application-name" content="英语冒险" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="英语冒险" />
<meta name="format-detection" content="telephone=no, email=no, address=no" />

<!-- 国产内核 / 鸿蒙 / 安卓 OEM 浏览器的「以应用方式打开」声明（纯声明，不影响布局） -->
<meta name="full-screen" content="yes" />
<meta name="x5-fullscreen" content="true" />
<meta name="x5-page-mode" content="app" />
<meta name="browsermode" content="application" />
<meta name="apple-touch-fullscreen" content="yes" />

<!-- ============================================================
    尽早注册 Service Worker —— 必须放在 <head>，不能等 window.load
    ------------------------------------------------------------
    原先注册写在主脚本末尾的 window.addEventListener('load', ...) 里。
    但 voice.js 有 8.3MB，真机首次打开时 load 往往要等几十秒；这段
    时间里站点没有生效的 Service Worker，浏览器就判定它「不具备可
    安装条件」，点「添加到桌面」只会生成一个普通书签，点开依然是
    带地址栏的浏览器窗口（鸿蒙/安卓表现都是如此）。
    放在这里后，页面一开始解析就注册，通常几百毫秒内即可接管。
    ============================================================ -->
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  try {
    window.__lilearnSW = navigator.serviceWorker.register('sw.js', { scope: './' });
    window.__lilearnSW.catch(function () { /* 首轮失败由主脚本末尾兜底重试 */ });
  } catch (e) { /* 极老内核不支持：忽略，页面照常运行 */ }
})();
</script>

<style>
  /* ==========================================================
     设计基调：柔和线条、温暖打光、温和过渡（见 RULES.md）
     ========================================================== */
  *,
  *::before,
  *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #5b4a3f;
    --ink-soft: #93806f;
    --gold: #e9a13b;
    --line: rgba(196, 168, 138, .26);
    --shadow-soft: 0 10px 26px rgba(176, 146, 116, .13);
    --shadow-lift: 0 16px 34px rgba(176, 146, 116, .18);
  }

  html, body { height: 100%; }

  body {
    height: 100dvh;
    min-height: 100dvh;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: clamp(6px, 1.4vh, 16px);
    padding: clamp(8px, 1.6vh, 18px) clamp(10px, 2.4vw, 30px) clamp(10px, 2.2vh, 24px);
    font-family: "Yuanti SC", "幼圆", "YouYuan", "PingFang SC", "Microsoft YaHei", system-ui,
      "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(120vmin 78vmin at 50% -12%, #fffaf0 0%, rgba(255, 250, 240, 0) 62%),
      linear-gradient(180deg, #fdf7ec 0%, #f8f2e7 46%, #eef5ef 100%);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  /* 全屏（standalone）时避开刘海、圆角与 Home 指示条：有安全区就用安全区，没有就用原内边距 */
  @supports (padding: env(safe-area-inset-top)) {
    body {
      padding-top: max(clamp(8px, 1.6vh, 18px), env(safe-area-inset-top));
      padding-bottom: max(clamp(10px, 2.2vh, 24px), env(safe-area-inset-bottom));
      padding-left: max(clamp(10px, 2.4vw, 30px), env(safe-area-inset-left));
      padding-right: max(clamp(10px, 2.4vw, 30px), env(safe-area-inset-right));
    }
  }

  [hidden] { display: none !important; }

  /* ===================== 背景 ===================== */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }

  .bg::before {
    content: "";
    position: absolute;
    top: -30vmin;
    left: 50%;
    transform: translateX(-50%);
    width: 140vmin;
    height: 90vmin;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 236, 198, .55) 0%, rgba(255, 236, 198, 0) 66%);
    animation: warm-breathe 9s ease-in-out infinite;
  }

  @keyframes warm-breathe {
    0%, 100% { opacity: .85; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.04); }
  }

  .cloud {
    --s: 1;
    position: absolute;
    left: -45vmin;
    width: 18vmin;
    height: 6.4vmin;
    background: #fff;
    border-radius: 999px;
    opacity: .78;
    animation: drift linear infinite;
  }

  .cloud::before,
  .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }

  .cloud::before { width: 9.2vmin; height: 9.2vmin; left: 2.4vmin; top: -4.6vmin; }
  .cloud::after { width: 6.4vmin; height: 6.4vmin; right: 3.2vmin; top: -3.2vmin; }

  .cloud.c1 { --s: .82; top: 10%; opacity: .8; animation-duration: 86s; }
  .cloud.c2 { --s: 1.18; top: 30%; opacity: .5; animation-duration: 116s; animation-delay: -38s; }
  .cloud.c3 { --s: .66; top: 52%; opacity: .42; animation-duration: 140s; animation-delay: -80s; }

  @keyframes drift {
    from { transform: translateX(0) scale(var(--s)); }
    to { transform: translateX(calc(100vw + 60vmin)) scale(var(--s)); }
  }

  .hills { position: absolute; left: 0; right: 0; bottom: 0; height: 30vh; }

  .hill { position: absolute; bottom: 0; border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
  .hill.h1 { left: -12vw; width: 74vw; height: 20vh; background: #e6f0dd; opacity: .62; }
  .hill.h2 { right: -14vw; width: 70vw; height: 15vh; background: #dcecd6; opacity: .7; }

  .grass {
    position: absolute;
    left: -6vw;
    right: -6vw;
    bottom: -7vh;
    height: 12vh;
    background: #d9ebcf;
    border-radius: 46% 46% 0 0 / 60% 60% 0 0;
    opacity: .75;
  }

  /* ===================== 顶栏 ===================== */
  .topbar {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: clamp(6px, 1.6vw, 16px);
    min-height: clamp(40px, 6.4vh, 58px);
  }

  .icon-btn {
    flex: none;
    width: clamp(38px, 6vh, 54px);
    height: clamp(38px, 6vh, 54px);
    display: grid;
    place-items: center;
    border: 2px solid rgba(255, 255, 255, .95);
    border-radius: 50%;
    background: rgba(255, 255, 255, .82);
    box-shadow: var(--shadow-soft);
    font-size: clamp(16px, 2.5vh, 22px);
    line-height: 1;
    color: var(--ink);
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease;
  }

  .icon-btn:active { transform: scale(.92); box-shadow: 0 4px 12px rgba(176, 146, 116, .16); }

  .icon-btn.ringing { animation: ring .6s ease; }
  .icon-btn.speaking { animation: speak-pulse 1.1s ease-in-out infinite; }

  @keyframes ring {
    0% { transform: scale(1); }
    40% { transform: scale(1.12) rotate(-5deg); }
    70% { transform: scale(.97) rotate(3deg); }
    100% { transform: scale(1) rotate(0); }
  }

  @keyframes speak-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(233, 187, 120, .5); transform: scale(1); }
    50% { box-shadow: 0 0 0 10px rgba(233, 187, 120, 0); transform: scale(1.05); }
  }

  .bar-mid { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }

  .stars {
    display: flex;
    align-items: center;
    gap: clamp(1px, .6vw, 5px);
    padding: clamp(3px, .5vh, 7px) clamp(6px, 1.4vw, 14px);
    border-radius: 999px;
    background: rgba(255, 255, 255, .7);
    box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .95), var(--shadow-soft);
  }

  /* 星星：纯 SVG 绘制，无黑描边，柔和金色外发光 */
  .star {
    display: block;
    width: clamp(15px, min(2.7vh, 2.5vw), 23px);
    height: clamp(15px, min(2.7vh, 2.5vw), 23px);
    overflow: visible;
    color: #e8dfd0;
    transition: color .35s ease;
  }

  .star path {
    fill: currentColor;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linejoin: round;
    stroke-linecap: round;
  }

  .star.on {
    color: #ffd700;
    animation: star-bounce .62s cubic-bezier(.2, 1.8, .42, 1) both,
               star-glow 2.8s ease-in-out .62s infinite;
  }

  @keyframes star-bounce {
    0% { transform: scale(.5); }
    45% { transform: scale(1.55) rotate(10deg); }
    70% { transform: scale(.92) rotate(-4deg); }
    100% { transform: scale(1) rotate(0); }
  }

  @keyframes star-glow {
    0%, 100% { filter: drop-shadow(0 0 3px rgba(255, 196, 40, .55)); }
    50% { filter: drop-shadow(0 0 7px rgba(255, 214, 80, .95)); }
  }

  /* ===================== 舞台 ===================== */
  .stage {
    position: relative;
    z-index: 1;
    min-height: 0;
    border: 2px solid rgba(255, 255, 255, .9);
    border-radius: clamp(24px, 4vmin, 44px);
    background: linear-gradient(180deg, rgba(255, 255, 255, .9), rgba(255, 252, 246, .74));
    box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255, 255, 255, .9);
    overflow: hidden;
  }

  .screen {
    width: 100%;
    height: 100%;
    padding: clamp(10px, 2.4vmin, 26px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 1.8vh, 20px);
    overflow: hidden;
    scrollbar-width: none;
  }

  #screenMap { justify-content: flex-start; }

  .screen::-webkit-scrollbar { display: none; }

  .screen-title {
    font-size: clamp(15px, 3.4vmin, 26px);
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--ink-soft);
    flex: none;
  }

  /* ===================== 地图 ===================== */
  .island-grid {
    width: 100%;
    max-width: 720px;
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-auto-rows: minmax(0, 1fr);
    gap: clamp(6px, 1.4vw, 14px);
  }

  .island {
    position: relative;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6%;
    border-radius: clamp(16px, 2.6vmin, 26px);
    background: linear-gradient(180deg, #ffffff, #fffaf1);
    border: 2px solid rgba(255, 255, 255, .95);
    box-shadow: var(--shadow-soft);
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease, filter .3s ease;
    overflow: hidden;
  }

  .island:active { transform: scale(.96); }

  .island.tapped { animation: island-tap .42s ease; }

  @keyframes island-tap {
    0%, 100% { transform: scale(1) rotate(0); }
    30% { transform: scale(.94) rotate(-1.5deg); }
    65% { transform: scale(.97) rotate(1.5deg); }
  }

  .island .num {
    position: absolute;
    top: 7%;
    left: 9%;
    font-size: clamp(10px, 2.4vmin, 16px);
    font-weight: 800;
    color: #cbb094;
  }

  .island .icon { font-size: clamp(22px, 6.4vw, 44px); line-height: 1; }

  .island .name {
    font-size: clamp(9px, 2.3vw, 14px);
    color: var(--ink-soft);
    text-align: center;
    padding: 0 6%;
    line-height: 1.2;
  }

  .island.locked {
    background: linear-gradient(180deg, #f4f1ec, #eae6de);
    filter: grayscale(.9);
    opacity: .82;
  }

  .island .lock {
    position: absolute;
    right: 7%;
    bottom: 6%;
    display: grid;
    place-items: center;
    font-size: clamp(11px, 2.8vw, 18px);
    padding: .18em .26em;
    border-radius: 999px;
    background: rgba(255, 255, 255, .82);
    box-shadow: 0 3px 8px rgba(150, 130, 110, .18);
  }

  .island.current {
    box-shadow: 0 0 0 2.5px rgba(233, 161, 59, .5), var(--shadow-lift);
    animation: island-breathe 2.8s ease-in-out infinite;
  }

  @keyframes island-breathe {
    0%, 100% { box-shadow: 0 0 0 2.5px rgba(233, 161, 59, .42), var(--shadow-soft); }
    50% { box-shadow: 0 0 0 4px rgba(233, 161, 59, .22), var(--shadow-lift); }
  }

  /* ===================== 岛屿内页 ===================== */
  .island-head { display: flex; align-items: center; gap: clamp(6px, 1.6vw, 12px); flex: none; }
  .island-head .big-icon { font-size: clamp(26px, 7vmin, 46px); line-height: 1; }
  .island-head .titles { display: flex; flex-direction: column; gap: 2px; }
  .island-head .t1 { font-size: clamp(14px, 3.2vmin, 24px); font-weight: 800; }
  .island-head .t2 { font-size: clamp(10px, 2.4vmin, 15px); color: var(--ink-soft); }

  .node-list {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(6px, 1.4vh, 12px);
    flex: none;
  }

  .node-row { display: flex; align-items: center; gap: clamp(8px, 2vw, 16px); }
  .node-row:nth-child(odd) { transform: translateX(-8%); }
  .node-row:nth-child(even) { transform: translateX(8%); }

  .node {
    position: relative;
    width: clamp(50px, 10.4vh, 74px);
    height: clamp(50px, 10.4vh, 74px);
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, .95);
    background: linear-gradient(180deg, #ffffff, #fff7ea);
    box-shadow: var(--shadow-soft);
    font-size: clamp(17px, 3.8vh, 26px);
    font-weight: 800;
    color: var(--gold);
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease;
  }

  .node:active { transform: scale(.93); }

  .node.locked {
    background: linear-gradient(180deg, #f3f0ea, #e8e4dc);
    color: #b3a89a;
    filter: grayscale(.85);
    font-size: clamp(14px, 3vh, 20px);
  }

  .node.done { background: linear-gradient(180deg, #fff6e0, #ffe9bf); }

  .node.playable {
    box-shadow: 0 0 0 3px rgba(233, 161, 59, .34), var(--shadow-lift);
    animation: node-breathe 2.6s ease-in-out infinite;
  }

  @keyframes node-breathe {
    0%, 100% { box-shadow: 0 0 0 3px rgba(233, 161, 59, .3), var(--shadow-soft); }
    50% { box-shadow: 0 0 0 7px rgba(233, 161, 59, .14), var(--shadow-lift); }
  }

  .node-label { font-size: clamp(9px, 2.2vmin, 13px); color: var(--ink-soft); min-width: 3.4em; }
  .node-label.right { text-align: left; }
  .node-label.left { text-align: right; }

  .path-line {
    width: 2px;
    height: clamp(8px, 1.8vh, 16px);
    background: repeating-linear-gradient(180deg, var(--line) 0 4px, transparent 4px 8px);
    flex: none;
  }

  /* ===================== 关卡 ===================== */
  .view {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 1.6vh, 20px);
    max-width: 100%;
    max-height: 100%;
  }

  .start-btn {
    border: 2px solid rgba(255, 255, 255, .95);
    padding: clamp(15px, 2.4vh, 26px) clamp(38px, 7vmin, 80px);
    border-radius: 999px;
    background: linear-gradient(180deg, #ffe6b8, #ffc978);
    color: #7a5320;
    font-family: inherit;
    font-weight: 800;
    font-size: clamp(24px, 4.4vmin, 44px);
    letter-spacing: .1em;
    cursor: pointer;
    box-shadow: 0 12px 26px rgba(228, 168, 82, .28), inset 0 1px 0 rgba(255, 255, 255, .8);
    transition: transform .16s ease, box-shadow .16s ease;
    animation: start-breathe 3s ease-in-out infinite;
  }

  .start-btn:active { transform: scale(.96); }

  @keyframes start-breathe {
    0%, 100% { box-shadow: 0 12px 26px rgba(228, 168, 82, .26), inset 0 1px 0 rgba(255, 255, 255, .8); }
    50% { box-shadow: 0 16px 40px rgba(228, 168, 82, .4), inset 0 1px 0 rgba(255, 255, 255, .8); }
  }

  .ask-display { position: relative; display: grid; place-items: center; max-width: 100%; max-height: 100%; }

  .pile { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; line-height: 1.06; margin: 0 auto; }
  .pile span { flex: none; width: 1em; height: 1em; display: grid; place-items: center; }

  /* 3D 水果（微软 Fluent Emoji 3D，MIT 许可，带透明通道，内联 data URI） */
  .fruit-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    -webkit-user-drag: none;
  }

  .slot-img { width: 1em; height: 1em; object-fit: contain; display: block; }

  .target-fruit .fruit-img,
  .island .icon .fruit-img,
  .island-head .big-icon .fruit-img { width: 1em; height: 1em; object-fit: contain; }

  .pile-display {
    max-width: 5.04em;
    font-size: clamp(16px, min(13vw, 8vh), 72px);
    filter: drop-shadow(0 5px 8px rgba(150, 120, 80, .14));
    animation: pop .5s cubic-bezier(.2, 1.6, .42, 1) both;
  }

  .target-wrap { position: relative; display: grid; place-items: center; animation: pop .5s cubic-bezier(.2, 1.6, .42, 1) both; }

  .target-fruit {
    font-size: clamp(92px, min(38vw, 24vh), 220px);
    line-height: 1;
    filter: drop-shadow(0 10px 14px rgba(198, 152, 92, .2));
  }

  .target-badge {
    position: absolute;
    right: -4%;
    bottom: -2%;
    font-size: clamp(26px, min(6.6vw, 6vh), 54px);
    filter: drop-shadow(0 4px 6px rgba(120, 100, 80, .2));
    animation: badge-wiggle 2.6s ease-in-out infinite;
  }

  @keyframes badge-wiggle {
    0%, 100% { transform: rotate(-7deg) scale(1); }
    50% { transform: rotate(7deg) scale(1.06); }
  }

  /* 题型 B「听名词找水果」：大喇叭 + 问号泡，提示竖起耳朵听 */
  .listen-wrap {
    position: relative;
    display: grid;
    place-items: center;
    animation: pop .5s cubic-bezier(.2, 1.6, .42, 1) both;
  }

  .listen-horn {
    display: grid;
    place-items: center;
    width: clamp(110px, min(42vw, 26vh), 210px);
    height: clamp(110px, min(42vw, 26vh), 210px);
    border-radius: 50%;
    background: linear-gradient(180deg, #ffffff, #fff3dd);
    border: 3px solid rgba(255, 206, 138, .95);
    box-shadow: 0 14px 30px rgba(196, 158, 108, .22), inset 0 -6px 0 rgba(255, 224, 172, .55);
    animation: horn-bounce 1.5s ease-in-out infinite;
  }

  .listen-horn svg {
    width: 56%;
    height: 56%;
    color: #f0a63c;
    filter: drop-shadow(0 4px 8px rgba(196, 140, 60, .3));
  }

  .listen-bubble {
    position: absolute;
    top: -2%;
    right: 6%;
    display: grid;
    place-items: center;
    width: clamp(34px, 9vw, 56px);
    height: clamp(34px, 9vw, 56px);
    border-radius: 50%;
    background: #ff9d6b;
    border: 2.5px solid #fff;
    box-shadow: 0 6px 14px rgba(220, 120, 80, .35);
    color: #fff;
    font-weight: 900;
    font-size: clamp(20px, 5.4vw, 34px);
    animation: badge-wiggle 2.2s ease-in-out infinite;
  }

  @keyframes horn-bounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  @keyframes pop {
    0% { opacity: 0; transform: scale(.55); }
    62% { opacity: 1; transform: scale(1.06); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* ===================== 选项 ===================== */
  .options {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 3vw, 30px);
    transition: opacity .3s ease;
  }

  .options.off { opacity: 0; pointer-events: none; }
  .options.gone { display: none; }

  .option {
    position: relative;
    width: min(clamp(84px, 21vh, 168px), 27vw);
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
    border: 2px solid rgba(255, 255, 255, .95);
    border-radius: clamp(18px, 3vmin, 30px);
    background: rgba(255, 255, 255, .9);
    box-shadow: var(--shadow-soft);
    cursor: pointer;
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    container-type: size;
  }

  .option[data-idx="0"] { background: linear-gradient(180deg, #fff8f4, #ffece4); }
  .option[data-idx="1"] { background: linear-gradient(180deg, #f8fbff, #e8f3fb); }
  .option[data-idx="2"] { background: linear-gradient(180deg, #f9fff4, #ecf8e6); }

  .option:active { transform: scale(.95); }

  .slot {
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
    font-size: clamp(32px, min(14vw, 10vh), 68px);
    line-height: 1;
  }

  /* 方案B：果堆 + 巨大数字标签 */
  .option.pile-opt .slot { padding: 5% 5% 20% 5%; }

  .pile-opt {
    max-width: 5.04em;
    font-size: clamp(10px, 3vw, 24px);
    font-size: 17cqw;
  }

  /* 数字标牌：3D 圆润键帽数字（Fluent 3D），两枚拼成 11–15 */
  .num-sign {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    line-height: 1;
  }

  .num-sign .digit {
    width: 1em;
    height: 1em;
    display: block;
    object-fit: contain;
    filter: drop-shadow(0 3px 6px rgba(140, 120, 90, .28));
  }

  .num-sign .sign-fruit {
    width: .62em;
    height: .62em;
    margin-left: .12em;
    object-fit: contain;
    display: block;
  }

  .pile-num {
    position: absolute;
    right: 2%;
    bottom: 2%;
    display: flex;
    align-items: center;
    pointer-events: none;
  }

  .pile-num .num-sign { font-size: 25cqw; }

  .option.sign-opt .num-sign { font-size: 34cqw; }

  .hint-hand {
    position: absolute;
    left: 50%;
    bottom: 2%;
    transform: translateX(-50%);
    font-size: clamp(16px, 4vmin, 30px);
    filter: drop-shadow(0 3px 5px rgba(120, 100, 80, .3));
    animation: hand-flash 1.15s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes hand-flash {
    0%, 100% { opacity: .3; transform: translateX(-50%) translateY(3px) scale(.9); }
    50% { opacity: 1; transform: translateX(-50%) translateY(-3px) scale(1.1); }
  }

  /* ===================== 第 2 关（W2）组件 ===================== */

  /* 十格阵：2×5 的圆角格，满格的格子里放水果 */
  .ten-frame {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .1em;
    line-height: 1;
  }

  .tf-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: .06em;
    padding: .1em;
    border-radius: .26em;
    background: rgba(255, 252, 245, .78);
    border: 1.5px solid rgba(255, 226, 190, .9);
  }

  .tf-cell {
    width: 1em;
    height: 1em;
    display: grid;
    place-items: center;
    border-radius: .16em;
    background: rgba(255, 245, 230, .55);
  }

  .tf-cell.on { background: transparent; }

  .tf-cell .fruit-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .option.tf-opt .slot {
    padding: 6% 4%;
    font-size: clamp(7px, 2.0vw, 15px);
    font-size: 15cqw;
  }

  /* 松散估数堆：不用格子，越堆越满，凭视觉估个数 */
  .loose-pile {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-content: center;
    line-height: 1.02;
    margin: 0 auto;
  }

  .loose-pile span {
    flex: none;
    width: 1em;
    height: 1em;
    display: grid;
    place-items: center;
  }

  .option.loose-opt .slot {
    padding: 6% 4%;
    font-size: clamp(7px, 1.9vw, 14px);
    font-size: 14cqw;
  }

  /* 数字标牌（题型 B）：3D 键帽 + 右下角小水果 */
  .sign-plate {
    position: relative;
    display: grid;
    place-items: center;
  }

  .sign-plate .num-sign { font-size: 1em; }

  .sign-chip {
    position: absolute;
    right: -18%;
    bottom: -14%;
    width: .42em;
    height: .42em;
    display: grid;
    place-items: center;
    filter: drop-shadow(0 2px 4px rgba(140, 120, 90, .3));
  }

  .sign-chip .fruit-img { width: 100%; height: 100%; }

  .option.sign2-opt .slot {
    font-size: clamp(30px, 12vw, 66px);
    font-size: 36cqw;
  }

  /* ===================== 第 3 关（W3）组件 ===================== */

  /* 巨大 3D 数字底板：奶白圆角牌 + 暖色描边，托住蓝色 3D 键帽数字
     （底板必须保持浅色：深色底板会吃掉键帽的对比度，孩子看不清数字） */
  .num-slab {
    display: grid;
    place-items: center;
    padding: .08em .1em .12em;
    border-radius: 24%;
    background: linear-gradient(180deg, #ffffff 0%, #fffaf0 52%, #fff0d9 100%);
    border: 3px solid rgba(255, 205, 143, .95);
    box-shadow:
      inset 0 3px 0 rgba(255, 255, 255, .95),
      inset 0 -6px 0 rgba(238, 190, 128, .28),
      0 10px 18px rgba(186, 142, 88, .26);
    line-height: 1;
  }

  .num-slab .num-sign {
    font-size: 1em;
  }

  .num-slab .num-sign .digit {
    filter: drop-shadow(0 4px 7px rgba(140, 110, 70, .32));
  }

  .option.slab-opt {
    background: linear-gradient(180deg, #fffaf2, #f6f3ff);
  }

  .option.slab-opt .slot {
    padding: 2%;
    font-size: clamp(34px, 13vw, 72px);
    font-size: 41cqw;
  }

  /* 题型 B 的一小堆水果（2–5 个），大而清楚，一眼数得出来 */
  .loose-pile.combo-pile {
    line-height: 1.08;
    max-width: 2.7em;
  }

  .option.combo-opt .slot {
    padding: 6% 4%;
    font-size: clamp(28px, 10.6vw, 56px);
    font-size: 32cqw;
  }

  /* 题型 C 的十格阵显示区（中央大图） */
  .ten-frame.tf-display {
    font-size: clamp(13px, min(9.4vw, 5.2vh), 34px);
    filter: drop-shadow(0 8px 14px rgba(150, 120, 80, .16));
    animation: pop .5s cubic-bezier(.2, 1.6, .42, 1) both;
  }

  .ten-frame.tf-display .tf-grid {
    background: rgba(255, 253, 247, .92);
    border-color: rgba(255, 222, 180, .95);
  }

  /* ===================== 第 4 关（W4）颜色组件 ===================== */

  /* 选项里的大图：气球 / 彩色苹果，都要撑满且带柔和投影 */
  .color-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    -webkit-user-drag: none;
    filter: drop-shadow(0 6px 10px rgba(150, 120, 90, .22));
  }

  .option.color-opt {
    background: linear-gradient(180deg, #fffdf8, #fff7ee);
  }

  .option.color-opt .slot {
    padding: 3%;
  }

  /* 圆润 3D 颜色按钮：球面高光 + 底部厚度 + 投影 */
  .color-swatch {
    display: block;
    width: 76%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 33% 26%, rgba(255, 255, 255, .92) 0%, rgba(255, 255, 255, .28) 22%, rgba(255, 255, 255, 0) 46%),
      radial-gradient(circle at 50% 42%, var(--c) 0%, var(--c) 58%, var(--cd) 100%);
    border: 3px solid rgba(255, 255, 255, .95);
    box-shadow:
      inset 0 -6px 10px rgba(0, 0, 0, .12),
      0 8px 14px rgba(140, 110, 80, .26);
  }

  .option.color-btn-opt .slot { padding: 6%; }

  /* 题型 C：中央灰色物品，答对后被"刷"上颜色 */
  .paint-wrap {
    display: grid;
    place-items: center;
    animation: pop .5s cubic-bezier(.2, 1.6, .42, 1) both;
  }

  .paint-item {
    width: clamp(150px, min(56vw, 30vh), 260px);
    height: clamp(150px, min(56vw, 30vh), 260px);
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 12px 18px rgba(150, 120, 90, .22));
  }

  .paint-item.painted {
    animation: paint-pop .42s cubic-bezier(.2, 1.7, .4, 1) both;
  }

  @keyframes paint-pop {
    0% { transform: scale(.86); filter: drop-shadow(0 12px 18px rgba(150, 120, 90, .22)) brightness(1.5); }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); filter: drop-shadow(0 12px 18px rgba(150, 120, 90, .22)) brightness(1); }
  }

  /* ===================== 第 2 岛第 4 关：形状 + 空间组合 ===================== */

  /* 题型 A 的三个场景 */
  .p4-scene {
    position: relative;
    width: 100%;
    height: 100%;
    aspect-ratio: 1 / 1;
    display: block;
  }

  .p4-scene-svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 6px 10px rgba(150, 120, 90, .2));
  }

  /* 题型 B：中央透明正方形 */
  .p4-square-stage {
    position: relative;
    width: min(74vw, 44vh);
    aspect-ratio: 1 / 1;
    margin: 0 auto;
  }

  .p4-frame-svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 10px 16px rgba(120, 160, 190, .22));
  }

  .p4-square-slot {
    position: absolute;
    left: 50%;
    top: 54%;
    width: 34%;
    height: 34%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .p4-slot-item {
    width: 100%;
    height: 100%;
    display: block;
    animation: drop-in .5s cubic-bezier(.2, 1.5, .4, 1) both;
  }

  .p4-verdict { width: min(78vw, 44vh); }

  /* 教学：盒子 + 圆圈 + 星星 */
  .combo-stage {
    position: relative;
    width: min(80vw, 46vh);
    aspect-ratio: 1 / 1;
    margin: 0 auto;
  }

  .combo-box {
    position: absolute;
    left: 6%;
    bottom: 10%;
    width: 38%;
    height: 38%;
    opacity: .95;
  }

  .combo-box > svg { width: 100%; height: 100%; display: block; }

  .combo-ring {
    position: absolute;
    left: 50%;
    top: 40%;
    width: 62%;
    height: 62%;
    transform: translate(-50%, -50%) scale(.35);
    opacity: 0;
    transition: transform .62s cubic-bezier(.2, 1.5, .4, 1), opacity .42s ease;
    z-index: 1;
    pointer-events: none;
  }

  .combo-stage.ring-on .combo-ring { transform: translate(-50%, -50%) scale(1); opacity: 1; }

  .combo-ring > svg { width: 100%; height: 100%; display: block; }

  .combo-star {
    position: absolute;
    left: 78%;
    top: 74%;
    width: 21%;
    height: 21%;
    transform: translate(-50%, -50%);
    transition: left .9s cubic-bezier(.3, 1.2, .5, 1), top .9s cubic-bezier(.3, 1.2, .5, 1),
                width .4s ease, height .4s ease;
    z-index: 3;
    cursor: grab;
    touch-action: none;
  }

  .combo-star > svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 6px 12px rgba(220, 168, 40, .45));
  }

  /* 演示：星星飞到圆圈上 */
  .combo-stage[data-pos="on"] .combo-star { left: 50%; top: 20%; width: 19%; height: 19%; }

  .combo-star.picked > svg { animation: ball-wiggle 1s ease-in-out infinite; }

  /* 教学第二步：星星 + 两个形状卡片 */
  .combo-ask {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(12px, 3.4vh, 28px);
    animation: pop .4s cubic-bezier(.2, 1.6, .42, 1) both;
  }

  .combo-ask .combo-star {
    position: relative;
    left: auto;
    top: auto;
    width: clamp(58px, 17vw, 86px);
    height: clamp(58px, 17vw, 86px);
    transform: none;
  }

  .combo-ask.ready .combo-star::after {
    content: "";
    position: absolute;
    inset: -14%;
    border-radius: 50%;
    border: 2.5px solid rgba(255, 186, 104, .85);
    animation: ready-ring 1.6s ease-in-out infinite;
    pointer-events: none;
  }

  .combo-cards {
    display: flex;
    gap: clamp(12px, 4vw, 28px);
    align-items: center;
    justify-content: center;
  }

  .combo-shape-card {
    position: relative;
    width: clamp(108px, 33vw, 152px);
    aspect-ratio: 1 / 1;
    padding: 4%;
    border: 2px solid rgba(255, 255, 255, .95);
    border-radius: clamp(18px, 4vmin, 28px);
    background: linear-gradient(180deg, #fffdf8, #fff5e8);
    box-shadow: var(--shadow-soft);
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease;
  }

  .combo-shape-card:active { transform: scale(.96); }
  .combo-shape-card.shake { animation: shake .42s ease-in-out; }

  .combo-shape-card.drop-hot {
    box-shadow: 0 0 0 4px rgba(255, 196, 120, .8), 0 0 26px 8px rgba(255, 190, 110, .32);
  }

  .combo-shape-svg { width: 100%; height: 100%; display: block; }

  /* 星星被放进正方形后的位置 */
  .combo-star.in-shape {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 48%;
    height: 48%;
    transform: translate(-50%, -50%);
    animation: pop .34s cubic-bezier(.2, 1.6, .42, 1) both;
  }

  /* ===================== 第 2 岛第 3 关：空间进阶（under / behind） ===================== */

  /* 场景由「房间 / 家具后层 / 角色 / 家具前景层」四层叠出来：
     角色在 under 时被家具腿压住，在 behind 时被整件家具挡住，在 on 时浮在最上面。 */
  .p3-scene {
    position: relative;
    width: 100%;
    height: 100%;
    aspect-ratio: 1 / 1;
    display: block;
  }

  .p3-scene > svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .p3-room-svg { z-index: 0; }
  .p3-back-svg { z-index: 1; }
  .p3-front-svg { z-index: 4; pointer-events: none; }

  .p3-actor {
    position: absolute;
    left: 50%;
    top: 40%;
    width: 30%;
    height: 30%;
    transform: translate(-50%, -50%);
    z-index: 3;
    transition: top .82s cubic-bezier(.3, 1.25, .45, 1), width .4s ease, height .4s ease;
    will-change: top;
  }

  .p3-actor > svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 6px 10px rgba(150, 110, 90, .2));
  }

  .p3-scene[data-pos="on"] .p3-actor { top: 31%; width: 34%; height: 34%; z-index: 6; }
  .p3-scene[data-pos="under"] .p3-actor { top: 72%; width: 31%; height: 31%; z-index: 3; }
  .p3-scene[data-pos="behind"] .p3-actor { top: 38%; width: 33%; height: 33%; z-index: 2; }

  /* 椅子更高更窄：三个位置单独给偏移，behind 时把猫抬到椅背上沿只露头 */
  .p3-scene.chair-scene[data-pos="on"] .p3-actor { top: 36%; width: 32%; height: 32%; }
  .p3-scene.chair-scene[data-pos="under"] .p3-actor { top: 74%; width: 29%; height: 29%; }
  .p3-scene.chair-scene[data-pos="behind"] .p3-actor { top: 21%; width: 31%; height: 31%; }

  .p3-scene.tut-scene { width: min(82vw, 50vh); height: auto; margin: 0 auto; }
  .box-scene { width: min(78vw, 48vh); height: auto; margin: 0 auto; }

  .p3-actor.picked > svg { animation: ball-wiggle 1s ease-in-out infinite; }

  /* 可拖拽时的呼吸光环（不用小手提示） */
  .p3-scene.ready .p3-actor::after {
    content: "";
    position: absolute;
    inset: -12%;
    border-radius: 50%;
    border: 2.5px solid rgba(255, 186, 104, .85);
    animation: ready-ring 1.6s ease-in-out infinite;
    pointer-events: none;
  }

  .p3-scene.shake { animation: shake .42s ease-in-out; }
  .pos-scene.shake { animation: shake .42s ease-in-out; }

  .p3-scene[data-drop].drop-hot {
    box-shadow: 0 0 0 4px rgba(255, 196, 120, .75), 0 0 26px 8px rgba(255, 190, 110, .32);
    border-radius: 26px;
  }

  /* 纸箱后面的位置：只露出物品上半截 */
  .p3-slot {
    position: absolute;
    left: 50%;
    top: 27%;
    width: 30%;
    height: 30%;
    transform: translate(-50%, -50%);
    z-index: 2;
    pointer-events: none;
  }

  .p3-slot > svg {
    width: 100%;
    height: 100%;
    display: block;
    animation: drop-in .5s cubic-bezier(.2, 1.5, .4, 1) both;
  }

  /* ===================== 第 2 岛第 2 关：空间方位（in / on） ===================== */

  /* 位置场景：透明盒 + 小球（小球夹在盒后层与玻璃层之间，才有“在盒子里”的层次） */
  .pos-scene {
    position: relative;
    width: 100%;
    height: 100%;
    aspect-ratio: 1 / 1;
    display: block;
  }

  .pos-box-back,
  .pos-box-front {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .pos-box-back { z-index: 1; }
  .pos-box-front { z-index: 3; pointer-events: none; }

  .pos-ball {
    position: absolute;
    left: 50%;
    top: 11%;
    width: 28%;
    height: 28%;
    z-index: 2;
    transform: translate(-50%, -50%);
    transition: top .78s cubic-bezier(.32, 1.3, .5, 1), left .78s cubic-bezier(.32, 1.3, .5, 1),
                width .4s ease, height .4s ease;
    will-change: top, left;
  }

  .pos-ball-svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 6px 10px rgba(150, 110, 90, .22));
  }

  .pos-scene[data-pos="in"] .pos-ball { left: 50%; top: 68%; width: 30%; height: 30%; }
  .pos-scene[data-pos="on"] .pos-ball { left: 50%; top: 22%; width: 31%; height: 31%; z-index: 4; }
  .pos-scene[data-pos="beside"] .pos-ball { left: 84%; top: 72%; width: 25%; height: 25%; z-index: 4; }

  .pos-scene.tut-scene { width: min(82vw, 50vh); height: auto; margin: 0 auto; }

  .pos-ball.picked .pos-ball-svg { animation: ball-wiggle 1s ease-in-out infinite; }

  @keyframes ball-wiggle {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  /* 教学可拖拽时给一圈呼吸光环（不用小手提示） */
  .pos-scene.ready .pos-ball::after {
    content: "";
    position: absolute;
    inset: -14%;
    border-radius: 50%;
    border: 2.5px solid rgba(255, 186, 104, .85);
    animation: ready-ring 1.6s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes ready-ring {
    0%, 100% { opacity: .22; transform: scale(.94); }
    50% { opacity: .9; transform: scale(1.07); }
  }

  /* 题型 A 的选项卡片 */
  .option.pos-opt { background: linear-gradient(180deg, #fbfdff, #eef7fd); }
  .option.pos-opt .slot { padding: 2%; }

  /* 教学第三步：左右对比 */
  .tut-pair {
    display: flex;
    gap: clamp(10px, 4vw, 26px);
    align-items: center;
    justify-content: center;
    animation: pop .4s cubic-bezier(.2, 1.6, .42, 1) both;
  }

  .tut-choice {
    width: clamp(124px, 39vw, 176px);
    aspect-ratio: 1 / 1;
    padding: 3%;
    border: 2px solid rgba(255, 255, 255, .95);
    border-radius: clamp(18px, 4vmin, 28px);
    background: linear-gradient(180deg, #fffdf8, #fff5e8);
    box-shadow: var(--shadow-soft);
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease;
  }

  .tut-choice:active { transform: scale(.96); }
  .tut-choice.right { box-shadow: 0 0 0 4px rgba(150, 214, 160, .9), var(--shadow-soft); }
  .tut-choice.shake { animation: shake .42s ease-in-out; }

  /* 题型 B：桌子（投放区放宽到桌子周围一圈） */
  .table-wrap {
    position: relative;
    width: min(78vw, 48vh);
    aspect-ratio: 1 / 1;
    padding: 4% 6% 10%;
    border-radius: 26px;
  }

  .table-svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 10px 16px rgba(150, 115, 80, .18));
  }

  .table-slot {
    position: absolute;
    left: 50%;
    top: 30%;
    width: 34%;
    height: 34%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .table-slot > svg {
    width: 100%;
    height: 100%;
    display: block;
    animation: drop-in .5s cubic-bezier(.2, 1.5, .4, 1) both;
  }

  @keyframes drop-in {
    0% { transform: translateY(-26%) scale(.82); opacity: 0; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }

  .table-wrap.drop-hot {
    box-shadow: 0 0 0 4px rgba(255, 196, 120, .75), 0 0 26px 8px rgba(255, 190, 110, .32);
  }

  .option.item-opt .slot { padding: 5%; }

  .item-svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 6px 10px rgba(150, 120, 90, .2));
  }

  /* 题型 C：对错按钮（只有 2 个选项，第三个槽位收起） */
  .option.yn-opt .slot { padding: 10%; }

  .yn-svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 6px 10px rgba(140, 150, 140, .22));
  }

  .option[hidden] { display: none; }

  .p2-verdict-stage {
    width: min(70vw, 40vh);
    aspect-ratio: 1 / 1;
    animation: pop .45s cubic-bezier(.2, 1.6, .42, 1) both;
  }

  .p2-scene-svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 12px 18px rgba(150, 120, 90, .2));
  }

  /* ===================== 第 2 岛第 1 关：形状 ===================== */

  .shape-svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 6px 10px rgba(150, 120, 90, .26));
  }

  .option.shape-opt { background: linear-gradient(180deg, #fffdf8, #fff7ee); }

  .option.shape-opt .slot { padding: 5%; }

  .option.obj-opt .slot { padding: 3%; }

  .option.shape-btn-opt .slot { padding: 8%; }

  /* 拼图房子 */
  .house-svg {
    width: clamp(170px, min(64vw, 30vh), 280px);
    height: clamp(170px, min(64vw, 30vh), 280px);
    display: block;
    filter: drop-shadow(0 12px 18px rgba(150, 120, 90, .22));
    animation: pop .5s cubic-bezier(.2, 1.6, .42, 1) both;
  }

  .house-part {
    transition: filter .28s ease, transform .28s ease;
    transform-box: fill-box;
    transform-origin: center;
  }

  .house-part.lit {
    filter: drop-shadow(0 0 9px rgba(255, 206, 84, .95)) brightness(1.18);
    animation: part-glow .7s ease-out 2;
  }

  @keyframes part-glow {
    0% { transform: scale(1); }
    45% { transform: scale(1.07); }
    100% { transform: scale(1); }
  }

  /* 岛屿卡片上的形状小图标 */
  .island .icon .mini-shapes,
  .island-head .big-icon .mini-shapes {
    width: 1em;
    height: 1em;
    display: block;
  }

  /* ===================== 云存档 ===================== */

  .cloud-btn { position: relative; }
  /* 关卡界面顶栏要塞 12 颗星，云存档按钮先让位（地图与岛屿页仍可见） */
  body[data-view="level"] .cloud-btn { display: none; }
  .cloud-btn .cloud-dot {
    position: absolute;
    right: 12%;
    top: 12%;
    width: 26%;
    height: 26%;
    border-radius: 50%;
    background: #7fd49a;
    border: 2px solid #fff;
  }
  .cloud-btn.syncing svg { animation: cloud-pulse 1.1s ease-in-out infinite; }
  .cloud-btn.synced .cloud-dot { background: #6fcf97; }
  .cloud-btn.error .cloud-dot { background: #f2a08a; }
  .cloud-btn.off .cloud-dot { display: none; }
  .cloud-btn.off svg { color: #b6a898; }

  @keyframes cloud-pulse {
    0%, 100% { opacity: .45; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-1px); }
  }

  .sheet {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: grid;
    place-items: center;
    padding: 6vw;
    background: rgba(90, 74, 58, .28);
    backdrop-filter: blur(2px);
  }

  .sheet-card {
    width: min(100%, 380px);
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.6vh, 14px);
    padding: clamp(16px, 4vw, 26px);
    border-radius: clamp(20px, 4vmin, 30px);
    background: linear-gradient(180deg, #ffffff, #fffaf0);
    border: 2px solid rgba(255, 255, 255, .95);
    box-shadow: 0 22px 46px rgba(120, 96, 70, .28);
    animation: pop .34s cubic-bezier(.2, 1.5, .4, 1) both;
  }

  .sheet-title {
    font-size: clamp(17px, 4.6vw, 22px);
    font-weight: 800;
    color: #4a3d31;
  }

  .sheet-tip, .sheet-note {
    margin: 0;
    font-size: clamp(12px, 3.2vw, 14px);
    line-height: 1.6;
    color: #8a7a68;
  }

  .sheet-note { font-size: clamp(11px, 2.9vw, 12.5px); color: #a1907c; }

  .sheet-input {
    width: 100%;
    padding: clamp(10px, 2.6vw, 14px) clamp(12px, 3.2vw, 16px);
    border-radius: 16px;
    border: 2px solid rgba(255, 214, 166, .9);
    background: #fffdf8;
    font-size: clamp(13px, 3.4vw, 15px);
    color: #4a3d31;
    outline: none;
  }

  .sheet-input:focus { border-color: rgba(240, 166, 60, .95); }

  .sheet-status {
    min-height: 1.2em;
    font-size: clamp(12px, 3.2vw, 14px);
    color: #2f8c5a;
  }

  .sheet-status.bad { color: #c2563f; }

  .sheet-actions {
    display: flex;
    gap: 10px;
  }

  .sheet-btn {
    flex: 1;
    padding: clamp(10px, 2.8vw, 14px);
    border-radius: 16px;
    border: 2px solid rgba(255, 226, 190, .95);
    background: #fff8ec;
    color: #6b5847;
    font-size: clamp(13px, 3.4vw, 15px);
    font-weight: 700;
    cursor: pointer;
    transition: transform .16s ease, background .16s ease;
  }

  .sheet-btn.primary {
    background: linear-gradient(180deg, #ffd9a0, #f8bd6d);
    border-color: rgba(255, 255, 255, .95);
    color: #5a431f;
    box-shadow: 0 8px 16px rgba(214, 160, 80, .3);
  }

  .sheet-btn:active { transform: scale(.96); }

  /* 「还没有令牌」小链接：只给家长看，不抢主按钮的视线 */
  .sheet-link {
    align-self: flex-start;
    padding: 2px 0;
    border: 0;
    background: none;
    color: #b98a4e;
    font-size: clamp(11px, 2.9vw, 12.5px);
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  /* ===================== 开发者测试后门（RULES §五.10） ===================== */
  /* 地图页左上角隐形连点区：连点 5 次弹出暗号框（该角落本就是空白，不影响任何按钮） */
  .dev-trigger {
    position: absolute;
    top: 0;
    left: 0;
    width: 64px;
    height: 64px;
    z-index: 6;
    -webkit-tap-highlight-color: transparent;
  }

  /* 测试模式角标：贴在页面右边缘中点，点它立即退出沙盒、恢复真实进度 */
  .dev-badge {
    position: fixed;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 70;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, .95);
    background: rgba(255, 249, 240, .93);
    box-shadow: 0 6px 14px rgba(120, 96, 70, .28);
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    animation: dev-breathe 1.8s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
  }

  @keyframes dev-breathe {
    0%, 100% { box-shadow: 0 6px 14px rgba(120, 96, 70, .28); }
    50% { box-shadow: 0 6px 22px rgba(233, 161, 59, .6); }
  }

  /* 暗号输错：卡片抖一下 */
  .sheet-card.shake { animation: shake .52s ease; }

  .star-total {
    margin-top: -2px;
    margin-bottom: 2px;
    font-size: clamp(11px, 2.9vw, 13px);
    color: #b08a55;
    letter-spacing: .02em;
  }

  /* ===================== 第 5 关（W5）游乐场组件 ===================== */

  /* 拖拽图层：幽灵跟随 + 轻微放大 */
  .drag-layer {
    position: fixed;
    inset: 0;
    z-index: 40;
    pointer-events: none;
  }

  .drag-ghost {
    position: fixed;
    margin: 0;
    border-radius: clamp(16px, 3vmin, 26px);
    transform: scale(1.1) rotate(2deg);
    filter: drop-shadow(0 14px 20px rgba(140, 110, 80, .32));
    opacity: .96;
    pointer-events: none;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, .92);
    border: 2px solid rgba(255, 255, 255, .95);
  }

  .option.draggable { cursor: grab; touch-action: none; }
  .option.draggable.dragging { opacity: .35; }

  .drop-target.drop-hot {
    box-shadow: 0 0 0 4px rgba(255, 196, 120, .8), 0 0 28px 8px rgba(255, 190, 110, .38);
    transform: scale(1.04);
  }

  .monster.drop-target {
    border-radius: 46%;
    transition: transform .18s ease, box-shadow .18s ease;
  }

  .monster.drop-hot {
    box-shadow: 0 0 0 6px rgba(255, 214, 140, .75), 0 0 40px 10px rgba(255, 200, 120, .45);
    transform: scale(1.05);
  }

  /* 题型 A：装果堆的藤编小篮 */
  .basket-pile {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    border-radius: 22% 22% 30% 30% / 20% 20% 34% 34%;
    background:
      linear-gradient(180deg, rgba(255, 246, 228, .96), rgba(255, 231, 196, .96));
    border: 2.5px solid rgba(238, 196, 140, .95);
    box-shadow: inset 0 -6px 0 rgba(222, 174, 116, .3), 0 8px 14px rgba(170, 130, 80, .2);
  }

  .basket-pile .ten-frame { font-size: 13.5cqw; gap: .05em; }
  .basket-pile .tf-grid { gap: .04em; padding: .08em; border-radius: .2em; }

  .basket-pile .tf-grid { background: rgba(255, 255, 255, .7); }

  .option.basket-pile-opt { background: linear-gradient(180deg, #fffdf6, #ffeede); }
  .option.basket-pile-opt .slot { padding: 3%; }

  /* 题型 B：彩色篮子（梯形编织篮 + 篮口 + 提手） */
  .basket {
    position: relative;
    width: 74%;
    height: 50%;
    margin-top: 12%;
    border-radius: 8% 8% 30% 30% / 10% 10% 40% 40%;
    background:
      repeating-linear-gradient(90deg, var(--c) 0 7px, var(--cd) 7px 14px);
    border: 3px solid rgba(255, 255, 255, .95);
    box-shadow:
      inset 0 -10px 14px rgba(0, 0, 0, .14),
      0 10px 16px rgba(140, 110, 80, .26);
  }

  .basket::before {
    content: "";
    position: absolute;
    left: -6%;
    right: -6%;
    top: -12%;
    height: 30%;
    border-radius: 50%;
    background: var(--cd);
    border: 3px solid rgba(255, 255, 255, .95);
    box-shadow: inset 0 4px 8px rgba(0, 0, 0, .18);
  }

  .basket::after {
    content: "";
    position: absolute;
    left: 12%;
    right: 12%;
    bottom: 82%;
    height: 46%;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    border: 4px solid var(--cd);
    border-bottom: none;
    opacity: .75;
  }

  .option.basket-color-opt { background: linear-gradient(180deg, #fffdf8, #fff6ea); }
  .option.basket-color-opt .slot { padding: 6% 6% 4%; }

  /* 题型 B：上方可拖拽的彩色水果托盘 */
  .fruit-tray {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 4vw, 26px);
    animation: pop .5s cubic-bezier(.2, 1.6, .42, 1) both;
  }

  .tray-fruit {
    width: clamp(64px, 21vw, 104px);
    height: clamp(64px, 21vw, 104px);
    display: grid;
    place-items: center;
    border-radius: 30%;
    background: radial-gradient(circle at 36% 28%, #ffffff, #fff4e4);
    border: 2.5px solid rgba(255, 231, 200, .95);
    box-shadow: 0 8px 16px rgba(170, 135, 90, .2);
    touch-action: none;
    cursor: grab;
    transition: transform .16s ease, box-shadow .16s ease;
  }

  .tray-fruit .tray-img {
    width: 86%;
    height: 86%;
    object-fit: contain;
    -webkit-user-drag: none;
    filter: drop-shadow(0 5px 8px rgba(150, 120, 90, .22));
  }

  .tray-fruit.picked {
    transform: translateY(-6px) scale(1.06);
    box-shadow: 0 0 0 4px rgba(255, 190, 110, .85), 0 12px 20px rgba(170, 130, 80, .28);
  }

  .tray-fruit:active { cursor: grabbing; }

  /* 题型 C：组合大卡片 */
  .combo-card {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 2%;
    width: 100%;
    height: 100%;
    padding: 6%;
  }

  .combo-card .card-fruit {
    width: 42%;
    height: 42%;
    object-fit: contain;
    -webkit-user-drag: none;
    filter: drop-shadow(0 3px 6px rgba(150, 120, 90, .2));
  }

  .option.card-opt { background: linear-gradient(180deg, #fffefb, #f4fbff); }

  /* 整岛通关：结算页升起的小旗 */
  .island-flag {
    position: absolute;
    right: 5%;
    top: 14%;
    width: clamp(40px, 11vw, 74px);
    height: clamp(40px, 11vw, 74px);
    color: #f5a623;
    opacity: 0;
  }

  .island-flag svg { width: 100%; height: 100%; filter: drop-shadow(0 5px 10px rgba(200, 150, 60, .4)); }
  .island-flag.rise { animation: flag-rise .8s cubic-bezier(.2, 1.5, .4, 1) .35s forwards; }

  @keyframes flag-rise {
    0% { opacity: 0; transform: translateY(18px) scale(.5) rotate(-12deg); }
    70% { opacity: 1; transform: translateY(-4px) scale(1.1) rotate(3deg); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
  }

  /* 地图：整岛通关的小旗徽标 */
  .island.cleared { box-shadow: 0 0 0 3px rgba(255, 200, 110, .8), 0 10px 20px rgba(190, 150, 90, .26); }

  .island-flag-badge {
    position: absolute;
    right: 4%;
    top: 4%;
    width: clamp(14px, 4vw, 22px);
    height: clamp(14px, 4vw, 22px);
    color: #f5a623;
    animation: badge-wiggle 3s ease-in-out infinite;
  }

  .island-flag-badge svg { width: 100%; height: 100%; }

  /* 华丽彩带的金色亮片 */
  .confetti i.grand-spark {
    top: 34%;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    animation-name: spark-fly;
    animation-duration: 1.5s;
    animation-timing-function: cubic-bezier(.2, .7, .3, 1);
    animation-fill-mode: both;
  }

  @keyframes spark-fly {
    0% { opacity: 0; transform: translate(0, 0) scale(.4) rotate(0); }
    18% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), -18vh) scale(1.1) rotate(220deg); }
  }

  /* 3D 卡通小怪兽（喂食机）：纯 CSS 塑形，柔光 + 圆润 */
  .monster {
    position: relative;
    display: grid;
    place-items: center;
    animation: monster-bob 2.6s ease-in-out infinite;
  }

  .monster-body {
    position: relative;
    width: clamp(150px, min(52vw, 30vh), 250px);
    height: clamp(150px, min(52vw, 30vh), 250px);
    border-radius: 46% 46% 42% 42% / 42% 42% 48% 48%;
    background: radial-gradient(circle at 34% 26%, #d5f0c8, #a8dd9b 58%, #8ecd83);
    border: 3px solid rgba(255, 255, 255, .92);
    box-shadow:
      inset 0 -10px 0 rgba(120, 180, 110, .22),
      inset 0 12px 22px rgba(255, 255, 255, .5),
      0 16px 30px rgba(120, 160, 110, .26);
  }

  .monster-ears {
    position: absolute;
    top: 2%;
    width: 74%;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
  }

  .monster-ears i {
    width: clamp(26px, 8vw, 46px);
    height: clamp(26px, 8vw, 46px);
    border-radius: 50% 50% 46% 46%;
    background: radial-gradient(circle at 40% 30%, #cfeec1, #93d187);
    border: 3px solid rgba(255, 255, 255, .9);
    box-shadow: 0 6px 12px rgba(120, 160, 110, .22);
  }

  .monster-eyes {
    position: absolute;
    top: 20%;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 16%;
  }

  .monster-eyes i {
    width: clamp(20px, 6.4vw, 34px);
    height: clamp(20px, 6.4vw, 34px);
    border-radius: 50%;
    background: #fff;
    box-shadow: inset 0 2px 4px rgba(90, 120, 80, .2);
    display: grid;
    place-items: center;
    animation: blink 4.4s ease-in-out infinite;
  }

  .monster-eyes b {
    width: 52%;
    height: 52%;
    border-radius: 50%;
    background: #4a5a44;
  }

  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(.12); }
  }

  /* 肚子上的数字牌 */
  .monster-belly {
    position: absolute;
    left: 50%;
    top: 52%;
    transform: translate(-50%, -50%);
    display: grid;
    place-items: center;
    width: fit-content;
    padding: 4% 6%;
    border-radius: 26%;
    background: linear-gradient(180deg, #fffdf6, #fff1d8);
    border: 2.5px solid rgba(255, 214, 158, .95);
    box-shadow: 0 8px 16px rgba(150, 130, 90, .18), inset 0 -3px 0 rgba(255, 226, 178, .6);
  }

  .monster-belly .num-sign { font-size: clamp(30px, 9.4vw, 54px); }

  .monster-mouth {
    position: absolute;
    left: 50%;
    bottom: 12%;
    transform: translateX(-50%);
    width: 34%;
    height: 13%;
    border-radius: 0 0 60% 60% / 0 0 100% 100%;
    background: #f6a8a0;
    box-shadow: inset 0 3px 5px rgba(180, 110, 100, .35);
    animation: mouth-chew 2.6s ease-in-out infinite;
  }

  @keyframes monster-bob {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-4px) scale(1.015); }
  }

  @keyframes mouth-chew {
    0%, 100% { transform: translateX(-50%) scaleY(1); }
    50% { transform: translateX(-50%) scaleY(.72); }
  }

  .option.right {
    background: linear-gradient(180deg, #f2fff4, #dff7e4);
    transform: scale(1.06);
    box-shadow: 0 0 0 4px rgba(143, 201, 160, .55), 0 0 34px 6px rgba(143, 201, 160, .34);
    animation: right-burst .62s cubic-bezier(.2, 1.6, .4, 1);
  }

  @keyframes right-burst {
    0% { transform: scale(.97); }
    55% { transform: scale(1.13); }
    100% { transform: scale(1.06); }
  }

  .option.wrong {
    background: #fff5f2;
    box-shadow: 0 0 0 3px rgba(240, 160, 150, .45);
    animation: shake .52s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0) rotate(0); }
    15% { transform: translateX(-8px) rotate(-2deg); }
    35% { transform: translateX(8px) rotate(2deg); }
    55% { transform: translateX(-6px) rotate(-1.5deg); }
    75% { transform: translateX(6px) rotate(1.5deg); }
  }

  /* ===================== 结算 ===================== */
  .trophy-wrap { display: grid; place-items: center; position: relative; animation: pop .62s cubic-bezier(.2, 1.6, .42, 1) both; }

  .trophy-wrap::before {
    content: "";
    position: absolute;
    width: 152%;
    height: 152%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 224, 158, .6) 0%, rgba(255, 224, 158, 0) 68%);
    animation: glow-pulse 2.6s ease-in-out infinite;
  }

  @keyframes glow-pulse {
    0%, 100% { transform: scale(.92); opacity: .8; }
    50% { transform: scale(1.1); opacity: 1; }
  }

  .trophy {
    position: relative;
    font-size: clamp(100px, min(28vw, 26vh), 240px);
    line-height: 1;
    filter: drop-shadow(0 12px 16px rgba(196, 158, 60, .38));
    animation: trophy-float 2.8s ease-in-out infinite;
  }

  @keyframes trophy-float {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-10px) rotate(1.5deg); }
  }

  .restart-btn {
    width: clamp(60px, 9.4vh, 90px);
    height: clamp(60px, 9.4vh, 90px);
    display: grid;
    place-items: center;
    border: 2px solid rgba(255, 255, 255, .95);
    border-radius: 50%;
    background: linear-gradient(180deg, #ffffff, #f2f9ff);
    box-shadow: 0 10px 22px rgba(150, 170, 190, .22);
    font-size: clamp(26px, 4.6vh, 40px);
    line-height: 1;
    cursor: pointer;
    transition: transform .16s ease;
    animation: restart-nudge 3s ease-in-out infinite;
  }

  .restart-btn:active { transform: scale(.94); }

  @keyframes restart-nudge {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  /* ===================== 彩带 / 飞星 / 提示 ===================== */
  .confetti { position: fixed; inset: 0; z-index: 6; overflow: hidden; pointer-events: none; }

  .confetti i {
    position: absolute;
    top: -12vh;
    display: block;
    border-radius: 3px;
    opacity: .92;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  @keyframes fall {
    0% { transform: translate3d(0, -12vh, 0) rotate(0deg); }
    100% { transform: translate3d(0, 118vh, 0) rotate(680deg); }
  }

  .fly-layer { position: fixed; inset: 0; z-index: 7; pointer-events: none; }

  /* SVG 控件图标（替代带黑描边的 Emoji） */

  .restart-btn svg { width: 48%; height: 48%; color: #2f6b8f; }
  .target-badge { width: clamp(26px, min(6.6vw, 6vh), 54px); height: clamp(26px, min(6.6vw, 6vh), 54px); display: grid; place-items: center; }

  .toast {

  @keyframes toast-in {

    to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }

  /* 横屏矮屏 */
  @media (max-height: 560px) {
    body { gap: 6px; padding: 8px 14px 10px; }

  /* ===================== 第 2 岛第 5 关：形状与空间终极考验 ===================== */

  /* 教学舞台 */
  .p5-tut-stage {

  .p5-tut-stage .pos-scene,

  .p5-tut-stage .p3-scene[data-pos="start"] .p3-actor { top: 15%; width: 28%; height: 28%; z-index: 5; }

  /* 四个形状大图（教学第 1 步）：手机竖屏 2×2，卡片够大才看得清 */
  .p5-shape-row {

  .p5-shape-card {

  /* ===================== 第 3 岛第 1 关：大与小 ===================== */

  /* 脚下柔和投影，避免动物像贴在纸上 */

  /* 对比测试：一大一小两个苹果 */
  .bs-cmp-row {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: clamp(12px, 5vw, 34px);

  .bs-cmp-apple {
    position: relative;

  /* 题型 C：左大箱 / 右小箱 */
  .bs-box-row {

  /* ===================== 第 3 岛第 2 关：多 / 少 ===================== */

  .option.b2-opt .slot { padding: 4%; }
  .option.b2-drag-opt { touch-action: none; cursor: grab; }

  /* 题型 C：上方两个分类箱（Many dots = 多，Few dots = 少），都是投放目标 */
  .b2-box-row {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: clamp(10px, 4vw, 30px);
    animation: pop .45s cubic-bezier(.2, 1.6, .42, 1) both;
  }

  .b2-box {
    position: relative;

    height: clamp(120px, 36vw, 176px);

  /* 判定区放宽 8%：箱子边沿也算投进去（孩子拖不准） */
  .b2-box::before {

    position: absolute;

  .b2-in-box {
    position: absolute;
    left: 50%;
    bottom: 18%;

    transform: translateX(-50%);

  }

  /* 教学舞台：左筐（5 苹果）与右筐（1 苹果）同台 */
  .b2-tut-stage {
    width: min(90vw, 54vh);
    margin: 0 auto;
    display: grid;
    place-items: center;
  }

  .b2-tut-row {

    padding: clamp(6px, 1.6vh, 14px) 0;
  }

  .b2-tut-basket {
    position: relative;

  .b2-tut-basket:active { transform: scale(.95); }

  .bs-box-svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 8px 14px rgba(160, 125, 85, .18)); }

  .bs-box.drop-hot { filter: drop-shadow(0 0 14px rgba(255, 190, 110, .85)); transform: translateY(-3px); }

  .bs-in-box {

  /* ===================== 第 3 岛第 3 关：长 / 短 ===================== */

  .ls-obj, .ls-animal { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

  .option.ls-opt .slot { padding: 6%; }
  .option.ls-drag-opt { touch-action: none; cursor: grab; }

  /* 题型 C：上方两个分类箱（长条 = 长，短条 = 短），都是投放目标 */
  .b3-box-row {

  function cloudLoad() {
    try {

      var d = JSON.parse(raw);
      cloud.token = (d && d.token) || '';
      cloud.gistId = (d && d.gistId) || '';
      cloud.lastSync = (d && d.lastSync) || 0;
      cloud.state = cloud.token ? 'idle' : 'off';
    } catch (e) { /* 忽略 */ }
  }

  function cloudPersist() {
    try {
      localStorage.setItem(CLOUD_KEY, JSON.stringify({

      }));
    } catch (e) { /* 忽略 */ }
  }

  function cloudCall(method, path, body) {
    var opts = {
      method: method,
      headers: {
        'Authorization': 'Bearer ' + cloud.token,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      cache: 'no-store'
    };
    if (body) opts.body = JSON.stringify(body);
    return fetch(CLOUD_API + path, opts).then(function (res) {
      if (!res.ok) {
        var err = new Error('HTTP ' + res.status);
        err.status = res.status;
        throw err;
      }
      return res.json();
    });
  }

  function normalizeProgress(raw) {
    var out = { unlockedIsland: 1, unlockedLevel: { 1: 1 }, cleared: {}, stars: {} };
    if (!raw || typeof raw !== 'object') return out;
    out.unlockedIsland = Math.max(1, Math.min(ISLANDS.length, raw.unlockedIsland | 0 || 1));

      Object.keys(raw.unlockedLevel).forEach(function (k) {
        var v = raw.unlockedLevel[k] | 0;
        if (v >= 1) out.unlockedLevel[k] = Math.min(LEVELS_PER_ISLAND, v);
      });
    }
    if (!out.unlockedLevel[1]) out.unlockedLevel[1] = 1;
    if (raw.cleared && typeof raw.cleared === 'object') {
      Object.keys(raw.cleared).forEach(function (k) {
        if (raw.cleared[k]) out.cleared[k] = true;
      });
    }
    if (raw.stars && typeof raw.stars === 'object') {
      Object.keys(raw.stars).forEach(function (k) {
        var v = raw.stars[k] | 0;
        if (v > 0) out.stars[k] = v;
      });
    }

    /* 自修复（解锁完整性校验，RULES §五）：
       解锁状态必须能从「已通关记录」推导出来——每座岛最多解锁到「已通关数 + 1」，
       整张地图最多解锁到「已全清岛数 + 1」。正常游玩数据天然满足该不变式
       （markCleared 先写 cleared 再推解锁）；若存档出现「全盘解锁却零通关」这类
       不可能数据（沙盒泄漏 / 手动篡改 / 云端 Gist 被污染），这里会将其钳制回与真实
       通关进度一致的状态，从而杜绝「一刀切全解锁」的回退 Bug，且不影响任何合法
       进度、不改动关卡内容与 UI。沙盒测试模式（devEnter）直接改写内存态、不经过本函数，故不受影响。 */
    var clearedInIsland = function (i) {
      var c = 0;
      for (var l = 1; l <= LEVELS_PER_ISLAND; l++) {
        if (out.cleared[i + '-' + l]) c++;
      }
      return c;
    };
    var fullyCleared = 0;
    for (var fi = 1; fi <= ISLANDS.length; fi++) {
      if (clearedInIsland(fi) >= LEVELS_PER_ISLAND) fullyCleared++;
    }
    out.unlockedIsland = Math.min(out.unlockedIsland, fullyCleared + 1);
    /* 仅对存档中原本就出现的岛做钳制；未出现的岛保持原样（由 isLevelUnlocked 的
       ||1 兜底，且该岛已被 unlockedIsland 锁住），避免凭空写入条目改变数据形态。 */
    Object.keys(out.unlockedLevel).forEach(function (k) {
      var i = +k;
      if (i >= 1 && i <= ISLANDS.length) {
        out.unlockedLevel[k] = Math.min(out.unlockedLevel[k], clearedInIsland(i) + 1);
      }
    });
    if (!out.unlockedLevel[1]) out.unlockedLevel[1] = 1;

    return out;
  }

  /** 合并（最高进度优先，RULES §五.9）：通关取并集，解锁取最远，星星取最高——进度只前进、绝不倒退 */
  function mergeProgress(local, remote) {
    var a = normalizeProgress(local);
    var b = normalizeProgress(remote);
    var out = { unlockedIsland: Math.max(a.unlockedIsland, b.unlockedIsland), unlockedLevel: {}, cleared: {}, stars: {} };

    Object.keys(a.unlockedLevel).concat(Object.keys(b.unlockedLevel)).forEach(function (k) {
      out.unlockedLevel[k] = Math.max(a.unlockedLevel[k] || 1, b.unlockedLevel[k] || 1);
    });
    out.unlockedLevel[1] = out.unlockedLevel[1] || 1;

    Object.keys(a.cleared).concat(Object.keys(b.cleared)).forEach(function (k) {
      if (a.cleared[k] || b.cleared[k]) out.cleared[k] = true;
    });

    Object.keys(a.stars).concat(Object.keys(b.stars)).forEach(function (k) {
      out.stars[k] = Math.max(a.stars[k] || 0, b.stars[k] || 0);
    });
    return out;
  }

  /** 把合并结果落回运行态并刷新界面 */
  function applyProgress(next) {
    progress = normalizeProgress(next);
    saveProgress();
    renderMap();
    if (view === 'island') renderIsland();
  }

  function totalStars() {
    var n = 0;
    Object.keys(progress.stars || {}).forEach(function (k) { n += progress.stars[k] | 0; });
    return n;
  }

  function cloudState(state, msg) {
    cloud.state = state;
    cloud.msg = msg || '';
    updateCloudBadge();
    updateCloudStatus();
  }

  function cloudFindGist() {
    return cloudCall('GET', '/gists?per_page=100').then(function (list) {
      for (var i = 0; i < list.length; i++) {
        if (list[i] && list[i].description === CLOUD_DESC) return list[i].id;
      }
      return null;
    });
  }

  function cloudCreateGist() {
    var payload = {
      description: CLOUD_DESC,
      public: false,
      files: {}
    };
    payload.files[CLOUD_FILE] = { content: JSON.stringify(progress) };
    return cloudCall('POST', '/gists', payload).then(function (g) { return g.id; });
  }

  function cloudReadGist() {
    return cloudCall('GET', '/gists/' + cloud.gistId).then(function (g) {
      var f = g.files && g.files[CLOUD_FILE];
      if (!f) return null;
      if (f.truncated && f.raw_url) {
        return fetch(f.raw_url, { cache: 'no-store' }).then(function (r) { return r.text(); })
          .then(function (t) { return JSON.parse(t); });
      }
      try { return JSON.parse(f.content); } catch (e) { return null; }
    });
  }

  function cloudWriteGist() {
    var payload = { files: {} };
    payload.files[CLOUD_FILE] = { content: JSON.stringify(progress) };
    return cloudCall('PATCH', '/gists/' + cloud.gistId, payload);
  }

  /** 拉取云端存档并与本地合并（云端是主，本地只作离线缓存） */
  function cloudPull() {
    if (dev.active) return Promise.resolve(false);   // 沙盒测试模式：切断云端拉取（RULES §五.10）
    if (!cloud.token || !cloud.gistId) return Promise.resolve(false);
    cloudState('syncing');
    return cloudReadGist().then(function (remote) {
      if (!remote) {
        // 云端还没有存档文件：把本地这份推上去
        return cloudWriteGist().then(function () { return true; });
      }
      var localNorm = normalizeProgress(progress);
      var remoteNorm = normalizeProgress(remote);
      var merged = mergeProgress(localNorm, remoteNorm);
      var changedLocal = JSON.stringify(merged) !== JSON.stringify(localNorm);
      var changedRemote = JSON.stringify(merged) !== JSON.stringify(remoteNorm);
      applyProgress(merged);
      cloud.lastSync = Date.now();
      cloudRetry = 0;
      cloudPersist();
      cloudState('synced');
      // 最高进度优先（RULES §五.9）：合并结果若比云端新（本地有云端没有的进度），
      // 必须立刻写回，绝不让另一台设备拉到旧数据——低进度设备也绝无机会覆盖高进度
      if (changedRemote) {
        return cloudWriteGist().then(function () { return true; });
      }
      return changedLocal;
    }).catch(function (err) {
      cloudState('error', err && err.status === 401 ? '令牌无效或已过期' : '同步失败，稍后自动重试');
      cloudRetryLater();
      return false;
    });
  }

  /**
   * 本地有更新：先读云端做一次合并，再写回去。
   * 直接 PATCH 会出事——另一台设备刚打的进度会被这台旧数据整个盖掉。
   */
  function cloudPush() {
    if (dev.active) return;                          // 沙盒测试模式：切断云端推送（RULES §五.10）
    if (!cloud.token || !cloud.gistId) return;
    if (cloud.busy) { cloudSchedulePush(); return; }
    cloud.busy = true;
    cloudState('syncing');
    cloudReadGist().then(function (remote) {
      var merged = mergeProgress(progress, remote);
      applyProgress(merged);
      return cloudWriteGist();
    }).then(function () {
      cloud.busy = false;
      cloud.lastSync = Date.now();
      cloudRetry = 0;
      cloudPersist();
      cloudState('synced');
    }).catch(function (err) {
      cloud.busy = false;
      cloudState('error', err && err.status === 401 ? '令牌无效或已过期' : '同步失败，稍后自动重试');
      cloudRetryLater();
    });
  }

  function cloudSchedulePush() {
    if (dev.active) return;                          // 沙盒测试模式：不安排任何推送（RULES §五.10）
    if (!cloud.token || !cloud.gistId) return;
    clearTimeout(cloud.timer);
    cloud.timer = setTimeout(function () { cloudPush(); }, 500);
  }

  /** 用令牌连接云存档：先找同名私有 Gist，没有就建一个 */
  function cloudConnect(token) {
    if (dev.active) {                                // 沙盒测试模式：禁止连接云端（RULES §五.10）
      toast('测试模式中，云端同步已暂停');
      return Promise.resolve(false);
    }
    token = (token || '').trim();
    if (!token) { cloudState('off', '请先粘贴访问令牌'); return Promise.resolve(false); }
    cloud.token = token;
    cloudState('syncing');
    return cloudCall('GET', '/user').then(function (me) {
      return cloudFindGist();
    }).then(function (id) {
      if (id) { cloud.gistId = id; return id; }
      return cloudCreateGist();
    }).then(function (id) {
      cloud.gistId = id;
      cloudPersist();
      return cloudReadGist();
    }).then(function (remote) {
      var merged = mergeProgress(progress, remote);
      applyProgress(merged);
      return cloudWriteGist().then(function () {
        cloud.lastSync = Date.now();
        cloudRetry = 0;
        cloudPersist();
        cloudState('synced', '已连接，进度已同步');
        cloudStartSilent();          // 之后全程静默，不再需要家长操作
        return true;
      });
    }).catch(function (err) {
      cloud.gistId = '';
      cloud.token = '';
      cloudPersist();
      var why = (err && err.status === 401)
        ? '令牌无效或权限不足（需要「云存档」读写权限）'
        : '连接失败，请检查网络后重试';
      cloudState('off', why);
      return false;
    });
  }

  function cloudDisconnect() {
    clearInterval(cloudPoll);
    cloudPoll = 0;
    cloud.token = '';
    cloud.gistId = '';
    cloud.lastSync = 0;
    cloudPersist();
    cloudState('off', '已断开云存档');
  }

  /* ---------------- 静默同步引擎（RULES §五.6） ----------------
     令牌只要填过一次，之后全在后台自己完成，家长再也不会被弹窗打扰：
       启动时拉一次 → 每次通关推一次 → 每 60 秒拉一次
       → 切回前台拉一次 → 网络恢复时推一次
     失败不弹窗、不打断游戏，按 15s / 30s / 60s / 120s 退避重试。
     令牌未配置时整个引擎不启动（云按钮保持「未开启」的灰点）。
  */
  function cloudSilentPull() {
    if (dev.active) return;                          // 沙盒测试模式：静默轮询也停（RULES §五.10）
    if (document.hidden) return;
    if (!cloud.token || !cloud.gistId || cloud.busy) return;
    cloudPull();
  }

  function cloudRetryLater() {
    if (!cloud.token || !cloud.gistId) return;
    if (cloudRetry >= 4) return;                    // 连续失败 4 次就安静下来，等下次联网/回前台
    var delay = [15000, 30000, 60000, 120000][cloudRetry] || 120000;
    cloudRetry++;
    setTimeout(function () {
      if (!cloud.token || !cloud.gistId) return;
      if (document.hidden) { cloudRetry--; return; }
      cloudPush();
    }, delay);
  }

  function cloudStartSilent() {
    clearInterval(cloudPoll);
    cloudPoll = 0;
    if (!cloud.token || !cloud.gistId) return;
    cloudPoll = setInterval(cloudSilentPull, CLOUD_POLL_MS);
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) cloudSilentPull();
  });
  window.addEventListener('online', function () {
    cloudRetry = 0;
    if (!cloud.token || !cloud.gistId) return;
    cloudPush();
  });

  function isIslandUnlocked(index) { return index <= progress.unlockedIsland; }

  /** 整座岛的 5 关是否全部通关 */
  function isIslandCleared(island) {
    for (var lv = 1; lv <= LEVELS_PER_ISLAND; lv++) {
      if (!progress.cleared[island + '-' + lv]) return false;
    }
    return true;
  }

  function isLevelUnlocked(island, level) {
    if (!isIslandUnlocked(island)) return false;
    if (island < progress.unlockedIsland) return true;
    return level <= (progress.unlockedLevel[island] || 1);
  }

  /** 通关推进：同岛解锁下一关；通关第 5 关则解锁下一岛。 */
  function markCleared(island, level) {
    progress.cleared[island + '-' + level] = true;
    if (level < LEVELS_PER_ISLAND) {
      progress.unlockedLevel[island] = Math.max(progress.unlockedLevel[island] || 1, level + 1);
    } else if (island < ISLANDS.length) {
      progress.unlockedIsland = Math.max(progress.unlockedIsland, island + 1);
      progress.unlockedLevel[island + 1] = Math.max(progress.unlockedLevel[island + 1] || 1, 1);
    }
    saveProgress();
    cloudSchedulePush();     // 本地先落盘，随后立刻同步云端（断网也不丢）
  }

  /* ---------------- 语音 ---------------- */

  /* ============================================================
     音频解锁（iOS / Safari 必需）
     ------------------------------------------------------------
     iOS 的自动播放策略：在「真实用户手势」发生之前，new Audio().play()
     一律被 NotAllowedError 拒绝，且不报错、不提示，外部表现就是
     「彻底没有声音」。WebAudio（叮声音效）同理，会一直 suspended。

     做法：在第一次触摸/点击的**捕获阶段**先播一个 0.05 秒的静音 WAV，
     把 HTMLAudio 与 AudioContext 一起解锁；之后所有语音可直接 play()。
     ============================================================ */

  /* 0.05 秒 / 8kHz / 8bit 单声道静音 WAV（444 字节） */
  var SILENT_WAV = 'data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';

  var audioUnlocked = false;

  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    /* 1) 解锁 WebAudio：必须真正 resume，否则 iOS 上 AudioContext 一直 suspended */
    try {
      var ctx = ensureCtx();
      if (ctx && ctx.state === 'suspended' && typeof ctx.resume === 'function') ctx.resume();
    } catch (e) { /* 音效失败不影响流程 */ }
    /* 2) 解锁 HTMLAudio：静音播放一次，音量不为 0（iOS 会把 0 当作 muted） */
    try {
      var el = new Audio(SILENT_WAV);
      el.setAttribute('playsinline', '');
      el.volume = 0.001;
      var p = el.play();
      if (p && typeof p.catch === 'function') p.catch(function () { /* 忽略 */ });
    } catch (e) { /* 忽略 */ }
  }

  /* capture + passive：最早拿到手势，且不干扰任何关卡自己的点击逻辑 */
  ['touchstart', 'pointerdown', 'mousedown', 'keydown', 'click'].forEach(function (t) {
    document.addEventListener(t, unlockAudio, { capture: true, passive: true });
  });

  function getAudio(key) {
    var bank = voiceBank();
    if (!Object.prototype.hasOwnProperty.call(bank, key)) return null;
    if (!cache.has(key)) {
      var el = new Audio(bank[key]);
      el.preload = 'auto';
      el.setAttribute('playsinline', '');
      cache.set(key, el);
    }
    return cache.get(key);
  }

  function setSpeaking(on) { btnReplay.classList.toggle('speaking', !!on); }

  function clearGuard() {
    if (guardTimer) { clearTimeout(guardTimer); guardTimer = null; }
  }

  function stop() {
    clearGuard();
    setSpeaking(false);
    if (!current) return;
    var el = current;
    current = null;
    el.onended = null;
    el.onerror = null;
    try { el.pause(); } catch (e) { /* 忽略 */ }
    try { el.currentTime = 0; } catch (e) { /* 忽略 */ }
  }

  function speak(key, onDone) {
    var el = getAudio(key);
    if (!el) return false;

    stop();
    lastKey = key;
    current = el;
    setSpeaking(true);

    var finished = false;
    function finish() {
      if (finished) return;
      finished = true;
      clearGuard();
      if (current === el) { current = null; setSpeaking(false); }
      if (onDone) onDone();
    }

    el.onended = finish;
    el.onerror = finish;
    try { el.currentTime = 0; } catch (e) { /* 忽略 */ }

    var dur = (isFinite(el.duration) && el.duration > 0) ? el.duration * 1000 : 8000;
    guardTimer = setTimeout(finish, dur + 1600);

    var p = el.play();
    if (p && typeof p.catch === 'function') {
      p.catch(function (err) {
        /*
         * iOS 在尚未解锁时会把 play() 拒绝为 NotAllowedError。
         * 这里不能只 finish()：要把解锁标记复位并重新挂监听，
         * 否则本次手势之后的所有语音都会永久静默。
         */
        if (err && err.name === 'NotAllowedError') audioUnlocked = false;
        finish();
      });
    }
    return true;
  }

  function say(keys, onDone) {
    var list = Array.isArray(keys) ? keys.slice() : [keys];
    var myToken = ++speakToken;
    var i = 0;
    function step() {
      if (myToken !== speakToken) return;
      if (i >= list.length) { if (onDone) onDone(); return; }
      var key = list[i++];
      if (!speak(key, step)) step();
    }
    step();
  }

  /* ---------------- 叮声音效（WebAudio 合成） ---------------- */

  var audioCtx = null;

  function ensureCtx() {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function beep(freq, delay, dur, peak, type) {
    try {
      var ctx = ensureCtx();
      if (!ctx) return;
      var t0 = ctx.currentTime + delay;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type || 'triangle';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(peak, t0 + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    } catch (e) { /* 音效失败不影响流程 */ }
  }

  /* 答对：短促清脆的金币音（B5 → E6），无任何语音 */
  function coin() {
    beep(987.77, 0, 0.09, 0.2, 'triangle');
    beep(1318.51, 0.075, 0.24, 0.18, 'triangle');
  }

  /* 星星落位：极轻的一声高频 ting */
  function ting() {
    beep(2093, 0, 0.16, 0.07, 'sine');
  }

  /* ---------------- 全局公共函数：中文通关鼓励 ---------------- */

  var lastPraise = -1;

  /**
   * 随机播放一句中文鼓励（豆包 2.0 中文女童音，构建期一次性生成）。
   * 任何关卡通关都必须调用本函数，不得改用其他语音引擎。
   */
  function playRandomPraise(onDone) {
    var index = Math.floor(Math.random() * PRAISE_KEYS.length);
    if (index === lastPraise) index = (index + 1) % PRAISE_KEYS.length;
    lastPraise = index;
    return say([PRAISE_KEYS[index]], onDone);
  }

  window.playRandomPraise = playRandomPraise;

  /* ---------------- 全局公共函数：英文通关夸奖（与学科无关，RULES §1.11） ---------------- */

  /*
   * 历史坑：这里以前把「数学小明星」写死在英文夸奖里，进了形状岛、动物岛就完全不合理。
   * 现在固定 3 句通用语随机播，任何岛、任何关卡都复用同一套，不再新增语音。
   */
  var WIN_KEYS = ['win1', 'win2', 'win3'];
  var lastWin = -1;

  function playLevelComplete(onDone) {
    var index = Math.floor(Math.random() * WIN_KEYS.length);
    if (index === lastWin) index = (index + 1) % WIN_KEYS.length;
    lastWin = index;
    return say([WIN_KEYS[index]], onDone);
  }

  window.playLevelComplete = playLevelComplete;

  /* ---------------- 通用交互 ---------------- */

  function toast(message) {
    toastEl.textContent = message;
    toastEl.hidden = false;
    if (toast.timer) clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { toastEl.hidden = true; }, 1500);
  }

  function playComingSoon() { say(['coming']); }

  /* ---------------- 视图切换 ---------------- */

  var view = 'map';
  var currentIsland = 0;

  function showScreen(name) {
    view = name;
    document.body.dataset.view = name;   // 关卡内隐藏云存档按钮，把顶栏留给 12 颗星
    screenMap.hidden = name !== 'map';

  /* ---------------- 地图 ---------------- */

  function renderMap() {
    clearIslandFlag();          // 离开关卡时把舞台上的通关旗收掉，否则会飘到地图上

    var st = document.getElementById('starTotal');
    if (st) {
      var n = totalStars();
      st.hidden = n <= 0;
      st.textContent = n > 0 ? '已收集 ' + n + ' 颗星' : '';
    }

    islandGrid.innerHTML = '';
    ISLANDS.forEach(function (island, i) {
      var index = i + 1;
      var unlocked = isIslandUnlocked(index);
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'island ' + (unlocked ? 'unlocked' : 'locked');
      if (unlocked && index === progress.unlockedIsland) card.classList.add('current');
      card.dataset.island = String(index);
      card.setAttribute('aria-label', '第' + index + '岛 ' + island.name);

      var num = document.createElement('span');
      num.className = 'num';
      num.textContent = String(index);

      var icon = document.createElement('span');
      icon.className = 'icon';
      icon.appendChild(islandIconNode(index, island));

      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = island.name;

      card.appendChild(num);
      card.appendChild(icon);
      card.appendChild(name);

      // 整岛 5 关全部通关 → 地图上亮起通关小旗
      if (isIslandCleared(index)) {
        card.classList.add('cleared');
        var flag = document.createElement('span');
        flag.className = 'island-flag-badge';
        flag.appendChild(svgIcon('flag'));
        flag.setAttribute('aria-hidden', 'true');
        card.appendChild(flag);
      }

      if (!unlocked) {
        var lock = document.createElement('span');
        lock.className = 'lock';
        lock.textContent = '🔒';
        card.appendChild(lock);
      }

      card.addEventListener('click', function () {
        if (!unlocked) {
          card.classList.remove('tapped');
          void card.offsetWidth;
          card.classList.add('tapped');
          playComingSoon();
          return;
        }
        enterIsland(index);
      });

      islandGrid.appendChild(card);
    });
  }

  /* ---------------- 岛屿内页 ---------------- */

  function enterIsland(index) {
    currentIsland = index;
    showScreen('island');

  /* 可玩关卡登记表：新增关卡只往这里加一行（RULES §三.5） */
  var LEVEL_DEFS = {
    '1-1': { numbers: NUMBERS,    make: null,     title: '第 1 关' },

    '2-4': { numbers: null,       make: 'makeP4', title: '第 4 关', tutorial: true },

    '4-1': { numbers: null,       make: 'makeF1', title: '第 1 关', tutorial: true },
