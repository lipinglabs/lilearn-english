<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#fdf6ea" />
<title>英语启蒙乐园</title>
<style>
  /* ==========================================================
     设计基调：柔和线条、温暖打光、温和过渡（见 RULES.md）
     ========================================================== */
  *,
  *::before,
  *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #5b4a3f;
    --ink-soft: #93806f;
    --gold: #e9a13b;
    --line: rgba(196, 168, 138, .26);
    --shadow-soft: 0 10px 26px rgba(176, 146, 116, .13);
    --shadow-lift: 0 16px 34px rgba(176, 146, 116, .18);
  }

  html, body { height: 100%; }

  body {
    height: 100dvh;
    min-height: 100dvh;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: clamp(6px, 1.4vh, 16px);
    padding: clamp(8px, 1.6vh, 18px) clamp(10px, 2.4vw, 30px) clamp(10px, 2.2vh, 24px);
    font-family: "Yuanti SC", "幼圆", "YouYuan", "PingFang SC", "Microsoft YaHei", system-ui,
      "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(120vmin 78vmin at 50% -12%, #fffaf0 0%, rgba(255, 250, 240, 0) 62%),
      linear-gradient(180deg, #fdf7ec 0%, #f8f2e7 46%, #eef5ef 100%);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  [hidden] { display: none !important; }

  /* ===================== 背景 ===================== */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }

  .bg::before {
    content: "";
    position: absolute;
    top: -30vmin;
    left: 50%;
    transform: translateX(-50%);
    width: 140vmin;
    height: 90vmin;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 236, 198, .55) 0%, rgba(255, 236, 198, 0) 66%);
    animation: warm-breathe 9s ease-in-out infinite;
  }

  @keyframes warm-breathe {
    0%, 100% { opacity: .85; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.04); }
  }

  .cloud {
    --s: 1;
    position: absolute;
    left: -45vmin;
    width: 18vmin;
    height: 6.4vmin;
    background: #fff;
    border-radius: 999px;
    opacity: .78;
    animation: drift linear infinite;
  }

  .cloud::before,
  .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }

  .cloud::before { width: 9.2vmin; height: 9.2vmin; left: 2.4vmin; top: -4.6vmin; }
  .cloud::after { width: 6.4vmin; height: 6.4vmin; right: 3.2vmin; top: -3.2vmin; }

  .cloud.c1 { --s: .82; top: 10%; opacity: .8; animation-duration: 86s; }
  .cloud.c2 { --s: 1.18; top: 30%; opacity: .5; animation-duration: 116s; animation-delay: -38s; }
  .cloud.c3 { --s: .66; top: 52%; opacity: .42; animation-duration: 140s; animation-delay: -80s; }

  @keyframes drift {
    from { transform: translateX(0) scale(var(--s)); }
    to { transform: translateX(calc(100vw + 60vmin)) scale(var(--s)); }
  }

  .hills { position: absolute; left: 0; right: 0; bottom: 0; height: 30vh; }

  .hill { position: absolute; bottom: 0; border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
  .hill.h1 { left: -12vw; width: 74vw; height: 20vh; background: #e6f0dd; opacity: .62; }
  .hill.h2 { right: -14vw; width: 70vw; height: 15vh; background: #dcecd6; opacity: .7; }

  .grass {
    position: absolute;
    left: -6vw;
    right: -6vw;
    bottom: -7vh;
    height: 12vh;
    background: #d9ebcf;
    border-radius: 46% 46% 0 0 / 60% 60% 0 0;
    opacity: .75;
  }

  /* ===================== 顶栏 ===================== */
  .topbar {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: clamp(6px, 1.6vw, 16px);
    min-height: clamp(40px, 6.4vh, 58px);
  }

  .icon-btn {
    flex: none;
    width: clamp(38px, 6vh, 54px);
    height: clamp(38px, 6vh, 54px);
    display: grid;
    place-items: center;
    border: 2px solid rgba(255, 255, 255, .95);
    border-radius: 50%;
    background: rgba(255, 255, 255, .82);
    box-shadow: var(--shadow-soft);
    font-size: clamp(16px, 2.5vh, 22px);
    line-height: 1;
    color: var(--ink);
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease;
  }

  .icon-btn:active { transform: scale(.92); box-shadow: 0 4px 12px rgba(176, 146, 116, .16); }

  .icon-btn.ringing { animation: ring .6s ease; }
  .icon-btn.speaking { animation: speak-pulse 1.1s ease-in-out infinite; }

  @keyframes ring {
    0% { transform: scale(1); }
    40% { transform: scale(1.12) rotate(-5deg); }
    70% { transform: scale(.97) rotate(3deg); }
    100% { transform: scale(1) rotate(0); }
  }

  @keyframes speak-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(233, 187, 120, .5); transform: scale(1); }
    50% { box-shadow: 0 0 0 10px rgba(233, 187, 120, 0); transform: scale(1.05); }
  }

  .bar-mid { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }

  .stars {
    display: flex;
    align-items: center;
    gap: clamp(1px, .6vw, 5px);
    padding: clamp(3px, .5vh, 7px) clamp(6px, 1.4vw, 14px);
    border-radius: 999px;
    background: rgba(255, 255, 255, .7);
    box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .95), var(--shadow-soft);
  }

  .star {
    font-size: clamp(12px, min(2.3vh, 2.1vw), 20px);
    line-height: 1;
    filter: grayscale(1) opacity(.26);
    transition: filter .3s ease;
  }

  .star.on {
    filter: none;
    animation: star-bounce .62s cubic-bezier(.2, 1.8, .42, 1) both;
  }

  @keyframes star-bounce {
    0% { transform: scale(.5); }
    45% { transform: scale(1.55) rotate(10deg); }
    70% { transform: scale(.92) rotate(-4deg); }
    100% { transform: scale(1) rotate(0); }
  }

  /* ===================== 舞台 ===================== */
  .stage {
    position: relative;
    z-index: 1;
    min-height: 0;
    border: 2px solid rgba(255, 255, 255, .9);
    border-radius: clamp(24px, 4vmin, 44px);
    background: linear-gradient(180deg, rgba(255, 255, 255, .9), rgba(255, 252, 246, .74));
    box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255, 255, 255, .9);
    overflow: hidden;
  }

  .screen {
    width: 100%;
    height: 100%;
    padding: clamp(10px, 2.4vmin, 26px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 1.8vh, 20px);
    overflow: hidden;
    scrollbar-width: none;
  }

  #screenMap { justify-content: flex-start; }

  .screen::-webkit-scrollbar { display: none; }

  .screen-title {
    font-size: clamp(15px, 3.4vmin, 26px);
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--ink-soft);
    flex: none;
  }

  /* ===================== 地图 ===================== */
  .island-grid {
    width: 100%;
    max-width: 720px;
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-auto-rows: minmax(0, 1fr);
    gap: clamp(6px, 1.4vw, 14px);
  }

  .island {
    position: relative;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6%;
    border-radius: clamp(16px, 2.6vmin, 26px);
    background: linear-gradient(180deg, #ffffff, #fffaf1);
    border: 2px solid rgba(255, 255, 255, .95);
    box-shadow: var(--shadow-soft);
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease, filter .3s ease;
    overflow: hidden;
  }

  .island:active { transform: scale(.96); }

  .island.tapped { animation: island-tap .42s ease; }

  @keyframes island-tap {
    0%, 100% { transform: scale(1) rotate(0); }
    30% { transform: scale(.94) rotate(-1.5deg); }
    65% { transform: scale(.97) rotate(1.5deg); }
  }

  .island .num {
    position: absolute;
    top: 7%;
    left: 9%;
    font-size: clamp(10px, 2.4vmin, 16px);
    font-weight: 800;
    color: #cbb094;
  }

  .island .icon { font-size: clamp(22px, 6.4vw, 44px); line-height: 1; }

  .island .name {
    font-size: clamp(9px, 2.3vw, 14px);
    color: var(--ink-soft);
    text-align: center;
    padding: 0 6%;
    line-height: 1.2;
  }

  .island.locked {
    background: linear-gradient(180deg, #f4f1ec, #eae6de);
    filter: grayscale(.9);
    opacity: .82;
  }

  .island .lock {
    position: absolute;
    right: 7%;
    bottom: 6%;
    display: grid;
    place-items: center;
    font-size: clamp(11px, 2.8vw, 18px);
    padding: .18em .26em;
    border-radius: 999px;
    background: rgba(255, 255, 255, .82);
    box-shadow: 0 3px 8px rgba(150, 130, 110, .18);
  }

  .island.current {
    box-shadow: 0 0 0 2.5px rgba(233, 161, 59, .5), var(--shadow-lift);
    animation: island-breathe 2.8s ease-in-out infinite;
  }

  @keyframes island-breathe {
    0%, 100% { box-shadow: 0 0 0 2.5px rgba(233, 161, 59, .42), var(--shadow-soft); }
    50% { box-shadow: 0 0 0 4px rgba(233, 161, 59, .22), var(--shadow-lift); }
  }

  /* ===================== 岛屿内页 ===================== */
  .island-head { display: flex; align-items: center; gap: clamp(6px, 1.6vw, 12px); flex: none; }
  .island-head .big-icon { font-size: clamp(26px, 7vmin, 46px); line-height: 1; }
  .island-head .titles { display: flex; flex-direction: column; gap: 2px; }
  .island-head .t1 { font-size: clamp(14px, 3.2vmin, 24px); font-weight: 800; }
  .island-head .t2 { font-size: clamp(10px, 2.4vmin, 15px); color: var(--ink-soft); }

  .node-list {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(6px, 1.4vh, 12px);
    flex: none;
  }

  .node-row { display: flex; align-items: center; gap: clamp(8px, 2vw, 16px); }
  .node-row:nth-child(odd) { transform: translateX(-8%); }
  .node-row:nth-child(even) { transform: translateX(8%); }

  .node {
    position: relative;
    width: clamp(50px, 10.4vh, 74px);
    height: clamp(50px, 10.4vh, 74px);
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, .95);
    background: linear-gradient(180deg, #ffffff, #fff7ea);
    box-shadow: var(--shadow-soft);
    font-size: clamp(17px, 3.8vh, 26px);
    font-weight: 800;
    color: var(--gold);
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease;
  }

  .node:active { transform: scale(.93); }

  .node.locked {
    background: linear-gradient(180deg, #f3f0ea, #e8e4dc);
    color: #b3a89a;
    filter: grayscale(.85);
    font-size: clamp(14px, 3vh, 20px);
  }

  .node.done { background: linear-gradient(180deg, #fff6e0, #ffe9bf); }

  .node.playable {
    box-shadow: 0 0 0 3px rgba(233, 161, 59, .34), var(--shadow-lift);
    animation: node-breathe 2.6s ease-in-out infinite;
  }

  @keyframes node-breathe {
    0%, 100% { box-shadow: 0 0 0 3px rgba(233, 161, 59, .3), var(--shadow-soft); }
    50% { box-shadow: 0 0 0 7px rgba(233, 161, 59, .14), var(--shadow-lift); }
  }

  .node-label { font-size: clamp(9px, 2.2vmin, 13px); color: var(--ink-soft); min-width: 3.4em; }
  .node-label.right { text-align: left; }
  .node-label.left { text-align: right; }

  .path-line {
    width: 2px;
    height: clamp(8px, 1.8vh, 16px);
    background: repeating-linear-gradient(180deg, var(--line) 0 4px, transparent 4px 8px);
    flex: none;
  }

  /* ===================== 关卡 ===================== */
  .view {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 1.6vh, 20px);
    max-width: 100%;
    max-height: 100%;
  }

  .start-btn {
    border: 2px solid rgba(255, 255, 255, .95);
    padding: clamp(15px, 2.4vh, 26px) clamp(38px, 7vmin, 80px);
    border-radius: 999px;
    background: linear-gradient(180deg, #ffe6b8, #ffc978);
    color: #7a5320;
    font-family: inherit;
    font-weight: 800;
    font-size: clamp(24px, 4.4vmin, 44px);
    letter-spacing: .1em;
    cursor: pointer;
    box-shadow: 0 12px 26px rgba(228, 168, 82, .28), inset 0 1px 0 rgba(255, 255, 255, .8);
    transition: transform .16s ease, box-shadow .16s ease;
    animation: start-breathe 3s ease-in-out infinite;
  }

  .start-btn:active { transform: scale(.96); }

  @keyframes start-breathe {
    0%, 100% { box-shadow: 0 12px 26px rgba(228, 168, 82, .26), inset 0 1px 0 rgba(255, 255, 255, .8); }
    50% { box-shadow: 0 16px 40px rgba(228, 168, 82, .4), inset 0 1px 0 rgba(255, 255, 255, .8); }
  }

  .ask-display { display: grid; place-items: center; max-width: 100%; max-height: 100%; }

  .num-bubble {
    display: grid;
    place-items: center;
    padding: clamp(6px, 1.4vh, 18px) clamp(24px, 5vw, 60px);
    border-radius: clamp(20px, 3.6vmin, 38px);
    background: linear-gradient(180deg, #ffffff, #fff6e6);
    border: 2px solid rgba(255, 213, 150, .9);
    box-shadow: 0 12px 28px rgba(196, 158, 108, .18), inset 0 -4px 0 rgba(255, 226, 176, .5);
    font-weight: 900;
    font-size: clamp(88px, min(32vw, 25vh), 220px);
    line-height: 1.04;
    color: #e08a3c;
    animation: pop .5s cubic-bezier(.2, 1.6, .42, 1) both;
  }

  .pile { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; line-height: 1.06; margin: 0 auto; }
  .pile span { flex: none; width: 1em; text-align: center; }

  .pile-display {
    max-width: 5.04em;
    font-size: clamp(15px, min(11vw, 7.4vh), 62px);
    filter: drop-shadow(0 5px 8px rgba(150, 120, 80, .14));
    animation: pop .5s cubic-bezier(.2, 1.6, .42, 1) both;
  }

  .target-wrap { position: relative; display: grid; place-items: center; animation: pop .5s cubic-bezier(.2, 1.6, .42, 1) both; }

  .target-fruit {
    font-size: clamp(92px, min(38vw, 24vh), 220px);
    line-height: 1;
    filter: drop-shadow(0 10px 14px rgba(198, 152, 92, .2));
  }

  .target-badge {
    position: absolute;
    right: -4%;
    bottom: -2%;
    font-size: clamp(26px, min(6.6vw, 6vh), 54px);
    filter: drop-shadow(0 4px 6px rgba(120, 100, 80, .2));
    animation: badge-wiggle 2.6s ease-in-out infinite;
  }

  @keyframes badge-wiggle {
    0%, 100% { transform: rotate(-7deg) scale(1); }
    50% { transform: rotate(7deg) scale(1.06); }
  }

  @keyframes pop {
    0% { opacity: 0; transform: scale(.55); }
    62% { opacity: 1; transform: scale(1.06); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* ===================== 选项 ===================== */
  .options {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 3vw, 30px);
    transition: opacity .3s ease;
  }

  .options.off { opacity: 0; pointer-events: none; }
  .options.gone { display: none; }

  .option {
    position: relative;
    width: min(clamp(84px, 21vh, 168px), 27vw);
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
    border: 2px solid rgba(255, 255, 255, .95);
    border-radius: clamp(18px, 3vmin, 30px);
    background: rgba(255, 255, 255, .9);
    box-shadow: var(--shadow-soft);
    cursor: pointer;
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    container-type: size;
  }

  .option[data-idx="0"] { background: linear-gradient(180deg, #fff8f4, #ffece4); }
  .option[data-idx="1"] { background: linear-gradient(180deg, #f8fbff, #e8f3fb); }
  .option[data-idx="2"] { background: linear-gradient(180deg, #f9fff4, #ecf8e6); }

  .option:active { transform: scale(.95); }

  .slot {
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
    font-size: clamp(32px, min(14vw, 10vh), 68px);
    line-height: 1;
  }

  .option.num-opt .slot {
    font-weight: 900;
    color: #6f8fa6;
    font-size: clamp(34px, 14vh, 78px);
    font-size: 40cqw;
  }

  /* 方案B：果堆 + 巨大数字标签 */
  .option.pile-opt .slot { padding: 6% 6% 22% 6%; }

  .pile-opt {
    max-width: 4.04em;
    font-size: clamp(8px, 2.8vw, 22px);
    font-size: 15cqw;
  }

  .pile-num {
    position: absolute;
    right: -4%;
    bottom: -5%;
    padding: .04em .34em;
    border-radius: clamp(10px, 2.2vmin, 18px);
    background: linear-gradient(180deg, #ffffff, #fff6e8);
    border: 2px solid #ffe0b4;
    box-shadow: 0 8px 18px rgba(186, 146, 96, .24);
    font-size: clamp(20px, 9vh, 46px);
    font-size: 38cqw;
    font-weight: 900;
    line-height: 1.06;
    color: #e08a3c;
    pointer-events: none;
  }

  .hint-hand {
    position: absolute;
    left: 50%;
    bottom: 2%;
    transform: translateX(-50%);
    font-size: clamp(16px, 4vmin, 30px);
    filter: drop-shadow(0 3px 5px rgba(120, 100, 80, .3));
    animation: hand-flash 1.15s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes hand-flash {
    0%, 100% { opacity: .3; transform: translateX(-50%) translateY(3px) scale(.9); }
    50% { opacity: 1; transform: translateX(-50%) translateY(-3px) scale(1.1); }
  }

  .option.right {
    background: linear-gradient(180deg, #f2fff4, #dff7e4);
    transform: scale(1.06);
    box-shadow: 0 0 0 4px rgba(143, 201, 160, .55), 0 0 34px 6px rgba(143, 201, 160, .34);
    animation: right-burst .62s cubic-bezier(.2, 1.6, .4, 1);
  }

  @keyframes right-burst {
    0% { transform: scale(.97); }
    55% { transform: scale(1.13); }
    100% { transform: scale(1.06); }
  }

  .option.wrong {
    background: #fff5f2;
    box-shadow: 0 0 0 3px rgba(240, 160, 150, .45);
    animation: shake .52s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0) rotate(0); }
    15% { transform: translateX(-8px) rotate(-2deg); }
    35% { transform: translateX(8px) rotate(2deg); }
    55% { transform: translateX(-6px) rotate(-1.5deg); }
    75% { transform: translateX(6px) rotate(1.5deg); }
  }

  /* ===================== 结算 ===================== */
  .trophy-wrap { display: grid; place-items: center; position: relative; animation: pop .62s cubic-bezier(.2, 1.6, .42, 1) both; }

  .trophy-wrap::before {
    content: "";
    position: absolute;
    width: 152%;
    height: 152%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 224, 158, .6) 0%, rgba(255, 224, 158, 0) 68%);
    animation: glow-pulse 2.6s ease-in-out infinite;
  }

  @keyframes glow-pulse {
    0%, 100% { transform: scale(.92); opacity: .8; }
    50% { transform: scale(1.1); opacity: 1; }
  }

  .trophy {
    position: relative;
    font-size: clamp(100px, min(28vw, 26vh), 240px);
    line-height: 1;
    filter: drop-shadow(0 12px 16px rgba(196, 158, 60, .38));
    animation: trophy-float 2.8s ease-in-out infinite;
  }

  @keyframes trophy-float {
    0%, 100% { transform: translateY(0) rotate(-1.5deg); }
    50% { transform: translateY(-10px) rotate(1.5deg); }
  }

  .restart-btn {
    width: clamp(60px, 9.4vh, 90px);
    height: clamp(60px, 9.4vh, 90px);
    display: grid;
    place-items: center;
    border: 2px solid rgba(255, 255, 255, .95);
    border-radius: 50%;
    background: linear-gradient(180deg, #ffffff, #f2f9ff);
    box-shadow: 0 10px 22px rgba(150, 170, 190, .22);
    font-size: clamp(26px, 4.6vh, 40px);
    line-height: 1;
    cursor: pointer;
    transition: transform .16s ease;
    animation: restart-nudge 3s ease-in-out infinite;
  }

  .restart-btn:active { transform: scale(.94); }

  @keyframes restart-nudge {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  /* ===================== 彩带 / 飞星 / 提示 ===================== */
  .confetti { position: fixed; inset: 0; z-index: 6; overflow: hidden; pointer-events: none; }

  .confetti i {
    position: absolute;
    top: -12vh;
    display: block;
    border-radius: 3px;
    opacity: .92;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  @keyframes fall {
    0% { transform: translate3d(0, -12vh, 0) rotate(0deg); }
    100% { transform: translate3d(0, 118vh, 0) rotate(680deg); }
  }

  .fly-layer { position: fixed; inset: 0; z-index: 7; pointer-events: none; }

  .fly-star {
    position: absolute;
    font-size: clamp(20px, 4.4vh, 34px);
    line-height: 1;
    filter: drop-shadow(0 4px 8px rgba(220, 170, 70, .5));
    will-change: transform;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 12vh;
    transform: translateX(-50%);
    z-index: 8;
    padding: 10px 22px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .96);
    border: 2px solid rgba(255, 228, 190, .9);
    box-shadow: var(--shadow-lift);
    font-size: clamp(13px, 2.4vh, 17px);
    color: var(--ink-soft);
    animation: toast-in .32s cubic-bezier(.2, 1.5, .4, 1) both;
  }

  @keyframes toast-in {
    from { opacity: 0; transform: translateX(-50%) translateY(10px) scale(.94); }
    to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }

  /* 横屏矮屏 */
  @media (max-height: 560px) {
    body { gap: 6px; padding: 8px 14px 10px; }
    .screen { gap: 4px; padding: 8px; }
    .island-grid { gap: 6px; }
    .options { gap: 12px; }
    .node { width: clamp(38px, 8vh, 52px); height: clamp(38px, 8vh, 52px); font-size: clamp(13px, 3vh, 18px); }
    .path-line { height: 6px; }
    .node-list { gap: 3px; }
    .island-head .big-icon { font-size: clamp(20px, 5vmin, 30px); }
    .island-head .t1 { font-size: clamp(12px, 3vmin, 17px); }
    .island-head .t2 { font-size: 10px; }
  }
</style>

<script>
/* ============================================================
   英语启蒙乐园 · 全局框架
   ============================================================ */
(function () {
  'use strict';

  var bank = window.VOICE_BANK || {};
  var cache = new Map();
  var current = null;
  var lastKey = null;
  var guardTimer = null;
  var speakToken = 0;

  var NUMBERS = [11, 12, 13, 14, 15];
  var FRUITS = [
    { id: 'apple', emoji: '🍎' },
    { id: 'banana', emoji: '🍌' },
    { id: 'strawberry', emoji: '🍓' },
    { id: 'grape', emoji: '🍇' }
  ];
  var TOTAL_ROUNDS = 12;
  var HINT_ROUNDS = 3;
  var LEVELS_PER_ISLAND = 5;

  var ISLANDS = [
    { icon: '🍎', name: '数字与水果' },
    { icon: '🎨', name: '颜色与形状' },
    { icon: '🐼', name: '动物朋友' },
    { icon: '✋', name: '身体部位' },
    { icon: '🚌', name: '交通工具' },
    { icon: '🍰', name: '食物与饮料' },
    { icon: '☀️', name: '天气与季节' },
    { icon: '👨‍👩‍👧', name: '家庭成员' },
    { icon: '👕', name: '衣物穿戴' },
    { icon: '🏠', name: '家居房间' },
    { icon: '⚽', name: '动作运动' },
    { icon: '🎉', name: '节日庆祝' }
  ];

  var PRAISE_KEYS = ['praise_1', 'praise_2', 'praise_3', 'praise_4', 'praise_5', 'praise_6'];

  var btnBack = document.getElementById('btnBack');
  var btnReplay = document.getElementById('btnReplay');
  var starsBox = document.getElementById('stars');
  var screenMap = document.getElementById('screenMap');
  var screenIsland = document.getElementById('screenIsland');
  var screenLevel = document.getElementById('screenLevel');
  var islandGrid = document.getElementById('islandGrid');
  var islandHead = document.getElementById('islandHead');
  var nodeList = document.getElementById('nodeList');
  var viewStart = document.getElementById('viewStart');
  var viewAsk = document.getElementById('viewAsk');
  var viewDone = document.getElementById('viewDone');
  var askDisplay = document.getElementById('askDisplay');
  var optionsBar = document.getElementById('options');
  var optionEls = Array.prototype.slice.call(document.querySelectorAll('.option'));
  var btnStart = document.getElementById('btnStart');
  var btnRestart = document.getElementById('btnRestart');
  var confettiBox = document.getElementById('confetti');
  var flyLayer = document.getElementById('flyLayer');
  var toastEl = document.getElementById('toast');

  /* ---------------- 进度存档 ---------------- */

  var STORE_KEY = 'lilearn.progress.v1';
  var progress = { unlockedIsland: 1, unlockedLevel: { 1: 1 }, cleared: {} };

  function loadProgress() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (!data || typeof data !== 'object') return;
      progress.unlockedIsland = Math.max(1, Math.min(ISLANDS.length, data.unlockedIsland | 0));
      progress.unlockedLevel = (data.unlockedLevel && typeof data.unlockedLevel === 'object') ? data.unlockedLevel : { 1: 1 };
      progress.cleared = (data.cleared && typeof data.cleared === 'object') ? data.cleared : {};
      if (!progress.unlockedLevel[1]) progress.unlockedLevel[1] = 1;
    } catch (e) { /* 存档损坏则用默认值 */ }
  }

  function saveProgress() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) { /* 忽略 */ }
  }

  function isIslandUnlocked(index) { return index <= progress.unlockedIsland; }

  function isLevelUnlocked(island, level) {
    if (!isIslandUnlocked(island)) return false;
    if (island < progress.unlockedIsland) return true;
    return level <= (progress.unlockedLevel[island] || 1);
  }

  /** 通关推进：同岛解锁下一关；通关第 5 关则解锁下一岛。 */
  function markCleared(island, level) {
    progress.cleared[island + '-' + level] = true;
    if (level < LEVELS_PER_ISLAND) {
      progress.unlockedLevel[island] = Math.max(progress.unlockedLevel[island] || 1, level + 1);
    } else if (island < ISLANDS.length) {
      progress.unlockedIsland = Math.max(progress.unlockedIsland, island + 1);
      progress.unlockedLevel[island + 1] = Math.max(progress.unlockedLevel[island + 1] || 1, 1);
    }
    saveProgress();
  }

  /* ---------------- 语音 ---------------- */

  function getAudio(key) {
    if (!Object.prototype.hasOwnProperty.call(bank, key)) return null;
    if (!cache.has(key)) {
      var el = new Audio(bank[key]);
      el.preload = 'auto';
      el.setAttribute('playsinline', '');
      cache.set(key, el);
    }
    return cache.get(key);
  }

  function setSpeaking(on) { btnReplay.classList.toggle('speaking', !!on); }

  function clearGuard() {
    if (guardTimer) { clearTimeout(guardTimer); guardTimer = null; }
  }

  function stop() {
    clearGuard();
    setSpeaking(false);
    if (!current) return;
    var el = current;
    current = null;
    el.onended = null;
    el.onerror = null;
    try { el.pause(); } catch (e) { /* 忽略 */ }
    try { el.currentTime = 0; } catch (e) { /* 忽略 */ }
  }

  function speak(key, onDone) {
    var el = getAudio(key);
    if (!el) return false;

    stop();
    lastKey = key;
    current = el;
    setSpeaking(true);

    var finished = false;
    function finish() {
      if (finished) return;
      finished = true;
      clearGuard();
      if (current === el) { current = null; setSpeaking(false); }
      if (onDone) onDone();
    }

    el.onended = finish;
    el.onerror = finish;
    try { el.currentTime = 0; } catch (e) { /* 忽略 */ }

    var dur = (isFinite(el.duration) && el.duration > 0) ? el.duration * 1000 : 8000;
    guardTimer = setTimeout(finish, dur + 1600);

    var p = el.play();
    if (p && typeof p.catch === 'function') p.catch(finish);
    return true;
  }

  function say(keys, onDone) {
    var list = Array.isArray(keys) ? keys.slice() : [keys];
    var myToken = ++speakToken;
    var i = 0;
    function step() {
      if (myToken !== speakToken) return;
      if (i >= list.length) { if (onDone) onDone(); return; }
      var key = list[i++];
      if (!speak(key, step)) step();
    }
    step();
  }

  /* ---------------- 叮声音效（WebAudio 合成） ---------------- */

  var audioCtx = null;

  function ding() {
    try {
      if (!audioCtx) {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var now = audioCtx.currentTime;
      [[1180, .2], [1760, .13]].forEach(function (pair) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(pair[0], now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(pair[1], now + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.6);
      });
    } catch (e) { /* 音效失败不影响流程 */ }
  }

  /* ---------------- 全局公共函数：中文通关鼓励 ---------------- */

  var lastPraise = -1;

  /**
   * 随机播放一句中文鼓励（豆包 2.0 中文女童音，构建期一次性生成）。
   * 任何关卡通关都必须调用本函数，不得改用其他语音引擎。
   */
  function playRandomPraise(onDone) {
    var index = Math.floor(Math.random() * PRAISE_KEYS.length);
    if (index === lastPraise) index = (index + 1) % PRAISE_KEYS.length;
    lastPraise = index;
    return say([PRAISE_KEYS[index]], onDone);
  }

  window.playRandomPraise = playRandomPraise;

  /* ---------------- 通用交互 ---------------- */

  function toast(message) {
    toastEl.textContent = message;
    toastEl.hidden = false;
    if (toast.timer) clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { toastEl.hidden = true; }, 1500);
  }

  function playComingSoon() { say(['coming']); }

  /* ---------------- 视图切换 ---------------- */

  var view = 'map';
  var currentIsland = 0;

  function showScreen(name) {
    view = name;
    screenMap.hidden = name !== 'map';
    screenIsland.hidden = name !== 'island';
    screenLevel.hidden = name !== 'level';
    btnBack.hidden = name === 'map';
    starsBox.hidden = name !== 'level';
    optionsBar.classList.toggle('gone', name !== 'level');
    if (name !== 'level') { optionsBar.classList.add('off'); stop(); }
  }

  /* ---------------- 地图 ---------------- */

  function renderMap() {
    islandGrid.innerHTML = '';
    ISLANDS.forEach(function (island, i) {
      var index = i + 1;
      var unlocked = isIslandUnlocked(index);
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'island ' + (unlocked ? 'unlocked' : 'locked');
      if (unlocked && index === progress.unlockedIsland) card.classList.add('current');
      card.dataset.island = String(index);
      card.setAttribute('aria-label', '第' + index + '岛 ' + island.name);

      var num = document.createElement('span');
      num.className = 'num';
      num.textContent = String(index);

      var icon = document.createElement('span');
      icon.className = 'icon';
      icon.textContent = island.icon;

      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = island.name;

      card.appendChild(num);
      card.appendChild(icon);
      card.appendChild(name);

      if (!unlocked) {
        var lock = document.createElement('span');
        lock.className = 'lock';
        lock.textContent = '🔒';
        card.appendChild(lock);
      }

      card.addEventListener('click', function () {
        if (!unlocked) {
          card.classList.remove('tapped');
          void card.offsetWidth;
          card.classList.add('tapped');
          playComingSoon();
          return;
        }
        enterIsland(index);
      });

      islandGrid.appendChild(card);
    });
  }

  /* ---------------- 岛屿内页 ---------------- */

  function enterIsland(index) {
    currentIsland = index;
    showScreen('island');
    renderIsland();
  }

  function playableContent(island, level) {
    return island === 1 && level === 1;
  }

  function renderIsland() {
    var island = ISLANDS[currentIsland - 1];

    islandHead.innerHTML = '';
    var icon = document.createElement('div');
    icon.className = 'big-icon';
    icon.textContent = island.icon;
    var titles = document.createElement('div');
    titles.className = 'titles';
    var t1 = document.createElement('div');
    t1.className = 't1';
    t1.textContent = '第 ' + currentIsland + ' 岛 · ' + island.name;
    var t2 = document.createElement('div');
    t2.className = 't2';
    t2.textContent = '共 ' + LEVELS_PER_ISLAND + ' 关';
    titles.appendChild(t1);
    titles.appendChild(t2);
    islandHead.appendChild(icon);
    islandHead.appendChild(titles);

    nodeList.innerHTML = '';
    for (var level = 1; level <= LEVELS_PER_ISLAND; level++) {
      (function (level) {
        var row = document.createElement('div');
        row.className = 'node-row';

        var label = document.createElement('span');
        label.className = 'node-label ' + (level % 2 ? 'right' : 'left');
        label.textContent = '第 ' + level + ' 关';

        var node = document.createElement('button');
        node.type = 'button';
        node.dataset.level = String(level);

        var unlocked = isLevelUnlocked(currentIsland, level);
        var cleared = !!progress.cleared[currentIsland + '-' + level];
        var playable = playableContent(currentIsland, level);

        node.className = 'node' + (cleared ? ' done' : '') +
          (unlocked ? '' : ' locked') + (unlocked && playable && !cleared ? ' playable' : '');
        node.textContent = cleared ? '⭐' : (unlocked ? String(level) : '🔒');
        node.setAttribute('aria-label', '第' + level + '关');

        node.addEventListener('click', function () {
          if (!unlocked) { playComingSoon(); return; }
          if (!playable) { playComingSoon(); toast('这一关还在准备中'); return; }
          enterLevel();
        });

        if (level % 2) { row.appendChild(label); row.appendChild(node); }
        else { row.appendChild(node); row.appendChild(label); }
        nodeList.appendChild(row);

        if (level < LEVELS_PER_ISLAND) {
          var line = document.createElement('div');
          line.className = 'path-line';
          nodeList.appendChild(line);
        }
      })(level);
    }

    btnBack.hidden = false;
  }

  /* ---------------- 关卡引擎 ---------------- */

  var state = {
    phase: 'idle',
    plan: [],
    roundIndex: 0,
    stars: 0,
    question: null,
    busy: false
  };

  var starEls = [];

  function buildStars() {
    starsBox.innerHTML = '';
    starEls = [];
    for (var i = 0; i < TOTAL_ROUNDS; i++) {
      var s = document.createElement('span');
      s.className = 'star';
      s.textContent = '⭐';
      starsBox.appendChild(s);
      starEls.push(s);
    }
  }

  function lightStar(index) {
    var s = starEls[index];
    if (s) s.classList.add('on');
  }

  function clearStars() {
    starEls.forEach(function (s) { s.classList.remove('on'); });
  }

  function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function pick(list, exclude) {
    var pool = list.filter(function (v) { return v !== exclude; });
    if (!pool.length) pool = list.slice();
    return pool[randInt(0, pool.length - 1)];
  }

  function withDistractors(pool, answer) {
    var others = shuffle(pool.filter(function (v) { return v !== answer; })).slice(0, 2);
    return shuffle([answer].concat(others));
  }

  function makePlan() {
    var plan = [];
    for (var i = 0; i < TOTAL_ROUNDS; i++) plan.push(i % 3);
    shuffle(plan);
    for (var k = 1; k < plan.length; k++) {
      if (plan[k] === plan[k - 1]) {
        for (var m = k + 1; m < plan.length; m++) {
          if (plan[m] !== plan[k - 1]) { var t = plan[k]; plan[k] = plan[m]; plan[m] = t; break; }
        }
      }
    }
    return plan;
  }

  function makeQuestion(type, prev) {
    var num = pick(NUMBERS, prev ? prev.num : null);
    var fruit = pick(FRUITS, prev ? prev.fruit : null);

    if (type === 0) {
      var nums = withDistractors(NUMBERS, num);
      return {
        type: 'A', num: num, fruit: fruit,
        options: nums.map(function (v) { return { kind: 'num', value: v }; }),
        correct: nums.indexOf(num),
        audio: ['n' + num], reinforce: 'n' + num
      };
    }

    if (type === 1) {
      var others = shuffle(FRUITS.filter(function (f) { return f.id !== fruit.id; })).slice(0, 2);
      var list = shuffle([fruit].concat(others));
      var order = list.map(function (f) { return f.id; });
      return {
        type: 'B', num: num, fruit: fruit,
        options: list.map(function (f) { return { kind: 'fruit', fruit: f }; }),
        correct: order.indexOf(fruit.id),
        audio: ['f_' + fruit.id], reinforce: 'f_' + fruit.id
      };
    }

    var counts = withDistractors(NUMBERS, num);
    return {
      type: 'C', num: num, fruit: fruit,
      options: counts.map(function (v) { return { kind: 'pile', count: v, fruit: fruit }; }),
      correct: counts.indexOf(num),
      audio: ['q_' + num + '_' + fruit.id], reinforce: 'n' + num
    };
  }

  function pileNode(emoji, count, variant) {
    var box = document.createElement('div');
    box.className = 'pile ' + (variant === 'opt' ? 'pile-opt' : 'pile-display');
    for (var i = 0; i < count; i++) {
      var span = document.createElement('span');
      span.textContent = emoji;
      box.appendChild(span);
    }
    return box;
  }

  function renderDisplay(q) {
    askDisplay.innerHTML = '';

    if (q.type === 'A') {
      var bubble = document.createElement('div');
      bubble.className = 'num-bubble';
      bubble.textContent = String(q.num);
      askDisplay.appendChild(bubble);
      return;
    }

    if (q.type === 'B') {
      askDisplay.appendChild(pileNode(q.fruit.emoji, q.num, 'display'));
      return;
    }

    var wrap = document.createElement('div');
    wrap.className = 'target-wrap';
    var fruit = document.createElement('div');
    fruit.className = 'target-fruit';
    fruit.textContent = q.fruit.emoji;
    var badge = document.createElement('span');
    badge.className = 'target-badge';
    badge.textContent = '🔍';
    wrap.appendChild(fruit);
    wrap.appendChild(badge);
    askDisplay.appendChild(wrap);
  }

  function removeDecor(btn) {
    var nodes = btn.querySelectorAll('.hint-hand, .pile-num');
    for (var i = nodes.length - 1; i >= 0; i--) nodes[i].parentNode.removeChild(nodes[i]);
  }

  function renderOptions(q) {
    optionEls.forEach(function (btn, i) {
      removeDecor(btn);
      btn.className = 'option';
      var slot = btn.querySelector('.slot');
      slot.className = 'slot';
      slot.innerHTML = '';

      var opt = q.options[i];
      if (!opt) return;

      if (opt.kind === 'num') {
        btn.classList.add('num-opt');
        slot.textContent = String(opt.value);
      } else if (opt.kind === 'fruit') {
        slot.textContent = opt.fruit.emoji;
      } else {
        btn.classList.add('pile-opt');
        slot.appendChild(pileNode(opt.fruit.emoji, opt.count, 'opt'));
        var badge = document.createElement('div');
        badge.className = 'pile-num';
        badge.textContent = String(opt.count);
        btn.appendChild(badge);
      }

      if (state.roundIndex < HINT_ROUNDS && i === q.correct) {
        var hand = document.createElement('span');
        hand.className = 'hint-hand';
        hand.textContent = '👆';
        hand.setAttribute('aria-hidden', 'true');
        btn.appendChild(hand);
      }
    });
    optionsBar.classList.remove('off');
  }

  function clearOptions() {
    optionEls.forEach(function (btn) {
      removeDecor(btn);
      btn.className = 'option';
      var slot = btn.querySelector('.slot');
      slot.className = 'slot';
      slot.innerHTML = '';
    });
  }

  function renderRound() {
    var q = state.question;
    state.phase = 'asking';
    state.busy = false;

    viewStart.hidden = true;
    viewDone.hidden = true;
    viewAsk.hidden = false;

    renderDisplay(q);
    renderOptions(q);
    say(q.audio);
  }

  function nextRound() {
    state.roundIndex += 1;
    if (state.roundIndex >= TOTAL_ROUNDS) { finish(); return; }
    state.question = makeQuestion(state.plan[state.roundIndex], state.question);
    renderRound();
  }

  /* ---------------- 星星飞入 ---------------- */

  function flyStar(fromEl, toEl, onDone) {
    var a = fromEl.getBoundingClientRect();
    var b = toEl.getBoundingClientRect();
    var star = document.createElement('div');
    star.className = 'fly-star';
    star.textContent = '⭐';
    star.style.left = (a.left + a.width / 2) + 'px';
    star.style.top = (a.top + a.height / 2) + 'px';
    flyLayer.appendChild(star);

    var dx = (b.left + b.width / 2) - (a.left + a.width / 2);
    var dy = (b.top + b.height / 2) - (a.top + a.height / 2);

    var anim = star.animate([
      { transform: 'translate(-50%,-50%) scale(.35)', opacity: .25 },
      { transform: 'translate(-50%,-50%) scale(1.6)', opacity: 1, offset: .26 },
      { transform: 'translate(calc(-50% + ' + (dx * .42) + 'px), calc(-50% + ' + (dy * .28 - 46) + 'px)) scale(1.15)', opacity: 1, offset: .62 },
      { transform: 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(.5)', opacity: .95 }
    ], { duration: 660, easing: 'cubic-bezier(.36,.72,.35,1)', fill: 'forwards' });

    var settled = false;
    function settle() {
      if (settled) return;
      settled = true;
      if (star.parentNode) star.parentNode.removeChild(star);
      if (onDone) onDone();
    }
    anim.onfinish = settle;
    setTimeout(settle, 900);
  }

  /* ---------------- 判定 ---------------- */

  function handlePick(index, btn) {
    if (state.phase !== 'asking' || state.busy) return;
    var q = state.question;

    if (index === q.correct) {
      state.busy = true;
      state.phase = 'judging';
      optionsBar.classList.add('off');
      btn.classList.add('right');
      state.stars += 1;

      flyStar(btn, starEls[state.roundIndex], function () {
        lightStar(state.roundIndex);
        ding();
      });

      say(['yes', 'star', q.reinforce], function () {
        setTimeout(nextRound, 380);
      });
    } else {
      state.busy = true;
      btn.classList.add('wrong');
      say(['again'], function () {
        btn.classList.remove('wrong');
        state.busy = false;
      });
    }
  }

  /* ---------------- 关卡流程 ---------------- */

  function enterLevel() {
    showScreen('level');
    buildStars();
    state.phase = 'idle';
    state.busy = false;
    state.roundIndex = 0;
    state.stars = 0;
    state.question = null;
    state.plan = [];
    clearStars();
    clearOptions();
    viewStart.hidden = false;
    viewAsk.hidden = true;
    viewDone.hidden = true;
    btnStart.hidden = false;
    confettiBox.hidden = true;
    confettiBox.innerHTML = '';
  }

  function startGame() {
    if (state.phase !== 'idle') return;
    state.phase = 'intro';
    btnStart.hidden = true;
    say(['intro'], function () {
      state.plan = makePlan();
      state.roundIndex = 0;
      state.stars = 0;
      clearStars();
      state.question = makeQuestion(state.plan[0], null);
      renderRound();
    });
  }

  function confetti() {
    confettiBox.innerHTML = '';
    var colors = ['#ffcfa3', '#ffd9a0', '#c8e6b4', '#b9ddf2', '#e3cdf5', '#ffbfa8'];
    for (var i = 0; i < 90; i++) {
      var piece = document.createElement('i');
      piece.style.left = (Math.random() * 100) + '%';
      piece.style.background = colors[i % colors.length];
      piece.style.width = (5 + Math.random() * 7) + 'px';
      piece.style.height = (9 + Math.random() * 12) + 'px';
      piece.style.animationDuration = (2.6 + Math.random() * 3) + 's';
      piece.style.animationDelay = (Math.random() * 2.6) + 's';
      confettiBox.appendChild(piece);
    }
    confettiBox.hidden = false;
  }

  function finish() {
    state.phase = 'done';
    state.busy = false;
    viewAsk.hidden = true;
    optionsBar.classList.add('off');
    clearOptions();
    viewDone.hidden = false;
    confetti();
    markCleared(1, 1);
    playRandomPraise(function () { say(['win']); });
  }

  function restartLevel() {
    stop();
    speakToken += 1;
    confettiBox.hidden = true;
    confettiBox.innerHTML = '';
    state.plan = makePlan();
    state.roundIndex = 0;
    state.stars = 0;
    state.busy = false;
    clearStars();
    state.question = makeQuestion(state.plan[0], null);
    renderRound();
  }

  /* ---------------- 事件 ---------------- */

  btnStart.addEventListener('click', startGame);
  btnRestart.addEventListener('click', restartLevel);

  optionEls.forEach(function (btn) {
    btn.addEventListener('click', function () {
      handlePick(parseInt(btn.dataset.idx, 10), btn);
    });
  });

  btnReplay.addEventListener('click', function () {
    btnReplay.classList.remove('ringing');
    void btnReplay.offsetWidth;
    btnReplay.classList.add('ringing');

    if (state.phase === 'asking' && state.question) say(state.question.audio);
    else if (state.phase === 'done') playRandomPraise();
    else if (state.phase === 'intro') say(['intro']);
  });

  btnBack.addEventListener('click', function () {
    stop();
    if (view === 'level') enterIsland(currentIsland);
    else if (view === 'island') { showScreen('map'); renderMap(); }
  });

  /* ---------------- 初始化 ---------------- */

  loadProgress();
  buildStars();
  showScreen('map');
  renderMap();
  Object.keys(bank).forEach(getAudio);

  window.Game = {
    speak: speak,
    say: say,
    stop: stop,
    playRandomPraise: playRandomPraise,
    get phase() { return state.phase; },
    get round() { return state.roundIndex; },
    get stars() { return state.stars; },
    get view() { return view; },
    get island() { return currentIsland; },
    get progress() { return JSON.parse(JSON.stringify(progress)); },
    openIsland: enterIsland,
    backToMap: function () { showScreen('map'); renderMap(); },
    markCleared: markCleared,
    resetProgress: function () {
      progress = { unlockedIsland: 1, unlockedLevel: { 1: 1 }, cleared: {} };
      saveProgress();
      renderMap();
    },
    snapshot: function () {
      var q = state.question;
      return {
        phase: state.phase,
        view: view,
        island: currentIsland,
        round: state.roundIndex + 1,
        stars: state.stars,
        totalRounds: TOTAL_ROUNDS,
        progress: JSON.parse(JSON.stringify(progress)),
        question: q ? {
          type: q.type,
          num: q.num,
          fruit: q.fruit.id,
          correct: q.correct,
          audio: q.audio[0],
          options: q.options.map(function (o) {
            return o.kind === 'num' ? o.value : (o.kind === 'fruit' ? o.fruit.id : o.count);
          })
        } : null
      };
    },
    voiceKeys: Object.keys(bank)
  };
})();
</script>
</body>
