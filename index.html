<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#cfeeff" />
<title>英语启蒙乐园</title>
<style>
  /* ===================== 基础 ===================== */
  *,
  *::before,
  *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --sky-1: #c9ecff;
    --sky-2: #e9f9ff;
    --sky-3: #f8ffe9;
    --ink: #4b3a2f;
    --panel: rgba(255, 255, 255, .82);
    --shadow-panel: 0 18px 40px rgba(88, 132, 166, .16);
    --shadow-soft: 0 10px 24px rgba(88, 132, 166, .16);
  }

  html, body { height: 100%; }

  body {
    height: 100dvh;
    min-height: 100dvh;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: clamp(6px, 1.6vh, 18px);
    padding: clamp(8px, 1.8vh, 20px) clamp(10px, 2.4vw, 32px) clamp(10px, 2.4vh, 26px);
    font-family: "Yuanti SC", "幼圆", "YouYuan", "PingFang SC", "Microsoft YaHei", system-ui,
      "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 54%, var(--sky-3) 100%);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  [hidden] { display: none !important; }

  /* ===================== 卡通背景 ===================== */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .sun {
    position: absolute;
    top: -14vmin;
    right: -10vmin;
    width: 46vmin;
    height: 46vmin;
    border-radius: 50%;
    background: radial-gradient(circle at 45% 45%, #fffbdc 0%, #ffeaa0 46%, rgba(255, 234, 160, 0) 70%);
    animation: sun-glow 6s ease-in-out infinite;
  }

  @keyframes sun-glow {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  .cloud {
    --s: 1;
    position: absolute;
    left: -45vmin;
    width: 18vmin;
    height: 6.4vmin;
    background: #fff;
    border-radius: 999px;
    animation: drift linear infinite;
  }

  .cloud::before,
  .cloud::after {
    content: "";
    position: absolute;
    background: #fff;
    border-radius: 50%;
  }

  .cloud::before { width: 9.2vmin; height: 9.2vmin; left: 2.4vmin; top: -4.6vmin; }
  .cloud::after { width: 6.4vmin; height: 6.4vmin; right: 3.2vmin; top: -3.2vmin; }

  .cloud.c1 { --s: .86; top: 9%; opacity: .92; animation-duration: 78s; }
  .cloud.c2 { --s: 1.28; top: 27%; opacity: .68; animation-duration: 104s; animation-delay: -34s; }
  .cloud.c3 { --s: .68; top: 48%; opacity: .58; animation-duration: 132s; animation-delay: -76s; }

  @keyframes drift {
    from { transform: translateX(0) scale(var(--s)); }
    to { transform: translateX(calc(100vw + 60vmin)) scale(var(--s)); }
  }

  .hills {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 34vh;
  }

  .hill {
    position: absolute;
    bottom: 0;
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }

  .hill.h1 { left: -12vw; width: 74vw; height: 23vh; background: #cbedb6; opacity: .8; }
  .hill.h2 { right: -14vw; width: 70vw; height: 17vh; background: #b4e59c; opacity: .85; }

  .grass {
    position: absolute;
    left: -6vw;
    right: -6vw;
    bottom: -6vh;
    height: 13vh;
    background: #a3dd85;
    border-radius: 44% 44% 0 0 / 60% 60% 0 0;
  }

  /* ===================== 顶部工具条 ===================== */
  .topbar {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .icon-btn {
    width: clamp(44px, 7vh, 62px);
    height: clamp(44px, 7vh, 62px);
    display: grid;
    place-items: center;
    border: 3px solid #fff;
    border-radius: 50%;
    background: rgba(255, 255, 255, .8);
    box-shadow: var(--shadow-soft);
    font-size: clamp(19px, 3vh, 27px);
    line-height: 1;
    color: #5b4636;
    cursor: pointer;
    transition: transform .14s ease, background .14s ease;
  }

  .icon-btn:active { transform: scale(.9); }

  .icon-btn.ringing { animation: ring .6s ease; }

  @keyframes ring {
    0% { transform: scale(1); }
    40% { transform: scale(1.16) rotate(-6deg); }
    70% { transform: scale(.96) rotate(4deg); }
    100% { transform: scale(1) rotate(0); }
  }

  /* ===================== 中央显示区 ===================== */
  .stage {
    position: relative;
    z-index: 1;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: clamp(12px, 3vmin, 34px);
    overflow: hidden;
    border: clamp(3px, .7vmin, 6px) solid #fff;
    border-radius: clamp(24px, 4.4vmin, 48px);
    background: linear-gradient(180deg, rgba(255, 255, 255, .88), rgba(255, 255, 255, .62));
    box-shadow: var(--shadow-panel);
  }

  /* 开始按钮 */
  .start-btn {
    border: clamp(3px, .5vmin, 5px) solid #fff;
    padding: clamp(16px, 2.6vh, 28px) clamp(40px, 7.4vmin, 88px);
    border-radius: 999px;
    background: linear-gradient(180deg, #ffe076, #ffb020);
    color: #6b4a13;
    font-family: inherit;
    font-weight: 900;
    font-size: clamp(26px, 4.8vmin, 50px);
    letter-spacing: .1em;
    cursor: pointer;
    box-shadow: 0 10px 0 #e08f0c, 0 20px 34px rgba(224, 143, 12, .32);
    transition: transform .12s ease, box-shadow .12s ease;
    animation: breathe 2.8s ease-in-out infinite;
  }

  .start-btn:active {
    transform: translateY(7px);
    box-shadow: 0 3px 0 #e08f0c, 0 8px 16px rgba(224, 143, 12, .3);
  }

  @keyframes breathe {
    0%, 100% { box-shadow: 0 10px 0 #e08f0c, 0 20px 34px rgba(224, 143, 12, .32); }
    50% { box-shadow: 0 10px 0 #e08f0c, 0 26px 52px rgba(255, 176, 32, .6); }
  }

  /* 语音播放中的跳动小圆点 */
  .listening {
    display: flex;
    align-items: center;
    gap: clamp(10px, 2.2vmin, 20px);
  }

  .listening i {
    width: clamp(14px, 2.6vmin, 24px);
    height: clamp(14px, 2.6vmin, 24px);
    border-radius: 50%;
    background: #7fc4ff;
    animation: jump .92s ease-in-out infinite;
  }

  .listening i:nth-child(2) { background: #ffb52e; animation-delay: .16s; }
  .listening i:nth-child(3) { background: #7ed37a; animation-delay: .32s; }

  @keyframes jump {
    0%, 100% { transform: translateY(0); opacity: .5; }
    50% { transform: translateY(-14px); opacity: 1; }
  }

  /* 卡片：苹果 + 测试按钮 */
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 2.4vh, 26px);
  }

  .card.in { animation: pop .52s cubic-bezier(.2, 1.62, .42, 1) both; }

  @keyframes pop {
    0% { opacity: 0; transform: scale(.5); }
    62% { opacity: 1; transform: scale(1.07); }
    100% { opacity: 1; transform: scale(1); }
  }

  .card-emoji {
    font-size: clamp(110px, min(42vw, 34vh), 240px);
    line-height: 1;
    filter: drop-shadow(0 14px 16px rgba(198, 72, 52, .22));
    animation: bob 2.8s ease-in-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-2.5deg); }
    50% { transform: translateY(-10px) rotate(2.5deg); }
  }

  .listen-btn {
    border: clamp(3px, .45vmin, 4px) solid #fff;
    padding: clamp(10px, 1.8vh, 18px) clamp(28px, 5.4vmin, 56px);
    border-radius: 999px;
    background: linear-gradient(180deg, #86d3ff, #3ba7ee);
    color: #ffffff;
    font-family: inherit;
    font-weight: 900;
    font-size: clamp(18px, 2.9vmin, 31px);
    letter-spacing: .1em;
    text-shadow: 0 2px 0 rgba(20, 90, 140, .25);
    cursor: pointer;
    box-shadow: 0 8px 0 #1f86c9, 0 16px 26px rgba(31, 134, 201, .3);
    transition: transform .12s ease, box-shadow .12s ease;
  }

  .listen-btn:active {
    transform: translateY(5px);
    box-shadow: 0 3px 0 #1f86c9, 0 8px 14px rgba(31, 134, 201, .26);
  }

  /* ===================== 选项区 ===================== */
  .options {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 3vw, 34px);
  }

  .option {
    width: min(clamp(84px, 22vh, 180px), 27vw);
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
    border: clamp(3px, .55vmin, 5px) solid #fff;
    border-radius: clamp(20px, 3.2vmin, 34px);
    background: rgba(255, 255, 255, .74);
    box-shadow: var(--shadow-soft);
    cursor: pointer;
    transition: transform .14s ease, background .14s ease;
  }

  .option:nth-child(1) { background: rgba(255, 226, 238, .82); }
  .option:nth-child(2) { background: rgba(226, 244, 255, .82); }
  .option:nth-child(3) { background: rgba(233, 255, 226, .82); }

  .option:active { transform: scale(.94); }

  .option.tapped { animation: tap .38s ease; }

  @keyframes tap {
    0% { transform: scale(1); }
    45% { transform: scale(.92); }
    100% { transform: scale(1); }
  }

  .slot {
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
    font-size: clamp(34px, min(15vw, 11vh), 76px);
    line-height: 1;
  }

  .option.empty .slot::after {
    content: "";
    display: block;
    width: 30%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    border: 3px dashed rgba(139, 175, 201, .55);
  }

  /* 横屏矮屏适配 */
  @media (max-height: 520px) {
    body { gap: 6px; padding: 8px 14px 10px; }
    .stage { padding: 8px; }
  }
</style>
</head>
<body>

<!-- 背景装饰 -->
<div class="bg" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="hills">
    <span class="hill h1"></span>
    <span class="hill h2"></span>
  </div>
  <div class="grass"></div>
</div>

<!-- 顶部：全屏 / 重播 -->
<div class="topbar">
  <button id="btnFull" class="icon-btn" type="button" aria-label="全屏切换">⛶</button>
  <button id="btnReplay" class="icon-btn" type="button" aria-label="重播语音">🔊</button>
</div>

<!-- 中央显示区 -->
<main id="stage" class="stage">
  <button id="btnStart" class="start-btn" type="button">开始游戏</button>

  <div id="listening" class="listening" hidden aria-hidden="true">
    <i></i><i></i><i></i>
  </div>

  <div id="card" class="card" hidden>
    <div id="cardEmoji" class="card-emoji">🍎</div>
    <button id="btnListen" class="listen-btn" type="button">听一听</button>
  </div>
</main>

<!-- 三个选项位 -->
<nav class="options" aria-label="选项区">
  <button class="option empty" type="button" data-slot="0" aria-label="选项一">
    <span class="slot"></span>
  </button>
  <button class="option empty" type="button" data-slot="1" aria-label="选项二">
    <span class="slot"></span>
  </button>
  <button class="option empty" type="button" data-slot="2" aria-label="选项三">
    <span class="slot"></span>
  </button>
</nav>

<script>
/* ============================================================
   游戏框架
   ============================================================ */
(function () {
  'use strict';

  var bank = window.VOICE_BANK || {};
  var cache = new Map();
  var current = null;
  var lastKey = null;

  var stage = document.getElementById('stage');
  var btnStart = document.getElementById('btnStart');
  var listening = document.getElementById('listening');
  var card = document.getElementById('card');
  var cardEmoji = document.getElementById('cardEmoji');
  var btnListen = document.getElementById('btnListen');
  var btnReplay = document.getElementById('btnReplay');
  var btnFull = document.getElementById('btnFull');
  var optionEls = Array.prototype.slice.call(document.querySelectorAll('.option'));

  var TEST_KEY = 'test';

  /* ---------- 语音播放 ---------- */

  function getAudio(key) {
    if (!Object.prototype.hasOwnProperty.call(bank, key)) return null;
    if (!cache.has(key)) {
      var el = new Audio(bank[key]);
      el.preload = 'auto';
      el.setAttribute('playsinline', '');
      cache.set(key, el);
    }
    return cache.get(key);
  }

  function stop() {
    if (!current) return;
    var el = current;
    current = null;
    el.onended = null;
    el.onerror = null;
    try { el.pause(); } catch (e) { /* 忽略 */ }
    try { el.currentTime = 0; } catch (e) { /* 忽略 */ }
  }

  /**
   * 播放一条语音。
   * @param {string} key   VOICE_BANK 中的键
   * @param {Function} [onDone] 播放结束（或失败）后的回调
   * @returns {boolean} 是否存在这条语音
   */
  function speak(key, onDone) {
    var el = getAudio(key);
    if (!el) {
      if (onDone) onDone();
      return false;
    }
    stop();
    lastKey = key;
    current = el;

    var finished = false;
    function finish() {
      if (finished) return;
      finished = true;
      if (current === el) current = null;
      if (onDone) onDone();
    }

    el.onended = finish;
    el.onerror = finish;
    try { el.currentTime = 0; } catch (e) { /* 忽略 */ }

    var p = el.play();
    if (p && typeof p.catch === 'function') {
      p.catch(function () { finish(); });
    }
    return true;
  }

  /* ---------- 界面状态 ---------- */

  function replayAnim(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function showCard(emoji, key) {
    cardEmoji.textContent = emoji || '🍎';
    card.dataset.voice = key || '';
    card.hidden = false;
    replayAnim(card, 'in');
  }

  function hideCard() {
    card.hidden = true;
    card.classList.remove('in');
  }

  function setOption(index, emoji, key) {
    var btn = optionEls[index];
    if (!btn) return;
    btn.querySelector('.slot').textContent = emoji || '';
    btn.classList.toggle('empty', !emoji);
    if (key) btn.dataset.voice = key;
    else delete btn.dataset.voice;
  }

  function clearOption(index) {
    var btn = optionEls[index];
    if (!btn) return;
    btn.querySelector('.slot').textContent = '';
    btn.classList.add('empty');
    delete btn.dataset.voice;
  }

  /* ---------- 开始游戏流程 ---------- */

  // 开场语音播完：收起等待动画，弹出苹果卡片
  function introDone() {
    if (stage.dataset.phase !== 'playing') return;
    listening.hidden = true;
    stage.dataset.phase = 'ready';
    showCard('🍎', 'apple');
  }

  function startGame() {
    if (stage.dataset.phase === 'playing') return;

    stage.dataset.phase = 'playing';
    btnStart.hidden = true;
    hideCard();
    listening.hidden = false;

    speak(TEST_KEY, introDone);
  }

  /* ---------- 事件绑定 ---------- */

  btnStart.addEventListener('click', startGame);

  btnReplay.addEventListener('click', function () {
    replayAnim(btnReplay, 'ringing');
    // 开场语音还在播时点喇叭：重放开场，结束后仍照常弹出卡片
    if (stage.dataset.phase === 'playing') {
      speak(TEST_KEY, introDone);
    } else {
      speak(lastKey || TEST_KEY);
    }
  });

  btnListen.addEventListener('click', function () {
    speak(card.dataset.voice || 'apple');
  });

  btnFull.addEventListener('click', function () {
    var d = document;
    var target = d.fullscreenElement || d.webkitFullscreenElement;
    try {
      if (target) {
        (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      } else {
        var el = d.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen;
        var res = req.call(el);
        if (res && typeof res.catch === 'function') res.catch(function () {});
      }
    } catch (e) { /* 忽略 */ }
  });

  optionEls.forEach(function (btn) {
    btn.addEventListener('click', function () {
      replayAnim(btn, 'tapped');
      if (btn.dataset.voice) speak(btn.dataset.voice);
    });
  });

  // 预热解码，避免首次点击音频有延迟
  Object.keys(bank).forEach(getAudio);

  /* ---------- 对外接口（后续扩展题目用） ---------- */
  window.Game = {
    speak: speak,
    stop: stop,
    showCard: showCard,
    hideCard: hideCard,
    setOption: setOption,
    clearOption: clearOption,
    get phase() { return stage.dataset.phase || 'idle'; },
    voiceKeys: Object.keys(bank)
  };
})();
</script>
