<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#cfeeff" />
<title>英语启蒙乐园 · 数字与水果</title>
<style>
  /* ===================== 基础 ===================== */
  *,
  *::before,
  *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --sky-1: #c9ecff;
    --sky-2: #e9f9ff;
    --sky-3: #f8ffe9;
    --ink: #4b3a2f;
    --shadow-panel: 0 18px 40px rgba(88, 132, 166, .16);
    --shadow-soft: 0 10px 24px rgba(88, 132, 166, .16);
  }

  html, body { height: 100%; }

  body {
    height: 100dvh;
    min-height: 100dvh;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: clamp(6px, 1.6vh, 18px);
    padding: clamp(8px, 1.8vh, 20px) clamp(10px, 2.4vw, 32px) clamp(10px, 2.4vh, 26px);
    font-family: "Yuanti SC", "幼圆", "YouYuan", "PingFang SC", "Microsoft YaHei", system-ui,
      "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 54%, var(--sky-3) 100%);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  [hidden] { display: none !important; }

  /* ===================== 卡通背景 ===================== */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }

  .sun {
    position: absolute;
    top: -14vmin;
    right: -10vmin;
    width: 46vmin;
    height: 46vmin;
    border-radius: 50%;
    background: radial-gradient(circle at 45% 45%, #fffbdc 0%, #ffeaa0 46%, rgba(255, 234, 160, 0) 70%);
    animation: sun-glow 6s ease-in-out infinite;
  }

  @keyframes sun-glow {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  .cloud {
    --s: 1;
    position: absolute;
    left: -45vmin;
    width: 18vmin;
    height: 6.4vmin;
    background: #fff;
    border-radius: 999px;
    animation: drift linear infinite;
  }

  .cloud::before,
  .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }

  .cloud::before { width: 9.2vmin; height: 9.2vmin; left: 2.4vmin; top: -4.6vmin; }
  .cloud::after { width: 6.4vmin; height: 6.4vmin; right: 3.2vmin; top: -3.2vmin; }

  .cloud.c1 { --s: .86; top: 9%; opacity: .92; animation-duration: 78s; }
  .cloud.c2 { --s: 1.28; top: 27%; opacity: .68; animation-duration: 104s; animation-delay: -34s; }
  .cloud.c3 { --s: .68; top: 48%; opacity: .58; animation-duration: 132s; animation-delay: -76s; }

  @keyframes drift {
    from { transform: translateX(0) scale(var(--s)); }
    to { transform: translateX(calc(100vw + 60vmin)) scale(var(--s)); }
  }

  .hills { position: absolute; left: 0; right: 0; bottom: 0; height: 34vh; }

  .hill { position: absolute; bottom: 0; border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
  .hill.h1 { left: -12vw; width: 74vw; height: 23vh; background: #cbedb6; opacity: .8; }
  .hill.h2 { right: -14vw; width: 70vw; height: 17vh; background: #b4e59c; opacity: .85; }

  .grass {
    position: absolute;
    left: -6vw;
    right: -6vw;
    bottom: -6vh;
    height: 13vh;
    background: #a3dd85;
    border-radius: 44% 44% 0 0 / 60% 60% 0 0;
  }

  /* ===================== 顶部：全屏 / 星星进度 / 重播 ===================== */
  .topbar {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: clamp(6px, 1.6vw, 18px);
  }

  .icon-btn {
    flex: none;
    width: clamp(40px, 6.4vh, 58px);
    height: clamp(40px, 6.4vh, 58px);
    display: grid;
    place-items: center;
    border: 3px solid #fff;
    border-radius: 50%;
    background: rgba(255, 255, 255, .8);
    box-shadow: var(--shadow-soft);
    font-size: clamp(18px, 2.8vh, 25px);
    line-height: 1;
    color: #5b4636;
    cursor: pointer;
    transition: transform .14s ease, background .14s ease;
  }

  .icon-btn:active { transform: scale(.9); }

  .icon-btn.ringing { animation: ring .6s ease; }

  .icon-btn.speaking { animation: speak-pulse 1s ease-in-out infinite; }

  @keyframes ring {
    0% { transform: scale(1); }
    40% { transform: scale(1.16) rotate(-6deg); }
    70% { transform: scale(.96) rotate(4deg); }
    100% { transform: scale(1) rotate(0); }
  }

  @keyframes speak-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(127, 196, 255, .55); transform: scale(1); }
    50% { box-shadow: 0 0 0 10px rgba(127, 196, 255, 0); transform: scale(1.06); }
  }

  /* 星星进度条 */
  .stars {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(1px, .7vw, 6px);
    padding: clamp(3px, .5vh, 7px) clamp(6px, 1.4vw, 16px);
    border-radius: 999px;
    background: rgba(255, 255, 255, .62);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .9);
  }

  .star {
    font-size: clamp(12px, min(2.4vh, 2.2vw), 22px);
    line-height: 1;
    filter: grayscale(1) opacity(.28);
    transition: filter .25s ease, transform .25s ease;
  }

  .star.on {
    filter: none;
    animation: star-pop .55s cubic-bezier(.2, 1.7, .4, 1) both;
  }

  @keyframes star-pop {
    0% { transform: scale(.6); }
    55% { transform: scale(1.5) rotate(12deg); }
    100% { transform: scale(1) rotate(0); }
  }

  /* ===================== 中央显示区 ===================== */
  .stage {
    position: relative;
    z-index: 1;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: clamp(10px, 2.6vmin, 30px);
    overflow: hidden;
    border: clamp(3px, .7vmin, 6px) solid #fff;
    border-radius: clamp(24px, 4.4vmin, 48px);
    background: linear-gradient(180deg, rgba(255, 255, 255, .88), rgba(255, 255, 255, .62));
    box-shadow: var(--shadow-panel);
  }

  .view {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 1.8vh, 22px);
    max-width: 100%;
    max-height: 100%;
  }

  /* 开始按钮 */
  .start-btn {
    border: clamp(3px, .5vmin, 5px) solid #fff;
    padding: clamp(16px, 2.6vh, 28px) clamp(40px, 7.4vmin, 88px);
    border-radius: 999px;
    background: linear-gradient(180deg, #ffe076, #ffb020);
    color: #6b4a13;
    font-family: inherit;
    font-weight: 900;
    font-size: clamp(26px, 4.8vmin, 50px);
    letter-spacing: .1em;
    cursor: pointer;
    box-shadow: 0 10px 0 #e08f0c, 0 20px 34px rgba(224, 143, 12, .32);
    transition: transform .12s ease, box-shadow .12s ease;
    animation: breathe 2.8s ease-in-out infinite;
  }

  .start-btn:active {
    transform: translateY(7px);
    box-shadow: 0 3px 0 #e08f0c, 0 8px 16px rgba(224, 143, 12, .3);
  }

  @keyframes breathe {
    0%, 100% { box-shadow: 0 10px 0 #e08f0c, 0 20px 34px rgba(224, 143, 12, .32); }
    50% { box-shadow: 0 10px 0 #e08f0c, 0 26px 52px rgba(255, 176, 32, .6); }
  }

  /* 题目显示区 */
  .ask-display {
    display: grid;
    place-items: center;
    max-width: 100%;
    max-height: 100%;
  }

  /* 题型一：大数字 */
  .num-bubble {
    display: grid;
    place-items: center;
    padding: clamp(6px, 1.4vh, 20px) clamp(24px, 5vw, 64px);
    border-radius: clamp(22px, 4vmin, 44px);
    background: linear-gradient(180deg, #ffffff, #fff6e2);
    border: clamp(4px, .8vmin, 7px) solid #ffd76b;
    box-shadow: 0 14px 30px rgba(200, 150, 60, .22), inset 0 -6px 0 rgba(255, 215, 107, .35);
    font-weight: 900;
    font-size: clamp(92px, min(34vw, 26vh), 240px);
    line-height: 1.02;
    color: #e8890c;
    text-shadow: 0 4px 0 rgba(255, 255, 255, .9);
    animation: pop .5s cubic-bezier(.2, 1.62, .42, 1) both;
  }

  /* 题型二：一堆水果 */
  .pile {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-content: center;
    line-height: 1.06;
    margin: 0 auto;
  }

  .pile span { flex: none; width: 1em; text-align: center; }

  .pile-display {
    max-width: 5.04em;
    gap: 0;
    font-size: clamp(16px, min(11vw, 8vh), 68px);
    filter: drop-shadow(0 6px 8px rgba(140, 110, 60, .16));
    animation: pop .5s cubic-bezier(.2, 1.62, .42, 1) both;
  }

  /* 题型三：目标水果 + 放大镜 */
  .target-wrap {
    position: relative;
    display: grid;
    place-items: center;
    animation: pop .5s cubic-bezier(.2, 1.62, .42, 1) both;
  }

  .target-fruit {
    font-size: clamp(96px, min(40vw, 26vh), 240px);
    line-height: 1;
    filter: drop-shadow(0 12px 14px rgba(198, 132, 52, .22));
  }

  .target-badge {
    position: absolute;
    right: -6%;
    bottom: -4%;
    font-size: clamp(28px, min(7vw, 7vh), 62px);
    filter: drop-shadow(0 4px 6px rgba(90, 120, 150, .25));
    animation: badge-wiggle 2.4s ease-in-out infinite;
  }

  @keyframes badge-wiggle {
    0%, 100% { transform: rotate(-8deg) scale(1); }
    50% { transform: rotate(8deg) scale(1.08); }
  }

  @keyframes pop {
    0% { opacity: 0; transform: scale(.5); }
    62% { opacity: 1; transform: scale(1.07); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* ===================== 选项区 ===================== */
  .options {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 3vw, 34px);
    transition: opacity .28s ease;
  }

  .options.off { opacity: 0; pointer-events: none; }

  .option {
    position: relative;
    width: min(clamp(84px, 22vh, 180px), 27vw);
    aspect-ratio: 1 / 1;
    display: grid;
    place-items: center;
    border: clamp(3px, .55vmin, 5px) solid #fff;
    border-radius: clamp(20px, 3.2vmin, 34px);
    background: rgba(255, 255, 255, .78);
    box-shadow: var(--shadow-soft);
    cursor: pointer;
    transition: transform .14s ease, background .14s ease, box-shadow .14s ease;
    container-type: size;
  }

  .option[data-idx="0"] { background: rgba(255, 226, 238, .96); }
  .option[data-idx="1"] { background: rgba(226, 244, 255, .96); }
  .option[data-idx="2"] { background: rgba(233, 255, 226, .96); }

  .option:active { transform: scale(.94); }

  .slot {
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
    font-size: clamp(34px, min(15vw, 11vh), 76px);
    line-height: 1;
  }

  .option.num-opt .slot {
    font-weight: 900;
    color: #2f6b8f;
    font-size: clamp(36px, 15vh, 84px);
    font-size: 40cqw;
  }

  .option.pile-opt .slot { padding: 8%; }

  .pile-opt {
    max-width: 4.04em;
    gap: 0;
    font-size: clamp(8px, 3vw, 24px);
    font-size: 18cqw;
  }

  /* 闪烁小手提示 */
  .hint-hand {
    position: absolute;
    left: 50%;
    bottom: 2%;
    transform: translateX(-50%);
    font-size: clamp(18px, 4.4vmin, 34px);
    filter: drop-shadow(0 3px 5px rgba(90, 120, 150, .35));
    animation: hand-flash 1.1s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes hand-flash {
    0%, 100% { opacity: .3; transform: translateX(-50%) translateY(4px) scale(.9); }
    50% { opacity: 1; transform: translateX(-50%) translateY(-4px) scale(1.12); }
  }

  /* 答对：放大发光 */
  .option.right {
    background: #eafff1;
    transform: scale(1.09);
    box-shadow: 0 0 0 6px rgba(111, 208, 106, .6), 0 0 44px 10px rgba(111, 208, 106, .5);
    animation: right-burst .6s cubic-bezier(.2, 1.6, .4, 1);
  }

  @keyframes right-burst {
    0% { transform: scale(.96); }
    55% { transform: scale(1.16); }
    100% { transform: scale(1.09); }
  }

  /* 答错：抖动 */
  .option.wrong {
    background: #fff0f0;
    box-shadow: 0 0 0 5px rgba(255, 138, 138, .55);
    animation: shake .5s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0) rotate(0); }
    15% { transform: translateX(-9px) rotate(-3deg); }
    35% { transform: translateX(9px) rotate(3deg); }
    55% { transform: translateX(-7px) rotate(-2deg); }
    75% { transform: translateX(7px) rotate(2deg); }
  }

  /* ===================== 通关结算 ===================== */
  .trophy-wrap {
    display: grid;
    place-items: center;
    position: relative;
    animation: pop .6s cubic-bezier(.2, 1.6, .42, 1) both;
  }

  .trophy-wrap::before {
    content: "";
    position: absolute;
    width: 150%;
    height: 150%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 215, 90, .55) 0%, rgba(255, 215, 90, 0) 68%);
    animation: glow-pulse 2.4s ease-in-out infinite;
  }

  @keyframes glow-pulse {
    0%, 100% { transform: scale(.92); opacity: .75; }
    50% { transform: scale(1.12); opacity: 1; }
  }

  .trophy {
    position: relative;
    font-size: clamp(110px, min(30vw, 30vh), 280px);
    line-height: 1;
    filter: drop-shadow(0 14px 18px rgba(196, 148, 20, .45));
    animation: trophy-float 2.6s ease-in-out infinite;
  }

  @keyframes trophy-float {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-14px) rotate(2deg); }
  }

  .restart-btn {
    width: clamp(72px, 11vh, 104px);
    height: clamp(72px, 11vh, 104px);
    display: grid;
    place-items: center;
    border: clamp(4px, .6vmin, 6px) solid #fff;
    border-radius: 50%;
    background: linear-gradient(180deg, #ffffff, #e6f5ff);
    box-shadow: 0 8px 0 #b9d9ea, 0 16px 28px rgba(120, 170, 200, .32);
    font-size: clamp(32px, 5.6vh, 50px);
    line-height: 1;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
    animation: restart-nudge 2.6s ease-in-out infinite;
  }

  @keyframes restart-nudge {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .restart-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #b9d9ea; }

  /* ===================== 彩带 ===================== */
  .confetti { position: fixed; inset: 0; z-index: 6; overflow: hidden; pointer-events: none; }

  .confetti i {
    position: absolute;
    top: -12vh;
    display: block;
    border-radius: 2px;
    opacity: .95;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  @keyframes fall {
    0% { transform: translate3d(0, -12vh, 0) rotate(0deg); }
    100% { transform: translate3d(0, 118vh, 0) rotate(720deg); }
  }

  /* 横屏矮屏适配 */
  @media (max-height: 520px) {
    body { gap: 6px; padding: 8px 14px 10px; }
    .stage { padding: 8px; }
    .options { gap: 14px; }
  }
</style>
</head>
<body>

<!-- 背景装饰 -->
<div class="bg" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="hills">
    <span class="hill h1"></span>
    <span class="hill h2"></span>
  </div>
  <div class="grass"></div>
</div>

<!-- 顶部：全屏 / 星星进度 / 重播 -->
<header class="topbar">
  <button id="btnFull" class="icon-btn" type="button" aria-label="全屏切换">⛶</button>
  <div id="stars" class="stars" aria-label="闯关进度"></div>
  <button id="btnReplay" class="icon-btn" type="button" aria-label="重播语音">🔊</button>
</header>

<!-- 中央显示区 -->
<main id="stage" class="stage">
  <div id="viewStart" class="view">
    <button id="btnStart" class="start-btn" type="button">开始游戏</button>
  </div>

  <div id="viewAsk" class="view" hidden>
    <div id="askDisplay" class="ask-display"></div>
  </div>

  <div id="viewDone" class="view" hidden>
    <div class="trophy-wrap"><div class="trophy">🏆</div></div>
    <button id="btnRestart" class="restart-btn" type="button" aria-label="重新开始">🔄</button>
  </div>
</main>

<!-- 三个选项位 -->
<nav id="options" class="options off" aria-label="选项区">
  <button class="option" type="button" data-idx="0" aria-label="选项一"><span class="slot"></span></button>
  <button class="option" type="button" data-idx="1" aria-label="选项二"><span class="slot"></span></button>
  <button class="option" type="button" data-idx="2" aria-label="选项三"><span class="slot"></span></button>
</nav>

<!-- 彩带 -->
<div id="confetti" class="confetti" hidden aria-hidden="true"></div>

<script>
/* ============================================================
   语音库（由 tools/gen_voice.py 用微软 en-US-AnaNeural 音色生成后注入）
   每个 key 对应一段 base64 内联音频，页面零请求、离线可播。
   ============================================================ */
/* VOICE_BANK_START */

<script>
/* ============================================================
   第一关：数字与水果
   ============================================================ */
(function () {
  'use strict';

  var bank = window.VOICE_BANK || {};
  var cache = new Map();
  var current = null;
  var lastKey = null;
  var guardTimer = null;
  var speakToken = 0;

  var NUMBERS = [11, 12, 13, 14, 15];
  var FRUITS = [
    { id: 'apple', emoji: '🍎' },
    { id: 'banana', emoji: '🍌' },
    { id: 'strawberry', emoji: '🍓' },
    { id: 'grape', emoji: '🍇' }
  ];
  var TOTAL_ROUNDS = 12;
  var HINT_ROUNDS = 3;      // 前 3 轮显示闪烁小手

  var stage = document.getElementById('stage');
  var starsBox = document.getElementById('stars');
  var viewStart = document.getElementById('viewStart');
  var viewAsk = document.getElementById('viewAsk');
  var viewDone = document.getElementById('viewDone');
  var askDisplay = document.getElementById('askDisplay');
  var optionsBar = document.getElementById('options');
  var optionEls = Array.prototype.slice.call(document.querySelectorAll('.option'));
  var btnStart = document.getElementById('btnStart');
  var btnRestart = document.getElementById('btnRestart');
  var btnReplay = document.getElementById('btnReplay');
  var btnFull = document.getElementById('btnFull');
  var confettiBox = document.getElementById('confetti');

  var state = {
    phase: 'idle',      // idle | intro | asking | judging | done
    plan: [],
    roundIndex: 0,
    stars: 0,
    question: null,
    busy: false
  };

  /* ==================== 语音播放 ==================== */

  function getAudio(key) {
    if (!Object.prototype.hasOwnProperty.call(bank, key)) return null;
    if (!cache.has(key)) {
      var el = new Audio(bank[key]);
      el.preload = 'auto';
      el.setAttribute('playsinline', '');
      cache.set(key, el);
    }
    return cache.get(key);
  }

  function setSpeaking(on) {
    btnReplay.classList.toggle('speaking', !!on);
  }

  function clearGuard() {
    if (guardTimer) { clearTimeout(guardTimer); guardTimer = null; }
  }

  function stop() {
    clearGuard();
    setSpeaking(false);
    if (!current) return;
    var el = current;
    current = null;
    el.onended = null;
    el.onerror = null;
    try { el.pause(); } catch (e) { /* 忽略 */ }
    try { el.currentTime = 0; } catch (e) { /* 忽略 */ }
  }

  /** 播放单条语音；onDone 一定被调用一次（正常结束、出错或被兜底超时）。 */
  function speak(key, onDone) {
    var el = getAudio(key);
    if (!el) return false;

    stop();
    lastKey = key;
    current = el;
    setSpeaking(true);

    var finished = false;
    function finish() {
      if (finished) return;
      finished = true;
      clearGuard();
      if (current === el) { current = null; setSpeaking(false); }
      if (onDone) onDone();
    }

    el.onended = finish;
    el.onerror = finish;
    try { el.currentTime = 0; } catch (e) { /* 忽略 */ }

    // 兜底：即使音频卡住也不会让流程永远停住
    var dur = (isFinite(el.duration) && el.duration > 0) ? el.duration * 1000 : 8000;
    guardTimer = setTimeout(finish, dur + 1600);

    var p = el.play();
    if (p && typeof p.catch === 'function') {
      p.catch(function () { finish(); });
    }
    return true;
  }

  /** 顺序播放多条语音，全部结束后回调。 */
  function say(keys, onDone) {
    var list = Array.isArray(keys) ? keys.slice() : [keys];
    var myToken = ++speakToken;
    var i = 0;

    function step() {
      if (myToken !== speakToken) return;
      if (i >= list.length) { if (onDone) onDone(); return; }
      var key = list[i++];
      if (!speak(key, step)) step();
    }
    step();
  }

  /* ==================== 小工具 ==================== */

  function randInt(min, max) {
    return min + Math.floor(Math.random() * (max - min + 1));
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function pick(list, exclude) {
    var pool = list.filter(function (v) { return v !== exclude; });
    if (!pool.length) pool = list.slice();
    return pool[randInt(0, pool.length - 1)];
  }

  /** 目标值 + 两个不同的干扰值，打乱后返回 */
  function withDistractors(pool, answer) {
    var others = shuffle(pool.filter(function (v) { return v !== answer; })).slice(0, 2);
    return shuffle([answer].concat(others));
  }

  /* ==================== 出题 ==================== */

  // 12 轮中三种题型各 4 次，顺序随机且相邻不重复
  function makePlan() {
    var plan = [];
    for (var i = 0; i < TOTAL_ROUNDS; i++) plan.push(i % 3);
    shuffle(plan);
    for (var k = 1; k < plan.length; k++) {
      if (plan[k] === plan[k - 1]) {
        for (var m = k + 1; m < plan.length; m++) {
          if (plan[m] !== plan[k - 1]) {
            var t = plan[k]; plan[k] = plan[m]; plan[m] = t;
            break;
          }
        }
      }
    }
    return plan;
  }

  function makeQuestion(type, prev) {
    var num = pick(NUMBERS, prev ? prev.num : null);
    var fruit = pick(FRUITS, prev ? prev.fruit : null);

    if (type === 0) {
      // 题型一：认读数字，选三个数字
      var nums = withDistractors(NUMBERS, num);
      return {
        type: 'A',
        num: num,
        fruit: fruit,
        options: nums.map(function (v) { return { kind: 'num', value: v }; }),
        correct: nums.indexOf(num),
        audio: ['n' + num],
        reinforce: 'n' + num
      };
    }

    if (type === 1) {
      // 题型二：一堆水果，听名词选水果
      var others = shuffle(FRUITS.filter(function (f) { return f.id !== fruit.id; })).slice(0, 2);
      var list = shuffle([fruit].concat(others));
      var order = list.map(function (f) { return f.id; });
      return {
        type: 'B',
        num: num,
        fruit: fruit,
        options: list.map(function (f) { return { kind: 'fruit', fruit: f }; }),
        correct: order.indexOf(fruit.id),
        audio: ['f_' + fruit.id],
        reinforce: 'f_' + fruit.id
      };
    }

    // 题型三：听数量句，选数量正确的一堆
    var counts = withDistractors(NUMBERS, num);
    return {
      type: 'C',
      num: num,
      fruit: fruit,
      options: counts.map(function (v) { return { kind: 'pile', count: v, fruit: fruit }; }),
      correct: counts.indexOf(num),
      audio: ['q_' + num + '_' + fruit.id],
      reinforce: 'n' + num
    };
  }

  /* ==================== 渲染 ==================== */

  var starEls = [];

  function buildStars() {
    starsBox.innerHTML = '';
    starEls = [];
    for (var i = 0; i < TOTAL_ROUNDS; i++) {
      var s = document.createElement('span');
      s.className = 'star';
      s.textContent = '⭐';
      starsBox.appendChild(s);
      starEls.push(s);
    }
  }

  function lightStar(index) {
    var s = starEls[index];
    if (s) s.classList.add('on');
  }

  function clearStars() {
    starEls.forEach(function (s) { s.classList.remove('on'); });
  }

  function pileNode(emoji, count, variant) {
    var box = document.createElement('div');
    box.className = 'pile ' + (variant === 'opt' ? 'pile-opt' : 'pile-display');
    for (var i = 0; i < count; i++) {
      var span = document.createElement('span');
      span.textContent = emoji;
      box.appendChild(span);
    }
    return box;
  }

  function renderDisplay(q) {
    askDisplay.innerHTML = '';

    if (q.type === 'A') {
      var bubble = document.createElement('div');
      bubble.className = 'num-bubble';
      bubble.textContent = String(q.num);
      askDisplay.appendChild(bubble);
      return;
    }

    if (q.type === 'B') {
      askDisplay.appendChild(pileNode(q.fruit.emoji, q.num, 'display'));
      return;
    }

    var wrap = document.createElement('div');
    wrap.className = 'target-wrap';
    var fruit = document.createElement('div');
    fruit.className = 'target-fruit';
    fruit.textContent = q.fruit.emoji;
    var badge = document.createElement('span');
    badge.className = 'target-badge';
    badge.textContent = '🔍';
    wrap.appendChild(fruit);
    wrap.appendChild(badge);
    askDisplay.appendChild(wrap);
  }

  function removeHints(btn) {
    var hands = btn.querySelectorAll('.hint-hand');
    for (var i = hands.length - 1; i >= 0; i--) {
      hands[i].parentNode.removeChild(hands[i]);
    }
  }

  function renderOptions(q) {
    optionEls.forEach(function (btn, i) {
      removeHints(btn);
      btn.className = 'option';
      var slot = btn.querySelector('.slot');
      slot.className = 'slot';
      slot.innerHTML = '';

      var opt = q.options[i];
      if (!opt) return;

      if (opt.kind === 'num') {
        btn.classList.add('num-opt');
        slot.textContent = String(opt.value);
      } else if (opt.kind === 'fruit') {
        slot.textContent = opt.fruit.emoji;
      } else {
        btn.classList.add('pile-opt');
        slot.appendChild(pileNode(opt.fruit.emoji, opt.count, 'opt'));
      }

      if (state.roundIndex < HINT_ROUNDS && i === q.correct) {
        var hand = document.createElement('span');
        hand.className = 'hint-hand';
        hand.textContent = '👆';
        hand.setAttribute('aria-hidden', 'true');
        btn.appendChild(hand);
      }
    });
    optionsBar.classList.remove('off');
  }

  function clearOptions() {
    optionEls.forEach(function (btn) {
      removeHints(btn);
      btn.className = 'option';
      var slot = btn.querySelector('.slot');
      slot.className = 'slot';
      slot.innerHTML = '';
    });
  }

  function renderRound() {
    var q = state.question;
    state.phase = 'asking';
    state.busy = false;

    viewStart.hidden = true;
    viewDone.hidden = true;
    viewAsk.hidden = false;

    renderDisplay(q);
    renderOptions(q);

    // 朗读本轮题干
    say(q.audio);
  }

  function nextRound() {
    state.roundIndex += 1;
    if (state.roundIndex >= TOTAL_ROUNDS) { finish(); return; }
    state.question = makeQuestion(state.plan[state.roundIndex], state.question);
    renderRound();
  }

  /* ==================== 交互判定 ==================== */

  function handlePick(index, btn) {
    if (state.phase !== 'asking' || state.busy) return;
    var q = state.question;

    if (index === q.correct) {
      state.busy = true;
      state.phase = 'judging';
      optionsBar.classList.add('off');
      btn.classList.add('right');
      state.stars += 1;
      lightStar(state.roundIndex);
      say(['yes', q.reinforce], function () {
        setTimeout(nextRound, 420);
      });
    } else {
      state.busy = true;
      btn.classList.add('wrong');
      say(['again'], function () {
        btn.classList.remove('wrong');
        state.busy = false;
      });
    }
  }

  /* ==================== 开场 / 结算 / 重开 ==================== */

  function startGame() {
    if (state.phase !== 'idle') return;
    state.phase = 'intro';
    btnStart.hidden = true;
    say(['test'], function () {
      state.plan = makePlan();
      state.roundIndex = 0;
      state.stars = 0;
      clearStars();
      state.question = makeQuestion(state.plan[0], null);
      renderRound();
    });
  }

  function confetti() {
    confettiBox.innerHTML = '';
    var colors = ['#ff8fb1', '#ffd166', '#8ee09b', '#7fc4ff', '#c39bff', '#ff9f6e'];
    for (var i = 0; i < 100; i++) {
      var piece = document.createElement('i');
      piece.style.left = (Math.random() * 100) + '%';
      piece.style.background = colors[i % colors.length];
      piece.style.width = (5 + Math.random() * 8) + 'px';
      piece.style.height = (9 + Math.random() * 13) + 'px';
      piece.style.animationDuration = (2.2 + Math.random() * 2.8) + 's';
      piece.style.animationDelay = (Math.random() * 2.4) + 's';
      confettiBox.appendChild(piece);
    }
    confettiBox.hidden = false;
  }

  function finish() {
    state.phase = 'done';
    state.busy = false;
    viewAsk.hidden = true;
    optionsBar.classList.add('off');
    clearOptions();
    viewDone.hidden = false;
    confetti();
    say(['win']);
  }

  function restart() {
    stop();
    speakToken += 1;
    confettiBox.hidden = true;
    confettiBox.innerHTML = '';
    state.plan = makePlan();
    state.roundIndex = 0;
    state.stars = 0;
    state.busy = false;
    clearStars();
    state.question = makeQuestion(state.plan[0], null);
    renderRound();
  }

  /* ==================== 事件绑定 ==================== */

  btnStart.addEventListener('click', startGame);
  btnRestart.addEventListener('click', restart);

  optionEls.forEach(function (btn) {
    btn.addEventListener('click', function () {
      handlePick(parseInt(btn.dataset.idx, 10), btn);
    });
  });

  btnReplay.addEventListener('click', function () {
    btnReplay.classList.remove('ringing');
    void btnReplay.offsetWidth;
    btnReplay.classList.add('ringing');

    if (state.phase === 'intro') {
      say(['test']);
    } else if (state.phase === 'asking' && state.question) {
      say(state.question.audio);
    } else if (state.phase === 'done') {
      say(['win']);
    } else {
      speak(lastKey || 'test');
    }
  });

  btnFull.addEventListener('click', function () {
    var d = document;
    var target = d.fullscreenElement || d.webkitFullscreenElement;
    try {
      if (target) {
        (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      } else {
        var el = d.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen;
        var res = req.call(el);
        if (res && typeof res.catch === 'function') res.catch(function () {});
      }
    } catch (e) { /* 忽略 */ }
  });

  /* ==================== 初始化 ==================== */

  buildStars();
  Object.keys(bank).forEach(getAudio);   // 预热解码，避免首次播放延迟

  /* 对外接口：便于后续扩展关卡与自动化测试 */
  window.Game = {
    speak: speak,
    say: say,
    stop: stop,
    restart: restart,
    get phase() { return state.phase; },
    get round() { return state.roundIndex; },
    get stars() { return state.stars; },
    snapshot: function () {
      var q = state.question;
      return {
        phase: state.phase,
        round: state.roundIndex + 1,
        stars: state.stars,
        totalRounds: TOTAL_ROUNDS,
        question: q ? {
          type: q.type,
          num: q.num,
          fruit: q.fruit.id,
          correct: q.correct,
          audio: q.audio[0],
          options: q.options.map(function (o) {
            return o.kind === 'num' ? o.value : (o.kind === 'fruit' ? o.fruit.id : o.count);
          })
        } : null
      };
    },
    voiceKeys: Object.keys(bank)
  };
})();
</script>
