<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>儿童英语启蒙游戏 · 美术资产审查台</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --card: #1e222b;
    --card-hover: #252a35;
    --border: #2c323d;
    --text: #e8eaf0;
    --muted: #98a0ad;
    --accent: #ffb547;
    --accent-2: #4f9cff;
    --ok: #3ecf8e;
    --fix: #ff6b6b;
    --shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    padding-bottom: 96px;
    line-height: 1.5;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(180deg, rgba(15,17,21,.96), rgba(15,17,21,.86));
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
    padding: 18px 24px 14px;
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
  header .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 6px 12px; font-size: 13px; }
  .stat b { color: var(--accent); font-size: 15px; }

  main { max-width: 1080px; margin: 0 auto; padding: 22px 20px 0; }

  .group { margin-bottom: 30px; }
  .group-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 16px; font-weight: 600; margin: 6px 0 14px;
    color: var(--accent-2);
  }
  .group-title .count {
    font-size: 12px; color: var(--muted); font-weight: 400;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 999px; padding: 1px 10px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    display: flex; flex-direction: column;
    transition: border-color .15s, transform .1s;
  }
  .card:hover { border-color: #3a4250; transform: translateY(-2px); }
  .card.flagged { border-color: var(--fix); }
  .img-wrap {
    height: 140px; border-radius: 10px;
    background: #0c0e12;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; margin-bottom: 10px;
  }
  .img-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .img-wrap .emoji { font-size: 64px; }
  .key {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-size: 14px; color: var(--text); word-break: break-all;
  }
  .key .cat { color: var(--muted); font-size: 12px; }
  .radios { display: flex; gap: 8px; margin-top: 10px; }
  .radios label {
    flex: 1; text-align: center; cursor: pointer;
    border: 1px solid var(--border); border-radius: 9px;
    padding: 7px 0; font-size: 13px; user-select: none;
    transition: all .12s;
  }
  .radios input { display: none; }
  .radios label.ok:hover { border-color: var(--ok); }
  .radios label.fix:hover { border-color: var(--fix); }
  .radios input:checked + span.ok { color: var(--ok); }
  .radios label.l-ok.sel { background: rgba(62,207,142,.14); border-color: var(--ok); color: var(--ok); }
  .radios label.l-fix.sel { background: rgba(255,107,107,.14); border-color: var(--fix); color: var(--fix); }

  /* Fixed bottom bar */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: rgba(20,23,30,.96);
    border-top: 1px solid var(--border);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; gap: 14px;
    padding: 14px 22px;
  }
  .bar .progress { color: var(--muted); font-size: 13px; }
  .bar .progress b { color: var(--fix); }
  .bar .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border); background: var(--panel);
    color: var(--text); border-radius: 10px; padding: 10px 16px;
    font-size: 14px; cursor: pointer; transition: all .12s;
  }
  .btn:hover { border-color: #3a4250; }
  .btn.ghost { color: var(--muted); }
  .btn.primary {
    background: var(--accent); color: #1a1205; border-color: var(--accent);
    font-weight: 700;
  }
  .btn.primary:hover { filter: brightness(1.06); }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; box-shadow: var(--shadow);
    width: min(640px, 100%); max-height: 80vh; display: flex; flex-direction: column;
  }
  .modal h2 { margin: 0; padding: 18px 22px 6px; font-size: 17px; }
  .modal .desc { padding: 0 22px 12px; color: var(--muted); font-size: 13px; }
  .modal pre {
    margin: 0 22px; background: #0c0e12; border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; overflow: auto; max-height: 42vh;
    font-family: Consolas, "Liberation Mono", monospace; font-size: 13px; color: #cfe3ff;
    white-space: pre;
  }
  .modal .actions { display: flex; gap: 10px; justify-content: flex-end; padding: 16px 22px; }
  .empty { color: var(--ok); padding: 0 22px 16px; font-size: 14px; }

  .loading { text-align: center; color: var(--muted); padding: 60px 0; font-size: 15px; }
  .err { color: var(--fix); }
  @media (max-width: 600px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  }
</style>
</head>
<body>
  <header>
    <h1>🎨 美术资产审查台</h1>
    <div class="sub">儿童英语启蒙游戏 · 图片素材审查（数据源：<code>assets.js</code>，未做任何改动）</div>
    <div class="stats" id="stats">
      <div class="stat">图片分组 <b id="s-groups">…</b></div>
      <div class="stat">素材总数 <b id="s-total">…</b></div>
      <div class="stat">已标记「需修改」 <b id="s-fix">0</b></div>
    </div>
  </header>

  <main id="content">
    <div class="loading" id="loading">正在解析 assets.js 中的图片数据…</div>
  </main>

  <div class="bar">
    <div class="progress">需修改：<b id="bar-fix">0</b> 项</div>
    <div class="spacer"></div>
    <button class="btn ghost" id="btn-all-ok">全部标为满意</button>
    <button class="btn ghost" id="btn-all-fix">全部标为需修改</button>
    <button class="btn primary" id="btn-generate">生成反馈清单</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2>📋 反馈清单（仅含「需修改」）</h2>
      <div class="desc">请将以下内容交回给开发，作为下一步美术替换的依据。</div>
      <div id="modal-body"></div>
      <div class="actions">
        <button class="btn" id="btn-copy">复制 JSON</button>
        <button class="btn" id="btn-download">下载 .json</button>
        <button class="btn primary" id="btn-close">关闭</button>
      </div>
    </div>
  </div>

  <!-- 加载 assets.js 本身（只读，未修改任何数据） -->
  <script src="assets.js"></script>
  <script>
  (function () {
    "use strict";

    // 判定某个 window 属性是否为「图片素材对象」：
    // 对象且每个值都是字符串（data-uri / svg / emoji）
    function isImageAssetMap(obj) {
      if (!obj || typeof obj !== "object" || Array.isArray(obj)) return false;
      var ks = Object.keys(obj);
      if (ks.length === 0) return false;
      return ks.every(function (k) { return typeof obj[k] === "string"; });
    }

    function renderImage(value) {
      if (value.indexOf("data:image") === 0 || value.trim().indexOf("<svg") === 0) {
        return '<img src="' + value + '" alt="asset" loading="lazy" />';
      }
      // emoji / 文本素材
      return '<div class="emoji">' + value + "</div>";
    }

    var content = document.getElementById("content");
    var loading = document.getElementById("loading");

    // 动态解析 assets.js 中所有图片对象
    var groups = Object.keys(window)
      .filter(function (k) { return isImageAssetMap(window[k]); })
      .sort();

    if (groups.length === 0) {
      loading.className = "loading err";
      loading.textContent = "未能从 assets.js 解析到图片数据。请确认 review.html 与 assets.js 位于同一目录（仓库根目录）。";
      return;
    }

    var total = groups.reduce(function (s, g) { return s + Object.keys(window[g]).length; }, 0);
    document.getElementById("s-groups").textContent = groups.length;
    document.getElementById("s-total").textContent = total;

    loading.remove();

    var fixCount = 0;

    groups.forEach(function (group) {
      var map = window[group];
      var keys = Object.keys(map);

      var section = document.createElement("section");
      section.className = "group";

      var title = document.createElement("div");
      title.className = "group-title";
      title.innerHTML = group + ' <span class="count">' + keys.length + " 张</span>";
      section.appendChild(title);

      var grid = document.createElement("div");
      grid.className = "grid";

      keys.forEach(function (key) {
        var card = document.createElement("div");
        card.className = "card";
        card.setAttribute("data-group", group);
        card.setAttribute("data-key", key);

        var wrap = document.createElement("div");
        wrap.className = "img-wrap";
        wrap.innerHTML = renderImage(map[key]);
        card.appendChild(wrap);

        var label = document.createElement("div");
        label.className = "key";
        label.innerHTML = '<span class="cat">' + group + ".</span>" + key;
        card.appendChild(label);

        var radios = document.createElement("div");
        radios.className = "radios";
        var rid = "r_" + group + "_" + key;
        radios.innerHTML =
          '<label class="l-ok sel"><input type="radio" name="' + rid + '" value="ok" checked /><span class="ok">满意</span></label>' +
          '<label class="l-fix"><input type="radio" name="' + rid + '" value="fix" /><span class="fix">需修改</span></label>';
        card.appendChild(radios);

        // 选中态样式
        var inputs = radios.querySelectorAll("input");
        inputs.forEach(function (inp) {
          inp.addEventListener("change", function () {
            var okLabel = radios.querySelector(".l-ok");
            var fixLabel = radios.querySelector(".l-fix");
            okLabel.classList.toggle("sel", inp.value === "ok" && inp.checked);
            fixLabel.classList.toggle("sel", inp.value === "fix" && inp.checked);
            card.classList.toggle("flagged", inp.value === "fix" && inp.checked);
            updateProgress();
          });
        });

        grid.appendChild(card);
      });

      section.appendChild(grid);
      content.appendChild(section);
    });

    function updateProgress() {
      fixCount = document.querySelectorAll('input[type="radio"][value="fix"]:checked').length;
      document.getElementById("s-fix").textContent = fixCount;
      document.getElementById("bar-fix").textContent = fixCount;
    }

    function buildFeedback() {
      var result = {};
      var flat = [];
      document.querySelectorAll('input[type="radio"][value="fix"]:checked').forEach(function (inp) {
        var card = inp.closest(".card");
        var group = card.getAttribute("data-group");
        var key = card.getAttribute("data-key");
        if (!result[group]) result[group] = [];
        result[group].push(key);
        flat.push(group + "." + key);
      });
      return { grouped: result, flat: flat };
    }

    // 批量操作
    document.getElementById("btn-all-ok").addEventListener("click", function () {
      document.querySelectorAll('input[type="radio"][value="ok"]').forEach(function (i) {
        i.checked = true; i.dispatchEvent(new Event("change"));
      });
    });
    document.getElementById("btn-all-fix").addEventListener("click", function () {
      document.querySelectorAll('input[type="radio"][value="fix"]').forEach(function (i) {
        i.checked = true; i.dispatchEvent(new Event("change"));
      });
    });

    // 生成反馈清单
    var overlay = document.getElementById("overlay");
    var modalBody = document.getElementById("modal-body");

    document.getElementById("btn-generate").addEventListener("click", function () {
      var fb = buildFeedback();
      if (fb.flat.length === 0) {
        modalBody.innerHTML = '<div class="empty">✅ 当前没有标记「需修改」的素材。若确有需要替换的图，请在对应卡片选择「需修改」。</div>';
      } else {
        var json = JSON.stringify(fb.grouped, null, 2);
        modalBody.innerHTML =
          '<pre id="feedback-json">' + json.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</pre>" +
          '<div class="desc" style="padding:12px 22px 0">共 ' + fb.flat.length + " 项需修改：" +
          fb.flat.join("、") + "</div>";
        overlay._json = json;
      }
      overlay.classList.add("show");
      updateProgress();
    });

    document.getElementById("btn-close").addEventListener("click", function () {
      overlay.classList.remove("show");
    });
    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) overlay.classList.remove("show");
    });

    document.getElementById("btn-copy").addEventListener("click", function () {
      var text = overlay._json || "";
      if (!text) return;
      navigator.clipboard?.writeText(text).then(function () {
        var b = document.getElementById("btn-copy");
        var t = b.textContent; b.textContent = "已复制 ✓";
        setTimeout(function () { b.textContent = t; }, 1500);
      });
    });

    document.getElementById("btn-download").addEventListener("click", function () {
      var text = overlay._json || "";
      if (!text) return;
      var blob = new Blob([text], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "art-review-feedback.json";
      a.click();
      URL.revokeObjectURL(a.href);
    });

    updateProgress();
  })();
  </script>
</body>
</html>
